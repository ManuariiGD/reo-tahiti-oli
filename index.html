/* ============ génération des questions ============ */
function vocabDistractors(v,n,field){
  const pool=(VBYCAT[v.c]||[]).filter(id=>V[id].l===v.l).concat(shuffle(VBYCAT[v.c]||[])).concat(pick(VIDS,40));
  const out=[],seen=new Set([norm(field==='t'?v.t:v.f[0])]);
  for(const id of pool){const w=V[id];const val=field==='t'?w.t:w.f[0];const k=norm(val);
    if(seen.has(k)||(field==='f'&&w.f.some(x=>v.f.includes(x))))continue;seen.add(k);out.push(val);if(out.length>=n)break;}
  return out;
}
function qMcqTahFr(id){const v=V[id];const opts=shuffle([v.f[0],...vocabDistractors(v,3,'f')]);
  return {type:'mcq',key:'v:'+id,label:'Que signifie ce mot ?',prompt:v.t,ptah:true,choices:opts,answer:opts.indexOf(v.f[0]),expl:v.f.join(' ; '),note:v.n,flag:v.q};}
function qMcqFrTah(id){const v=V[id];const opts=shuffle([v.t,...vocabDistractors(v,3,'t')]);
  return {type:'mcq',key:'v:'+id,label:'Comment dit-on en tahitien ?',prompt:v.f.join(' ; '),ctah:true,choices:opts,answer:opts.indexOf(v.t),expl:v.t,note:v.n,flag:v.q};}
function qTypeFrTah(id){const v=V[id];const ans=variants(v.t);const core=v.t.replace(/^(te mau|tau na|te|na|nau)\s+/,'');if(core!==v.t)ans.push(...variants(core));
  return {type:'type',key:'v:'+id,label:'Écris en tahitien',prompt:v.f.join(' ; '),answers:ans,lang:'tah',expl:v.t,note:v.n};}
function qTypeTahFr(id){const v=V[id];return {type:'type',key:'v:'+id,label:'Traduis en français',prompt:v.t,ptah:true,answers:v.f,lang:'fr',expl:v.f.join(' ; '),note:v.n};}
function qCard(id){const v=V[id];return {type:'card',key:'v:'+id,front:v.t,back:v.f.join(' ; '),note:v.n};}
function qPairs(ids){return {type:'pairs',keys:ids.map(i=>'v:'+i),pairs:ids.map(i=>[V[i].t,V[i].f[0]])};}
function bookEx(id){const x=X[id];if(!x||!x.a.length)return null;
  const series=Object.keys(X).filter(k=>X[k].p===x.p&&X[k].l===x.l&&k!==id);
  const meta={key:'x:'+id,flag:x.v,note:x.r,src:'Exercice §'+x.p+' n°'+x.n};
  if(x.d==='tah>fr'){
    const others=pick(series.map(k=>X[k].a[0]).filter(a=>a&&norm(a)!==norm(x.a[0])),3);
    const opts=shuffle([x.a[0],...others]);
    return Object.assign({type:'mcq',label:'Traduis : '+x.c.replace('Traduire','').trim(),prompt:x.q,ptah:true,long:true,choices:opts,answer:opts.indexOf(x.a[0]),expl:x.a[0]},meta);
  }
  const ans=x.a[0];const toks=tokens(ans);
  const pool=[...new Set(series.flatMap(k=>tokens(X[k].a[0]||'')))].filter(t=>!toks.some(u=>norm(u)===norm(t)));
  if(S.settings.typing||toks.length>12)return Object.assign({type:'type',label:'Traduis en tahitien',prompt:x.q,answers:x.a,lang:'tah',expl:ans},meta);
  return Object.assign({type:'bank',label:'Traduis en tahitien',prompt:x.q,tokens:shuffle([...toks,...pick(pool,3)]),answers:x.a,expl:ans},meta);
}
// noms propres = mots capitalisés rencontrés ailleurs qu'en début de phrase
const PROPER=new Set();(()=>{const add=t=>t.split(/\s+/).slice(1).forEach(w=>{if(/^[A-ZĀĒĪŌŪʻ]/.test(w.replace(/^ʻ/,''))&&/[A-ZĀĒĪŌŪ]/.test(w))PROPER.add(w.replace(/[.,?!;:]/g,''));});
  Object.values(X).forEach(x=>{add(x.q);x.a.forEach(add);});Object.values(G).forEach(g=>g.e.forEach(e=>add(e[0])));})();
function tokens(s){const t=s.replace(/\s*\([^)]*\)/g,'').replace(/[.?!]+\s*$/,'').replace(/\s[?!]$/,'').split(/\s+/).filter(Boolean);
  if(t.length&&!PROPER.has(t[0]))t[0]=t[0].toLowerCase();return t;}
function exampleQs(gid,max){
  const g=G[gid];if(!g)return [];const out=[];
  const ex=shuffle(g.e.map((e,i)=>[e,i]).filter(([e])=>!/[…\/=]/.test(e[0])&&!/[…]/.test(e[1])));
  for(const [e,i] of ex){
    if(out.length>=max)break;
    const tk=tokens(e[0]);const key='e:'+gid+'#'+i;
    const pi=tk.findIndex(t=>PARTS.includes(norm(t)));
    if(pi>=0&&Math.random()<0.55){
      const p=norm(tk[pi]);const same=PARTS.filter(x=>x!==p&&PGROUP[x]===PGROUP[p]&&!tk.some(t=>norm(t)===x));
      const other=PARTS.filter(x=>PGROUP[x]!==PGROUP[p]&&!tk.some(t=>norm(t)===x));
      const opts=shuffle([p,...pick(same,2),...pick(other,3-Math.min(2,same.length))].slice(0,4));
      out.push({type:'cloze',key,label:'Complète avec la bonne particule',before:tk.slice(0,pi).join(' '),after:tk.slice(pi+1).join(' '),choices:opts,answer:opts.indexOf(p),fr:e[1],expl:e[0]});
    }else if(tk.length>=3&&tk.length<=9){
      out.push({type:'bank',key,label:'Remets la phrase dans l\'ordre',prompt:e[1],tokens:shuffle(tk),answers:[e[0]],expl:e[0],order:true});
    }else{
      const others=pick(g.e.filter((_,j)=>j!==i).map(x=>x[1]),3);if(others.length<2)continue;
      const opts=shuffle([e[1],...others]);
      out.push({type:'mcq',key,label:'Que signifie cette phrase ?',prompt:e[0],ptah:true,long:true,choices:opts,answer:opts.indexOf(e[1]),expl:e[1]});
    }
  }
  return out;
}
function buildUnit(uid){
  const u=UNIT[uid];const vs=u.v.filter(id=>V[id]);let q=[];
  vs.forEach(id=>q.push(qMcqTahFr(id)));
  q=shuffle(q);
  if(vs.length>=4)q.push(qPairs(pick(vs,Math.min(5,vs.length))));
  const ty=vs.filter(id=>typeable(V[id]));
  pick(vs.filter(id=>!ty.slice(0,3).includes(id)),Math.min(4,vs.length)).forEach(id=>q.push(qMcqFrTah(id)));
  pick(ty,3).forEach(id=>q.push(qTypeFrTah(id)));
  if(ty.length)q.push(qTypeTahFr(pick(ty,1)[0]));
  u.x.forEach(id=>{const b=bookEx(id);if(b)q.push(b);});
  const gids=u.g.length?u.g:LESSON[u.l].g;
  let exq=gids.flatMap(g=>exampleQs(g,2));exq=shuffle(exq).slice(0,u.g.length?5:3);q.push(...exq);
  if(q.length<8){for(const g of shuffle(LESSON[u.l].g)){q.push(...exampleQs(g,2));if(q.length>=10)break;}}
  if(q.length>22){const keep=q.filter(x=>x.type!=='mcq'||x.label!=='Comment dit-on en tahitien ?');q=keep.length>=12?keep:q;}
  return q.slice(0,24);
}
function buildReview(keys){
  const q=[];
  for(const k of keys){const [ty,id]=k.split(':');
    if(ty==='v'){const v=V[id];const r=Math.random();
      q.push(r<.3?qMcqTahFr(id):r<.55?qMcqFrTah(id):(r<.8&&typeable(v))?qTypeFrTah(id):qCard(id));}
    else if(ty==='x'){const b=bookEx(id);if(b)q.push(b);}
    else if(ty==='e'){const [gid,i]=id.split('#');const e=G[gid]&&G[gid].e[+i];if(!e)continue;
      const tk=tokens(e[0]);q.push({type:'bank',key:k,label:'Remets la phrase dans l\'ordre',prompt:e[1],tokens:shuffle(tk),answers:[e[0]],expl:e[0],order:true});}
  }
  return q;
}

let SESS=null;
function session(arg){
  if(!SESS||SESS.arg!==arg){SESS={arg,qs:arg.qs.slice(),i:0,total:arg.qs.length,good:0,xp:0,mistakes:[],retried:new Set()};}

  const body=h('div');$app.append(body);
  ({mcq:rMcq,type:rType,bank:rBank,cloze:rCloze,pairs:rPairs,card:rCard}[q.type])(q,body);
}
function checkZone(label,fn,disabled){const b=h('button',{class:'btn',disabled:disabled?true:null,onclick:fn},label);
  const z=h('div',{class:'check-zone'},h('div',{class:'in'},b));$app.append(h('div',{class:'spacer'}),z);return b;}
function answered(q,res){ // res {ok,warn,expected,why}
  const quality=res.ok?(res.warn?3:4):1;
  if(q.key)srsUpdate(q.key,quality);
  const isTah=!!(q.ctah||q.type==='bank'||q.type==='cloze'||q.lang==='tah');
  if(res.ok){if(!q.retry)SESS.good++;const g=res.warn?2:3;SESS.xp+=g;addXP(g);}
  else{if(!q.retry)SESS.mistakes.push({prompt:q.prompt||((q.before||'')+' … '+(q.after||'')),ptah:!!(q.ptah||q.type==='cloze'),expected:q.expl,etah:isTah});
    if(!SESS.retried.has(q)){SESS.retried.add(q);SESS.qs.push(rebuild(q));}}
  save();
  const z=document.querySelector('.check-zone');if(z)z.remove();
  const cls=res.ok?(res.warn?'warn':'ok'):'bad';
  const title=res.ok?(res.warn?'Presque parfait !':pick(['Bravo !','Maitaʻi roa !','Exact !','Très bien !'],1)[0]):'Pas tout à fait…';
  const fb=h('div',{class:'fb '+cls},h('div',{class:'in'},h('div',{class:'t'},title),
    res.why?h('div',{class:'d'},res.why):null,
    (!res.ok||res.warn)?h('div',{class:'d'},'Réponse : ',isTah?T(q.expl):q.expl):null,
    q.note?h('div',{class:'d small'},'ℹ︎ ',q.note):null,
    q.flag?h('div',{class:'d small'},'⚠︎ Ce point est marqué « à vérifier » dans le livre.'):null,
    q.src?h('div',{class:'d small muted'},q.src):null,
    h('button',{class:'btn',onclick:()=>{SESS.i++;render();}},'Continuer')));
  $app.append(fb);fb.querySelector('button').focus();
}
function rebuild(q){ // nouvelle version d'une question ratée (mélange)
  const c=Object.assign({},q,{retry:true});if(c.choices){const ans=c.choices[c.answer];c.choices=shuffle(c.choices);c.answer=c.choices.indexOf(ans);}
  if(c.tokens)c.tokens=shuffle(c.tokens);return c;}
function header(q){return [h('div',{class:'qlabel'},q.label),h('div',{class:'prompt'+(q.long?' long':'')},q.ptah?T(q.prompt):q.prompt)];}
function rMcq(q,body){
  body.append(...header(q));let sel=-1;const btns=[];
  const box=h('div',{class:'choices'});q.choices.forEach((c,i)=>{const b=h('button',{class:'choice',onclick:()=>{if(done)return;sel=i;btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chk.disabled=false;}},q.ctah?T(c):c);btns.push(b);box.append(b);});
  body.append(box);let done=false;
  const chk=checkZone('Vérifier',()=>{done=true;const ok=sel===q.answer;btns[q.answer].classList.add('good');if(!ok)btns[sel].classList.add('badc');answered(q,{ok});},true);
}
function keyboard(input){
