<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6e6c">
<title>Reo Tahiti</title>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1d2321; --muted:#68716e; --line:#e4dfd5;
  --lagoon:#0e6e6c; --lagoon-soft:#d9eeec; --sand:#efe6d4; --sun:#e9a23b; --sun-soft:#fbefd9;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --bad:#c2412d; --bad-soft:#f9e0db; --warn:#a46a00; --warn-soft:#fbf0d6;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121514; --card:#1b201f; --ink:#e8ecea; --muted:#9aa5a1; --line:#2b3331;
  --lagoon:#4fb8b4; --lagoon-soft:#16312f; --sand:#2a2721; --sun:#f0b558; --sun-soft:#3a2f1c;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#ef7a66; --bad-soft:#3b1f1a; --warn:#e8b84f; --warn-soft:#3a3018;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.tah{font-family:Georgia,"Noto Serif","Times New Roman",serif;font-style:italic;color:var(--lagoon)}
.muted{color:var(--muted)} .small{font-size:.85em}
h1{font-size:1.35em;margin:.6em 0 .3em} h2{font-size:1.12em;margin:1.2em 0 .5em} h3{font-size:1em;margin:1em 0 .3em}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:650;background:var(--lagoon);color:#fff;cursor:pointer;margin:10px 0;text-align:center;font-size:1em}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--lagoon);border:2px solid var(--lagoon)}
.btn.soft{background:var(--lagoon-soft);color:var(--lagoon)}
.btn.danger{background:var(--bad)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
/* barre du haut */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:650;font-size:.92em}
.goal{flex:1}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.goal .lbl{font-size:.78em;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between}
/* parcours */
.lesson{margin:18px 0 6px}
.lesson .hd{display:flex;align-items:baseline;gap:8px}
.lesson .num{font-weight:800;color:var(--lagoon);font-size:.85em;letter-spacing:.04em;text-transform:uppercase}
.lesson .ttl{font-weight:650}
.nodes{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.node{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;font-weight:750;cursor:pointer;background:var(--lagoon-soft);color:var(--lagoon);position:relative}
.node.done{background:var(--lagoon);color:#fff}
.node.next{background:var(--sun);color:#fff;box-shadow:0 0 0 4px var(--sun-soft)}
.node.locked{background:var(--line);color:var(--muted);cursor:default}
.continue{position:relative}
/* navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:.72em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button b{font-size:1.55em;line-height:1;font-weight:400}
nav button.on{color:var(--lagoon);font-weight:700}
/* séance */
.sess-top{display:flex;align-items:center;gap:12px;padding:12px 0}
.x{border:0;background:none;font-size:1.6em;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px;flex:none}
.sess-top .bar{flex:1;height:14px}
.sess-top .bar>i{background:var(--lagoon)}
.qlabel{font-size:.82em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.prompt{font-size:1.45em;line-height:1.3;margin:4px 0 16px}
.prompt.long{font-size:1.15em}
.choices{display:grid;gap:10px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;font-size:1.02em}
.choice.sel{border-color:var(--lagoon);background:var(--lagoon-soft)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.badc{border-color:var(--bad);background:var(--bad-soft)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pairs .choice{text-align:center;padding:12px 8px;min-height:52px}
.pairs .choice.gone{opacity:.25;cursor:default}
.pairs .choice.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input.ans,textarea.ans{width:100%;font:inherit;font-size:1.1em;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.ans:focus,textarea.ans:focus{outline:none;border-color:var(--lagoon)}
.kbd{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.kbd button{flex:1;min-width:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-size:1.15em;cursor:pointer;font-family:Georgia,serif}
.kbd button.on{background:var(--lagoon-soft);border-color:var(--lagoon)}
.bank-ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;font-family:Georgia,serif;font-style:italic;font-size:1.05em}
.tile.used{visibility:hidden}
.cloze .gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--lagoon);text-align:center;font-style:normal;font-weight:700}
.fcard{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:1.4em;padding:24px}
.fcard .back{font-size:.8em;color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades .btn{padding:12px 4px;font-size:.88em;margin:0}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.fb .in{max-width:560px;width:100%}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)} .fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb .t{font-weight:800;font-size:1.15em}
.fb .d{color:var(--ink);margin:4px 0 2px}
.fb .btn{margin-top:12px}
.fb.ok .btn{background:var(--ok)} .fb.bad .btn{background:var(--bad)} .fb.warn .btn{background:var(--warn)}
.check-zone{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.check-zone .in{max-width:560px;width:100%}
.check-zone .btn{margin:0}
.spacer{height:110px}
/* fiche */
.formula{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:.82em;background:var(--lagoon-soft);color:var(--lagoon);border-radius:8px;padding:3px 8px;margin:3px 4px 3px 0}
.ex{display:grid;grid-template-columns:1fr;gap:1px;padding:7px 0;border-top:1px solid var(--line)}
.ex .fr{color:var(--muted);font-size:.92em}
.words{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.flag{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:6px;font-size:.72em;padding:1px 6px;margin-left:6px;font-weight:700;font-style:normal}
details.more summary{cursor:pointer;color:var(--lagoon);font-weight:650;padding:6px 0}
.text{white-space:pre-wrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat b{display:block;font-size:1.6em}
.list .it{padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;cursor:pointer;font-weight:650}
.seg button.on{border-color:var(--lagoon);background:var(--lagoon-soft);color:var(--lagoon)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.toggle input{width:22px;height:22px;accent-color:var(--lagoon)}
.center{text-align:center}
.big{font-size:3em;line-height:1.1}
</style>
</head>

s":156},"L26-V203":{"t":"tomo","f":["entrer"],"c":"verbe","l":"L26","s":156},"L26-V204":{"t":"te faʻaroʻo","f":["la religion"],"c":"nom","l":"L26","s":156},"L26-V205":{"t":"te pupu","f":["le groupe"],"c":"nom","l":"L26","s":156},"L26-V206":{"t":"te pupu faʻaʻārearea","f":["l'orchestre de divertissement"],"c":"nom","l":"L26","s":156},"L26-V207":{"t":"ʻōpani","f":["fermer"],"c":"verbe","l":"L26","s":156},"L26-V208":{"t":"te taʻaʻēraʻa","f":["la séparation","les adieux"],"c":"nom","l":"L26","s":157},"L26-V209":{"t":"faʻaoti","f":["achever"],"c":"verbe","l":"L26","s":157},"L26-V210":{"t":"hoʻi","f":["revenir","rentrer"],"c":"verbe","l":"L26","s":157}},"G":{"L01-G1":{"p":"1","t":"Consonnes","r":"Huit consonnes : f, h, m, n, p, r, t, v (plus l'occlusion glottale ʻeta, voir §5). Elles se prononcent à peu près comme en français ; h comme dans l'anglais « home » ; r roulé d'un seul battement ; p et t sans souffle. Certains mots ont des variantes r/n ou f/h ; le livre ne donne que la plus usuelle. Deux consonnes ne se suivent jamais et aucun mot ne finit par une consonne.","f":[],"e":[["ravaʻi / navaʻi","être suffisant"],["roaʻa / noaʻa","obtenir / être acquis"],["pūhā / pūfā","coprah"],["ufi / uhi","igname"],["tufaʻa / tuhaʻa","part"]],"l":"L01"},"L01-G2":{"p":"2","t":"Voyelles","r":"Cinq voyelles : a (comme dans « patte »), e (« été »), i (« ville »), o (« eau »), u (« cou »). Remarque : rahi (grand), inanahi (hier) et ananahi (demain) se prononcent souvent rahai, inanahai et ananahai.","f":[],"e":[],"l":"L01"},"L01-G3":{"p":"3","t":"Longueur des voyelles","r":"Chaque voyelle a une forme longue, marquée d'un tārava (macron) : ā, ē, ī, ō, ū. Elle se prononce comme une voyelle double. De nombreuses paires de mots ne se distinguent que par la longueur d'une voyelle.","f":[],"e":[["parau","parler"],["pārau","nacre"],["matau","hameçon"],["mātau","connaître"],["marō","sec"],["mārō","être têtu"],["nana","troupeau"],["nā na","pour lui"],["mati","nom d'arbre"],["māti","mars"],["fefe","tordu"],["fēfē","furoncle"],["pepe","papillon"],["pēpē","blesser"],["i","à / par"],["ʻī","plein"],["ʻapi","page"],["ʻāpī","nouveau"],["poro","coin"],["pōro","bille"],["maro","ceinture royale"],["pupu","groupe"],["pūpū","coquillage"],["tutu","espèce d'arbre"],["tūtu","cuisiner"]],"l":"L01"},"L01-G4":{"p":"4","t":"Séquences de voyelles","r":"Les séquences de deux (ou trois) voyelles sont courantes ; chaque voyelle se prononce distinctement, mais ai, au, ae, ei, eu et oi tendent à être diphtonguées. Deux consonnes ne se suivent jamais.","f":[],"e":[["tāpū","couper"],["haere","aller"],["vai","être"],["ao","monde / jour"],["mea","chose"],["ʻē","différent"],["hei","collier"],["reo","langage"],["pāreu","paréo"],["ia","quand"],["ʻohie","facile"],["hio","siffler"],["fiu","las"],["hoa","ami"],["hoe","pagayer"],["hōpoi","transporter"],["hou","avant"],["puaʻa","cochon"],["ueue","secouer"],["nui","immense"],["ʻuoʻuo","blanc"]],"l":"L01"},"L01-G5":{"p":"5","t":"L'occlusion glottale (ʻeta)","r":"Le ʻeta, noté par une apostrophe, est une vraie consonne : on bloque l'air avec la glotte avant la voyelle suivante (un hiatus, le contraire d'une liaison). Les particules o, e, i, ia sont souvent précédées d'un ʻeta affaibli (ʻo, ʻe, ʻi, ʻia) ; le manuel ne le marque pas.","f":[],"e":[["puaʻa","cochon"],["iʻoa","nom"],["ʻāpoʻo","trou"],["haʻari","noix de coco"]],"l":"L01"},"L01-G6":{"p":"6","t":"Mots commençant par une voyelle","r":"La voyelle initiale peut être : brève avec ʻeta (ʻoe), longue avec ʻeta (ʻōfaʻi), brève sans ʻeta (au), longue sans ʻeta (ātea). Des mots ne se distinguent que par là.","f":[],"e":[["ʻoe","toi, tu"],["ʻurī","chien"],["ʻumara","patate douce"],["ʻamu","manger"],["ʻōfaʻi","pierre"],["ʻīā","dérober"],["au","je, moi"],["Atua","Dieu"],["iʻa","poisson"],["aʻo","prêcher"],["oʻe","disette"],["oe","cloche"],["ātea","lointain"],["ʻau","nager"],["aʻu","chasser"]],"l":"L01"},"L01-G6b":{"p":"6b","t":"Paires distinguées par le ʻeta","r":"","f":[],"e":[["ʻata","rire"],["ata","nuage"],["ʻatā","difficile"],["ʻātā","paquet de fruits"],["ʻua","marque du passé"],["ua","pluie / pleuvoir"],["uʻa","bernard-l'hermite"],["ʻoi","pointu / aiguisé"],["oi","mélanger"],["ʻoʻi","se faire une entorse"],["ʻaʻo","graisse / chair"],["aʻo","prêcher"],["ao","monde / jour"],["ʻori","danser"],["ori (haere)","se promener"]],"l":"L01"},"L01-G7":{"p":"7","t":"La syllabe","r":"La syllabe a pour formule (consonne ou ʻeta facultatif) + voyelle obligatoire (voyelle brève, longue ou séquence de deux voyelles).","f":["± C + V"],"e":[["pō-ti-ʻi","jeune fille"],["ta-mai-ti","fils"],["ta-ʻa-ta","personne"],["ʻoi-a","il, elle"],["ʻō-tā-ne","mâle (poisson, arbre)"],["ma-nu","oiseau"]],"l":"L01"},"L01-G8":{"p":"8","t":"Accent tonique","r":"L'accent est très faible. Il tombe sur la voyelle longue ou la première voyelle d'une séquence ; s'il y en a deux, sur la première ; sinon sur l'avant-dernière syllabe ; chaque partie d'un mot composé garde son accent.","f":[],"e":[["tiare","fleur"],["raiti","riz"],["tiaʻa","chaussure"],["pahī","navire"],["tamaiti","fils"],["tamāhine","fille"],["fēiā","groupe"],["tamāroa","garçon"],["faraoa","pain"],["fare","maison"],["maʻo","requin"],["taʻata","personne"],["ʻohipa","travail"],["puaʻa-niho","chèvre"],["puaʻa-horo-fenua","cheval"]],"l":"L01"},"L01-G9":{"p":"9","t":"Élision","r":"Deux voyelles identiques qui se suivent entre deux mots forment une voyelle longue (ia avatea se prononce iāvatea). Le livre ne marque pas ces élisions : l'apostrophe est réservée au ʻeta.","f":[],"e":[["ia avatea","aux heures chaudes de la journée"]],"l":"L01"},"L02-G11":{"p":"11","t":"Articles généraux","r":"Défini : te (« le, la », et souvent aussi « un, une » à l'oral) ; pluriel te mau. Le nom lui-même ne change pas au pluriel ; te seul peut aussi exprimer un pluriel collectif (te taʻata = les gens). Indéfini : te hōʻē (« un, une »), te hōʻē mau (pluriel restreint : « des, certains »), te tahi (« un » au sens très général), te tahi mau ou vetahi mau (« des »).","f":["te + nom = le/la","te mau + nom = les","te hōʻē + nom = un/une"],"e":[["te fare","la maison"],["te taʻata","l'homme"],["te ʻuru","le fruit à pain"],["te mau fare","les maisons"],["te mau taʻata","les hommes"],["te mau ʻurī","les chiens"],["te taʻata","les gens / le public"],["te hōʻē pahī","un navire"],["te hōʻē fare","une maison"],["te hōʻē mau tamariʻi","des, certains enfants"],["te mau tamariʻi","les enfants"],["te tahi fare","une maison"],["te tahi taʻata","une personne"],["te tahi mau fare","des maisons"],["vetahi mau fare","des maisons"]],"l":"L02"},"L02-G11b":{"p":"11b","t":"Les articles statifs 'o et 'e","r":"ʻO (avec ou sans ʻeta) signifie « c'est » devant les noms propres et les pronoms ; il marque aussi un nom propre sujet, et s'emploie avec emphase devant ʻoe sujet (voir §72). ʻE a la même valeur « c'est » devant un nom commun sans article ; avec l'article te, on emploie ʻo. E sert aussi de vocatif pour interpeller, avec ē facultatif après le nom pour insister.","f":[],"e":[["ʻO Tahiti.","C'est Tahiti."],["ʻO Teriʻi.","C'est Teri'i."],["ʻO vau.","C'est moi."],["ʻO rātou.","C'est eux."],["Ua reva atu ʻo Peu.","Peu est parti."],["E taʻata maitaʻi ʻo ʻoe.","Tu es un brave homme."],["ʻE taʻata.","C'est une personne."],["ʻE vahine.","C'est une femme."],["ʻE mau vahine.","Ce sont des femmes."],["ʻO te taʻata.","C'est l'homme."],["ʻO te vahine.","C'est la femme."],["E hoa !","Eh ! l'ami !"],["E Teriʻi ē !","Ah ! Teri'i !"],["E Teriʻi tāne !","Oh ! Monsieur Teri'i !"]],"l":"L02"},"L02-G12":{"p":"12","t":"Le duel ou pluriel restreint","r":"Trois articles servent pour deux êtres ou objets, ou pour un petit nombre (jusqu'à cinq ou six, jamais plus de dix) : na, nau et tau na. Na : pour ce qui va par paires (les mains, les parents), ou pour un nombre de personnes jusqu'à dix quand on précise ce nombre ; sans limite pour un ensemble (une somme d'argent). Nau : petit groupe proche de celui qui parle. Tau na : petit groupe éloigné.","f":[],"e":[["na rima","les mains"],["na metua","les parents (le père et la mère)"],["na taʻata","les deux hommes"],["na maehaʻa","les jumeaux"],["Ua ʻite au i na taʻata toʻo hitu.","J'ai vu sept hommes."],["na moni e pae hānere farāne","la somme de 500 francs"],["Ua ʻite au i na taʻata e toru hānere.","J'ai vu trois cents hommes."],["nau tamariʻi","quelques enfants"],["nau fare","quelques maisons"],["nau manu","quelques oiseaux"],["A hiʻo na i tērā nau tiaʻa.","Regarde ces chaussures."],["nau moni e pae hānere farāne","la somme de 500 francs"],["(e) tau na taʻata","(il y a) quelques hommes"],["(e) tau na fetiʻa","(il y a) quelques étoiles"],["tau na tumu ʻānani","quelques orangers"],["tau na faʻaʻapu taro","quelques plantations de taro"]],"l":"L02"},"L02-G13a":{"p":"13a","t":"Indication du sexe","r":"Le nom n'a pas de genre. Tāne / vahine : masculin et féminin pour les humains et les termes de parenté (équivalent de Monsieur / Madame). ʻŌtāne / ʻōvāhine : plantes, arbres, poissons, coquillages. Oni / ufa : mâle et femelle des animaux. Paʻe / maiaʻa : animaux adultes reproducteurs.","f":[],"e":[["Teriʻi tāne","Monsieur Teri'i"],["Teriʻi vahine","Madame Teri'i"],["te metua tāne","le père"],["te metua vahine","la mère"],["ʻīʻīta ʻōtāne","papayer mâle"],["ʻīʻīta ʻōvāhine","papayer femelle"],["moa oni","un coq"],["moa ufa","une poule"],["ʻurī oni","un chien"],["ʻurī ufa","une chienne"],["te puaʻa paʻe","le verrat"],["te puaʻa maiaʻa","la laie / la truie"]],"l":"L02"},"L02-G13b":{"p":"13b","t":"Les petits des animaux","r":"Fanauʻa désigne le petit de n'importe quel animal, sauf le mouton, pour lequel on dit pīnia.","f":[],"e":[["te puaʻa fanauʻa","le cochon de lait / le porcelet"],["te ʻurī fanauʻa","le chiot / le petit chien"],["te pīnia māmoe","l'agneau"]],"l":"L02"},"L02-G13c":{"p":"13c","t":"La quantité","r":"Des mots placés devant le nom indiquent un groupe : hui (personnes respectées), mā (après un nom : groupement familial), nana (troupeau, bande), taura (race), ruru (paquet lié), ʻāmui (paquet de marchandises de même espèce), ʻātā (presque synonyme de ruru), peʻetā (grappe encore attachée), tari (régime cueilli), pūpā (grappe de petits fruits), puʻe (groupe, tas), fēiā (ensemble de personnes ayant la même activité), maʻa (petite quantité).","f":[],"e":[["te hui mana","les autorités"],["te hui ariʻi","la famille royale"],["te hui raʻatira","la population / les citoyens"],["Teriʻi mā","les Teri'i"],["Peu mā","la famille Peu"],["te hōʻē nana iʻa","un banc de poissons"],["te hōʻē nana māmoe","un troupeau de moutons"],["te hōʻē taura ʻurī","une race de chiens"],["te hōʻē taura taʻata","une race d'hommes"],["te ruru vahie","le fagot"],["te ruru māʻa","le paquet de nourriture"],["te ʻāmui taro","la botte de taros"],["te ʻāmui ʻuru","le paquet de fruits à pain"],["te ʻātā ʻuru","les fruits à pain attachés en guirlande"],["te peʻetā ʻuru","la grappe de fruits à pain"],["te peʻetā haʻari","la grappe de noix de coco"],["te tari fēʻī","le régime de bananes rouges"],["te tari maiʻa","le régime de bananes"],["te pūpā vine","la grappe de raisins"],["te pūpā vī","la grappe de mangues"],["te puʻe taʻata","la troupe d'hommes"],["te puʻe iʻa","le tas de poissons / la pêche"],["te puʻe tiare","la brassée de fleurs"],["te fēiā faʻaʻapu","les cultivateurs"],["te fēiā tāiʻa","les pêcheurs"],["te fēiā rātere","les touristes"],["maʻa raiti","une portion de riz"],["maʻa faraoa","une bouchée de pain"],["maʻa pape","un peu d'eau"],["maʻa taime","un peu de temps"]],"l":"L02"},"L03-G15":{"p":"15","t":"Les nombres cardinaux","r":"De 1 à 9 : piti, toru, maha… précédés de e ; 10 = hōʻē ʻahuru, 20 = e piti ʻahuru. On relie dizaines et unités avec mā (11 = hōʻē ʻahuru mā hōʻē). 100 = hōʻē hānere, 1 000 = hōʻē tauatini (qui peut aussi exprimer la multitude). Zéro se dit ʻaore.","f":[],"e":[["Ua tauatini ʻe ua tauatini te taʻata.","Il y avait des milliers et des milliers de personnes."]],"l":"L03"},"L03-G16-a":{"p":"16-a","t":"Compter : l'énumération","r":"Pour dénombrer, la particule e (ou ʻe) précède toujours le nombre, sauf devant hōʻē. Sous dix, on emploie souvent le duel / pluriel restreint avec tau na, na ou nau. Pour demander « combien ? » : toʻohia ? pour les personnes (réponse avec toʻo sous dix), ʻehia ? pour les choses (et aussi les personnes à l'oral).","f":["e + nombre + nom","hōʻē … (sans e)","e + nombre + tau na / na + nom","e na + nom + e + nombre"],"e":[["E piti taʻata.","Il y a deux personnes."],["E hitu vaʻa.","Il y a sept pirogues."],["E toru ʻahuru vaʻa.","Il y a trente pirogues."],["E toru ʻahuru taʻata.","Il y a trente personnes."],["Hōʻē ʻahuru mā hitu vaʻa.","Il y a dix-sept pirogues."],["Hōʻē ʻahuru mā hitu taʻata.","Il y a dix-sept personnes."],["E piti tau na taʻata.","Il y a deux personnes."],["E hitu na vaʻa.","Il y a sept pirogues."],["E na vaʻa e hitu.","Il y a sept pirogues."],["E na taʻata e maha.","Il y a quatre personnes."],["Toʻohia taʻata i roto i tērā piha ?","Combien de personnes sont dans cette pièce ?"],["Toʻo maha.","Quatre."],["ʻEhia taʻata i roto i teie piha ?","Combien de personnes sont dans cette pièce ?"],["E pae (hōʻē ʻahuru mā hōʻē, e toru ʻahuru...).","Cinq (onze, trente...)."],["ʻEhia iʻa tā ʻoe i roaʻa inanahi ra ?","Combien de poissons as-tu attrapés hier ?"]],"l":"L03"},"L03-G16-b":{"p":"16-b","t":"Le nombre avec le sujet","r":"Quand le nombre se rapporte au sujet, il peut se placer avant ou après le nom sujet.","f":[],"e":[["Ua hoʻi mai e toru tau na taʻata.","Trois hommes sont revenus."],["Ua hoʻi mai e pae hānere taʻata.","Il est revenu cinq cents hommes."],["Ua hoʻi mai tā ʻu e toru na ʻurī.","Mes trois chiens sont rentrés."],["Ua hoʻi mai na taʻata ʻe toru.","Trois hommes sont revenus."],["Ua hoʻi mai tā ʻu na ʻurī e toru.","Mes trois chiens sont rentrés."]],"l":"L03"},"L03-G16-c":{"p":"16-c","t":"Le nombre avec le complément","r":"Dans le complément du verbe, le nombre est aussi précédé de e, sauf devant hōʻē.","f":[],"e":[["Ua ʻite au i na taʻata e toru.","J'ai vu trois personnes."],["Ua ʻite au i na taʻata hōʻē ʻahuru mā hitu.","J'ai vu dix-sept personnes."],["Ua ʻite au i na taʻata e pae hānere.","J'ai vu cinq cents hommes."]],"l":"L03"},"L03-G17":{"p":"17","t":"Les nombres ordinaux, « x fois », le carré","r":"Ordinal = a + nombre (a tahi, a piti…) ; a peut être remplacé par te, sauf pour tahi. « Le second, le troisième… » : te + nombre + o (ʻo) + nom ; « le premier » se dit mātāmua, placé après le nom. taʻi- + nombre = « tant de fois » ; tātaʻi- + nombre = mise au carré.","f":["a + nombre","te + nombre + o + nom","nom + mātāmua","taʻi + nombre","tātaʻi + nombre"],"e":[["te piti","second"],["te toru","troisième"],["Te toru o te pō, ua hoʻi mai au.","La troisième nuit, je suis rentré."],["Te piti o te pō ua haere au e tāiʻa.","Le deuxième soir, je suis allé pêcher."],["Te pō mātāmua, ua haere au e tāiʻa.","La première nuit, j'ai été à la pêche."]],"l":"L03"},"L03-G18":{"p":"18","t":"Les jours de la semaine","r":"Lundi = monirē, dimanche = tāpati ; de mardi à vendredi : mahana + nombre (mahana piti = 2e jour…) ; samedi = mahana māʻa. i mua = prochain, i maʻiri aʻe nei = dernier.","f":[],"e":[],"l":"L03"},"L03-G19":{"p":"19","t":"Les mois et les dates","r":"Les mois sont empruntés à l'anglais (tenuare, fepuare…). Une date : te + nombre + nō + mois ; l'année : i te matahiti + nombre.","f":["te + nombre + nō + mois"],"e":[["te piti nō ʻātete","le 2 août"],["te maha nō mē","le 4 mai"],["te pae nō māti","le 5 mars"],["te piti nō ʻātete i te matahiti hōʻē tauatini e iva hānere mā iva ʻahuru mā maha","le 2 août (de l'an) mille neuf cent quatre vingt quatorze"]],"l":"L03"},"L03-G20":{"p":"20","t":"L'heure","r":"« Quelle heure est-il ? » = E aha te hora ? On répond avec ua ou e (indifféremment à l'oral) + hora + nombre ; « et demie » = e te ʻāfa. Minutes après l'heure : maʻiri (« passé »). Minutes avant l'heure : … miniti toe e hora … ai (« il reste … minutes avant … heures »).","f":["E hora + nombre","… e te ʻāfa","E hora X maʻiri Y miniti","E Y miniti i maʻiri nō te hora X","E Y miniti toe e hora X ai","E Y miniti toe e tae atu ai i te hora X"],"e":[["E aha te hora ?","Quelle heure est-il ?"],["Hora aha ?","Quelle heure ?"],["Ua hora piti.","Il est deux heures."],["E hora piti i teie nei.","Il est deux heures maintenant."],["E hora ʻahuru mā hōʻē.","Il est onze heures."],["Ua hora hitu e te ʻāfa.","Il est sept heures et demie."],["E hora piti e te ʻāfa.","C'est deux heures et demie."],["E hora piti maʻiri hōʻē ʻahuru miniti.","Il est 2 h 10."],["E hora pae maʻiri e piti miniti.","Il est 5 h 02."],["E hōʻē ʻahuru miniti i maʻiri nō te hora piti.","Il est 2 h 10."],["E piti miniti i maʻiri nō te hora pae.","Il est 5 h 02."],["E hitu miniti toe e hora piti ai.","Il est 1 h 53."],["E piti miniti toe e hora pae ai.","Il est 4 h 58."],["E hitu miniti toe e tae atu ai i te hora piti.","Il est 1 h 53."],["E piti miniti toe e tae atu ai i te hora pae.","Il est 4 h 58."]],"l":"L03"},"L04-G23":{"p":"23","t":"Qualificatifs normaux","r":"L'adjectif suit toujours le nom et est invariable. Avec un numéral, le qualificatif vient d'abord ; mais si l'on annonce le nombre, le numéral précède le nom. Deux adjectifs pour un même nom : le second devient un nom relié par ʻe (sauf après iti, où le second adjectif suit directement).","f":["nom + adjectif"],"e":[["te hōʻē fare nehenehe","une belle maison"],["te pōtiʻi purotu","la belle jeune fille"],["te mau pōtiʻi purotu","les belles jeunes filles"],["te mau pōtiʻi purotu e iva","les neuf belles jeunes filles"],["E iva mau pōtiʻi purotu.","Elles sont neuf, les belles jeunes filles."],["tō ʻoe rouru roa ʻe te hāviti","tes beaux cheveux longs"],["te tiare noʻanoʻa ʻe te hāviti","la belle fleur parfumée"],["tō ʻoe reo iti marū","ta douce petite voix"]],"l":"L04"},"L04-G24":{"p":"24","t":"Qualificatifs variables","r":"Quelques adjectifs ont des formes redoublées au duel et au pluriel : roa → roroa (duel), roaroa (pluriel) ; poto → popoto, potopoto ; ʻino → ʻiʻino ; maitaʻi → maitataʻi (pluriel) ; rahi → rarahi (pluriel). Maitaʻi et rahi n'ont pas de duel. Roaroa et potopoto signifient aussi « très long », « très court ».","f":[],"e":[["te taʻata ʻino","le mauvais homme"],["te mau taʻata ʻiʻino","les mauvaises gens"]],"l":"L04"},"L04-G25":{"p":"25","t":"Comparatif et superlatif","r":"« Très » : rahi ou, plus courant, roa. A'e marque la supériorité : poto aʻe = plus petit ; poto roa aʻe = le plus petit. Comparer avec quelquʻun : E mea + rahi/iti + aʻe … i ; E + rahi/iti … i ; E/Ua hau … i. Iti exprime une moindre quantité ; pour la taille, on emploie huʻa.","f":["E mea + rahi / iti + aʻe … i","E + rahi / iti … i","E / Ua + hau … i"],"e":[["te hōʻē taʻata ʻite rahi","un homme très avisé, très instruit"],["te ʻurī maitaʻi roa","le très bon chien"],["te taʻata poto","le petit homme"],["te taʻata poto aʻe","l'homme plus petit"],["te taʻata poto roa aʻe","le plus petit homme"],["E mea rahi aʻe te pahī i te poti.","Le navire est plus grand que l'embarcation."],["E mea rahi aʻe vau ia ʻoe.","Je suis plus grand que toi."],["E mea iti aʻe tā ʻu moni i tā ʻoe.","J'ai moins d'argent que toi."],["E mea huʻa aʻe ʻo Mareva ia ʻoe.","Mareva est plus petite que toi."],["E rahi tō ʻu ʻite i tō ʻoe.","Mon savoir est plus grand que le tien."],["E hau tō ʻoe pūai i tō ʻu.","Ta force l'emporte sur la mienne, tu es plus fort que moi."]],"l":"L04"},"L04-G26":{"p":"26","t":"Égalité","r":"Trois constructions : Ua ʻaifaito … i (c'est égal à) ; Hōʻē a … e (c'est tout un) ; E au … i (pareil à). E au … mai marque la ressemblance.","f":["Ua ʻaifaito … i","Hōʻē a … e","E au … i"],"e":[["Ua ʻaifaito te rahi ʻo te mōhina Hīnano i te mōhina Manuia.","La bouteille de Hinano est de la même grandeur que la bouteille de Manuia."],["Hōʻē a tō te ariʻi māramarama e tō te ariʻi vahine.","Le roi est aussi intelligent que la reine (littéralement : Une est l'intelligence du roi et de la reine)."],["E au tō te tamaiti ʻaravihi i tō te metua tāne.","Le fils est aussi habile que le père (littéralement : Pareille est l'habileté du fils à celle du père)."],["E au ʻoe mai te mīmī.","Tu es comme un chat."]],"l":"L04"},"L04-G27":{"p":"27","t":"Totalité","r":"Atoʻa après le nom = tous ; devant le nom ou après le verbe = aussi. Pāʻātoʻa et tāʻātoʻa = tous ensemble, après le verbe ou le nom (pāʻātoʻa plutôt pour les êtres animés). Pau roa insiste sur « ensemble ».","f":[],"e":[["te mau taʻata atoʻa","tous, toutes les personnes"],["te mau mea atoʻa","tout, toutes les choses"],["e tā na atoʻa ʻāfata tauihaʻa","et aussi sa boîte, son coffre"],["te mau taʻata pāʻātoʻa","tout le monde, tous les gens"],["Te haere pāʻātoʻa atu ra rātou.","Ils sont tous partis."],["te mau ʻurī tāʻātoʻa","tous les chiens"],["I te reira taime ʻe horo pau roa te iʻa i roto i te ʻāua.","À ce moment-là, les poissons se précipitent tous ensemble dans le parc."]],"l":"L04"},"L04-G28":{"p":"28","t":"Ana'e","r":"Après un nom ou un pronom, anaʻe signifie « seul » ; après un verbe, « ensemble ».","f":[],"e":[["ʻoia anaʻe","lui seul"],["tātou anaʻe","nous seuls"],["E haere anaʻe tātou.","Partons tous ensemble."]],"l":"L04"},"L05-G30":{"p":"30","t":"Teie","r":"Quatre démonstratifs principaux : teie, tēnā, tērā et taua … ra ; ils précèdent le mot. Teie = ce …-ci (proche de celui qui parle). Au pluriel, teie peut devenir eie (rare à l'oral).","f":["teie + nom"],"e":[["teie fare","cette maison-ci"],["teie taʻata","cet homme"],["teie fare nehenehe","cette belle demeure"],["teie mau fare","ces maisons-ci"],["teie mau taʻata","ces hommes-ci"],["teie na rima","ces deux mains-ci"],["teie mau taʻata maitataʻi e ono","ces six braves hommes"]],"l":"L05"},"L05-G31":{"p":"31","t":"Tēnā","r":"Tēnā = ce …-là, proche de la personne à qui l'on parle. Au pluriel, tēnā peut devenir enā (rare à l'oral).","f":["tēnā + nom"],"e":[["tēnā taʻata","cet homme-là"],["tēnā mau taʻata ʻiʻino","ces mauvais hommes"],["tēnā pōtiʻi nehenehe","cette belle fille"]],"l":"L05"},"L05-G32":{"p":"32","t":"Tērā","r":"Tērā = ce …-là, éloigné des deux interlocuteurs.","f":["tērā + nom"],"e":[["tērā taʻata ʻino","ce mauvais homme"],["tērā mau ʻurī","ces chiens-là"],["tērā tau na taʻata","ces quelques hommes"],["tērā vahine","cette femme-là"]],"l":"L05"},"L05-G33":{"p":"33","t":"Taua … ra","r":"Taua … ra a un sens presque semblable à tērā ; le nom se place entre les deux mots.","f":["taua + nom + ra"],"e":[["taua pōtiʻi ra","cette jeune fille-là"],["taua mau pōtiʻi ra","ces jeunes filles"]],"l":"L05"},"L05-G34":{"p":"34","t":"Te reira","r":"Te reira indique que la personne ou la chose a déjà été citée.","f":[],"e":[["i te reira taime","en ce temps-là, à ce moment-là"],["i te reira faʻa","dans la susdite vallée"]],"l":"L05"},"L06-G36":{"p":"36","t":"Particules possessives","r":"Deux classes de noms : la possession « forte » prend tō, o (ʻō), nō ; la possession « faible » prend tā, a (ʻā), nā. Forte (tō, o, nō) : relation intime ou absolue (sauf l'épouse), parties du corps, partie d'un ensemble, ce qui émane d'un être, ce qui abrite, protège ou est vital. Faible (tā, a, nā) : possession acquise, sans relation intime (et l'épouse).","f":[],"e":[],"l":"L06"},"L06-G37":{"p":"37","t":"Adjectif possessif","r":"Particule forte ou faible + pronom : tō ʻu / tā ʻu (mon, ma), tō ʻoe / tā ʻoe (ton), tō na / tā na (son), tō māua (notre, duel excl.), tō tāua (notre, duel incl.), tō ʻōrua (votre, duel), tō rāua (leur, duel), tō mātou (notre, pl. excl.), tō tātou (notre, pl. incl.), tō ʻoutou (votre, pl.), tō rātou (leur, pl.). Pluriel du possédé : + mau (tō ʻu mau = mes). Tō ʻoe / tā ʻoe deviennent tō quand le possesseur est évident. Taʻu et ta na (voyelles courtes) peuvent remplacer tō ʻu, tō na si l'idée de possession est secondaire.","f":["tō / tā + pronom + nom"],"e":[["tō ʻu upoʻo","ma tête"],["tō ʻoe fare","ta maison"],["tō ʻu rima","ma main"],["tō ʻu vaʻa","ma pirogue"],["tō rātou metua tāne","leur père"],["tō ʻoutou hoa","votre ami"],["tō ʻoutou mau hoa","vos amis"],["tō ʻoe mau fare","tes maisons"],["tō ʻoe hape","ton erreur"],["tā ʻu vahine","ma femme"],["tā ʻu parau","ma parole"],["tā ʻu ʻurī","mon chien"],["tā ʻoe ʻupeʻa","mon filet"],["A toro mai na i tō rima.","Donne-moi la main."],["Teie tō tamāhine.","Voici ta fille."],["Ua toro mai ra i ta na rima.","Il m'a tendu la main."]],"l":"L06"},"L06-G38":{"p":"38","t":"Prépositions possessives pour noms communs","r":"Quand le possesseur est un nom commun : possédé + o / nō (fort) ou a / nā (faible) + possesseur ; ou, plus recherché, tō / tā + possesseur + possédé sans te. Nō, nā semblent marquer une possession plus profonde que o, a, mais beaucoup les emploient indifféremment.","f":["possédé + o, nō / a, nā + possesseur","tō / tā + possesseur + possédé sans te"],"e":[["te fetiʻa o te raʻi","les étoiles du ciel"],["te ʻāpoʻo o te ʻiore","le trou du rat"],["te ʻurī a te tāvana","le chien du chef"],["te ʻohipa a te tāmuta fare","le travail du charpentier"],["te fetiʻa nō te raʻi","les étoiles du ciel"],["tō te tumu rāʻau ʻāmaʻa","la branche d'arbre"],["tō te raʻi fetiʻa","les étoiles du ciel"],["tā te tāvana ʻurī","le chien du chef"],["tā te tāmuta fare ʻohipa","le travail du charpentier"]],"l":"L06"},"L06-G39":{"p":"39","t":"Prépositions possessives pour noms propres","r":"Avec un nom propre : possédé + o / a + possesseur (le plus courant), ou tō / tā + possesseur + possédé sans te.","f":["possédé + o / a + nom propre","tō / tā + nom propre + possédé"],"e":[["te upoʻo o Peu","la tête de Peu"],["te faʻaʻapu a Peu","la plantation de Peu"],["tō Peu upoʻo","la tête de Peu"],["tā Peu faʻaʻapu","la plantation de Peu"]],"l":"L06"},"L06-G40":{"p":"40","t":"Déclarations possessives","r":"Pour dire « A appartient à B » (phrase complète) : nō / nā + possesseur + groupe possédé.","f":["nō / nā + possesseur + groupe possédé"],"e":[["Nā ʻu teie ʻurī.","Ce chien est à moi."],["Nō ʻu teie fare.","Cette maison est à moi."],["Nō ʻoe tērā fare.","Cette maison est à toi."],["Nō te pōtiʻi tērā ʻahu.","Cette robe est à la jeune fille."],["Nō na tērā fare.","Cette maison est à lui."],["Nō Peu tērā tiaʻa.","Ces chaussures-là sont à Peu."],["Nā Peu tērā vahine.","Cette femme est celle de Peu."]],"l":"L06"},"L07-G42":{"p":"42","t":"Pronoms sujets","r":"Le tahitien distingue le singulier, le duel (deux personnes) et le pluriel, ainsi que l'inclusif (qui inclut la personne à qui l'on parle) et l'exclusif (qui l'exclut). 1re personne : au après un mot en -e ou -i, vau ailleurs (vau remplace librement au à l'oral). 3e personne : ʻoia est habituel ; ʻona s'emploie pour quelquʻun déjà mentionné et bien connu (valeur démonstrative). Il existe aussi verā, « ceux dont on a parlé », peu usité.","f":[],"e":[["ʻe tāʻiri au","je frapperai"],["ʻe horo vau","je courrai"]],"l":"L07"},"L07-G43":{"p":"43","t":"Pronoms compléments","r":"Les pronoms compléments se forment tous avec ia (ou ʻia) + pronom : ia ʻu, ia ʻoe, ia na, ia tāua…","f":["verbe + sujet + ia + pronom"],"e":[["Ua tāʻiri au ia ʻoe.","Je t'ai frappé."],["Ua ʻite au ia rātou.","Je les avais vus (vues)."],["Ua here ʻoia ia ʻu.","Elle m'aime."]],"l":"L07"},"L07-G44":{"p":"44","t":"Construction des autres compléments","r":"Nom propre complément d'objet : précédé de ia, comme les pronoms. Nom commun complément d'objet : précédé de i + l'article.","f":["… ia + nom propre","… i + te + nom commun"],"e":[["Ua hohoni te ʻurī ia Peu.","Le chien a mordu Peu."],["Ua ʻite au ia Teriʻi.","J'ai vu Teri'i."],["Ua tāpū te taʻata i te tumu ʻuru.","L'homme a coupé l'arbre à pain."],["Ua tāpū te taʻata i te mau tumu haʻari.","L'homme a abattu les cocotiers."]],"l":"L07"},"L08-G45":{"p":"45","t":"Ordre des mots","r":"L'ordre normal de la phrase tahitienne est : verbe + sujet + complément d'objet. Le verbe vient en tête, précédé de sa particule de temps.","f":["(particule) + verbe + sujet + complément"],"e":[],"l":"L08"},"L08-G46a-1":{"p":"46a-1","t":"Te + verbe + nei : présent progressif","r":"Te … nei = action en cours ou futur très immédiat, près de celui qui parle (« je suis en train de », « je vais »). Si l'action n'est pas proche, mai ra remplace nei.","f":["Te + verbe + nei + sujet"],"e":[["Te tāmāʻa nei au.","Je mange, je suis en train de manger."],["Te tāmāʻa nei ʻoe.","Tu es en train de manger."],["Te tāmāʻa nei ʻoia.","Il/elle va tout de suite manger."],["Te tāmāʻa nei tāua.","Nous mangeons, toi et moi (duel incl.)."],["Te tāmāʻa nei māua.","Nous mangeons (duel excl.)."],["Te tāmāʻa nei ʻōrua.","Vous mangez tous/toutes les deux (duel)."],["Te tāmāʻa nei rāua.","Ils/elles mangent tous/toutes les deux (duel)."],["Te tāmāʻa nei tātou.","Nous (pl. incl.) allons manger, vous et moi."],["Te tāmāʻa nei mātou.","Nous (pl. excl.) sommes en train de manger eux/elles et moi."],["Te tāmāʻa nei ʻoutou.","Vous (pl.) êtes en train de manger."],["Te tāmāʻa nei rātou.","Ils mangent, là, tout de suite."],["Te tāmāʻa nei te vahine.","La femme va manger maintenant."],["Te tāmāʻa nei ʻo Teriʻi.","Teri'i est en train de manger."],["Te ʻamu mai ra rāua i te ʻuru.","Ils sont tous les deux en train de manger du fruit à pain."]],"l":"L08"},"L08-G46a-2":{"p":"46a-2","t":"Te + verbe + ra : imparfait, action en cours loin de soi","r":"Te … ra = « était en train de », ou « est occupé à faire depuis quelque temps », avec une idée d'éloignement ; se traduit souvent par l'imparfait.","f":["Te + verbe + ra + sujet"],"e":[["Te ʻau ra vau.","Je nageais."],["Te ʻau ra ʻoe.","Tu nageais."],["Te ʻau ra ʻoia.","Il/elle nage depuis quelque temps."],["Te ʻau ra tāua.","Nous (duel incl.) nagions toi et moi."],["Te ʻau ra māua.","Nous (duel excl.) nagions, lui/elle et moi."],["Te ʻau ra ʻōrua.","Vous nagiez tous les deux (duel)."],["Te ʻau ra rāua.","Ils/elles nageaient tous/toutes les deux (duel)."],["Te ʻau ra tātou.","Nous (pl. incl.) nagions, vous et moi."],["Te ʻau ra mātou.","Nous (pl. excl.) nagions, eux/elles et moi."],["Te ʻau ra ʻoutou.","Vous (pl.) nagiez."],["Te ʻau ra rātou.","Ils/elles nageaient."],["Te taʻoto ra te ʻurī.","Le chien dormait."],["Te taʻoto ra ʻo Teriʻi.","Teri'i dormait."]],"l":"L08"},"L08-G46a-3":{"p":"46a-3","t":"Ua + verbe : passé (action achevée, résultat présent)","r":"Ua = action achevée dont le résultat se fait sentir maintenant. C'est la construction la plus courante pour parler du passé.","f":["Ua + verbe + sujet"],"e":[["Ua tāpū vau i te vahie.","J'ai coupé le bois."],["Ua tāpū ʻoe i te vahie.","Tu as coupé le bois."],["Ua tāpū ʻoia i te vahie.","Il/elle a coupé le bois."],["Ua tāpū tāua i te vahie.","Nous (duel incl.) avons coupé le bois, toi et moi."],["Ua tāpū māua i te vahie.","Nous (duel excl.) avons coupé le bois, lui/elle et moi."],["Ua tāpū ʻōrua i te vahie.","Vous deux avez coupé le bois (duel)."],["Ua tāpū rāua i te vahie.","Eux/elles deux ont coupé le bois (duel)."],["Ua tāpū tātou i te vahie.","Nous (pl. incl.) avons coupé le bois, vous et moi."],["Ua tāpū mātou i te vahie.","Nous (pl. excl.) avons coupé le bois, eux/elles et moi."],["Ua tāpū ʻoutou i te vahie.","Vous (pl.) avez coupé le bois."],["Ua tāpū rātou i te vahie.","Ils/elles ont coupé le bois."],["Ua tāpū te vahine i te vahie.","La femme a coupé le bois."],["Ua tāpū ʻo Teriʻi i te vahie.","Teri'i a coupé le bois."]],"l":"L08"},"L08-G46a-4":{"p":"46a-4","t":"I + verbe + na : action récemment achevée","r":"I … na = action récemment achevée ; moins fréquent à l'oral que ua, mais employé quand l'action est expliquée (voir §88).","f":["I + verbe + na + sujet"],"e":[["I haere na vau i te mātete.","Je suis allé(e) au marché."],["I haere na ʻoe i te mātete.","Tu es allé(e) au marché."],["I haere na ʻoia i te mātete.","Il/elle est allé(e) au marché."],["I haere na tāua i te mātete.","Nous sommes allé(e)s au marché, toi et moi."],["I haere na māua i te mātete.","Nous sommes allé(e)s au marché, lui/elle et moi."],["I haere na ʻōrua i te mātete.","Vous deux êtes allé(e)s au marché."],["I haere na rāua i te mātete.","Eux/elles deux sont allé(e)s au marché."],["I haere na tātou i te mātete.","Nous sommes allé(e)s au marché, vous et moi."],["I haere na mātou i te mātete.","Nous sommes allé(e)s au marché, eux/elles et moi."],["I haere na ʻoutou i te mātete.","Vous (pl.) êtes allé(e)s au marché."],["I haere na rātou i te mātete.","Ils/elles sont allé(e)s au marché."]],"l":"L08"},"L08-G46a-5":{"p":"46a-5","t":"I + verbe + iho nei / iho ra : venir de","r":"I … iho nei = « venir de faire » (passé très récent) ; avec ra : « je venais de ».","f":["I + verbe + iho + nei / ra + sujet"],"e":[["I tāpū iho nei au i te vahie.","Je viens de couper le bois."],["I tāpū iho nei ʻoe i te vahie.","Tu viens de couper le bois."],["I tāpū iho nei ʻoia i te vahie.","Il/elle vient de couper le bois."],["I tāpū iho nei tāua i te vahie.","Nous venons de couper le bois, toi et moi."],["I tāpū iho nei māua i te vahie.","Nous venons de couper le bois, lui/elle et moi."],["I tāpū iho nei ʻōrua i te vahie.","Vous deux venez de couper le bois."],["I tāpū iho nei rāua i te vahie.","Eux/elles deux viennent de couper le bois."],["I tāpū iho nei tātou i te vahie.","Nous venons de couper le bois, vous et moi."],["I tāpū iho nei mātou i te vahie.","Nous venons de couper le bois, eux/elles et moi."],["I tāpū iho nei ʻoutou i te vahie.","Vous (pl.) venez de couper le bois."],["I tāpū iho nei rātou i te vahie.","Ils/elles viennent de couper le bois."],["I tāpū iho nei te taʻata i te vahie.","L'homme vient de couper le bois."],["I tāpū iho nei ʻo Teriʻi i te vahie.","Teri'i vient de couper le bois."]],"l":"L08"},"L08-G46a-6":{"p":"46a-6","t":"Passé lointain, action achevée, habitude","r":"E mea maoro + verbe en -raʻa = passé reculé (« il y a longtemps »). Ua oti + possessif + nom + i te + verbe = action complètement achevée ; pau remplace oti quand il y a idée de consommation. Ua mātau + sujet + i te + verbe = habitude (« avoir l'habitude de »).","f":["E mea maoro + verbe-raʻa","Ua oti + possessif + nom + i te + verbe","Ua mātau + sujet + i te + verbe"],"e":[["E mea maoro i teie nei tō ʻu haereraʻa i Moʻorea.","Voilà bien longtemps que je ne suis allé à Mo'orea. (litt. : Il est loin maintenant mon aller à Mo'orea.)"],["E mea maoro te hōroʻaraʻa hia te taoʻa i te tāvana.","Le cadeau a été offert au chef il y a longtemps."],["Ua oti tā ʻu vahie i te tāpū.","J'ai fini de couper le bois."],["Ua pau tā te vahine ʻīnaʻi puaʻatoro i te ʻamu.","La femme a fini de manger la viande de bœuf."],["Ua mātau vau i te haere e tiʻi i te ʻānani.","J'ai l'habitude d'aller cueillir les oranges."],["Ua mātau vau i te rave i te ʻohipa.","Je suis habitué à travailler."]],"l":"L08"},"L08-G46a-7":{"p":"46a-7","t":"E + verbe : futur","r":"E (ou ʻe) + verbe = tout ce qui est futur. Pour l'emphase, le sujet peut précéder le verbe (avec ai, voir §81).","f":["E + verbe + sujet"],"e":[["E haere au i te ʻoire.","J'irai à la ville."],["E haere ʻoe i te ʻoire.","Tu iras en ville."],["E haere ʻoia i te ʻoire.","Il/elle ira en ville."],["E haere tāua i te ʻoire.","Nous irons en ville toi et moi."],["E haere māua i te ʻoire.","Nous irons en ville, lui/elle et moi."],["E haere ʻōrua i te ʻoire.","Vous deux irez en ville."],["E haere rāua i te ʻoire.","Eux/elles deux iront en ville."],["E haere tātou i te ʻoire.","Nous irons en ville, vous et moi."],["E haere mātou i te ʻoire.","Nous irons en ville, eux/elles et moi."],["E haere ʻoutou i te ʻoire.","Vous (pl.) irez en ville."],["E haere rātou i te ʻoire.","Ils/elles iront en ville."],["E tupaʻi te taʻata i te hōʻē moa.","L'homme tuera un poulet."],["E tupaʻi ʻo Teriʻi i te hōʻē puaʻa.","Teri'i abattra un porc."],["Ananahi au e haere ai i te mātete.","Demain, moi, j'irai au marché."]],"l":"L08"},"L08-G46a-8":{"p":"46a-8","t":"Mai + verbe + roa : faillir","r":"Mai … roa = forme « frustrative » : presque faire, faillir, manquer de peu.","f":["Mai + verbe + roa + sujet"],"e":[["Mai pohe roa ʻoia.","Il a failli mourir."],["Mai fati roa tō ʻu ʻāvae.","Je me suis presque cassé la jambe."],["Mai hohoni roa te ʻurī ia ʻu.","Le chien m'a presque mordu."]],"l":"L08"},"L08-G46b":{"p":"46b","t":"Substituts spéciaux du verbe","r":"La place du verbe peut être occupée par un nom, un adjectif ou un interrogatif.","f":[],"e":[["Ua mataʻi i teie nei.","Il vente en ce moment, il y a du vent maintenant."],["E ʻāvaʻe tātou i Maupiti.","Nous passerons un mois à Maupiti."],["Ua tāpati au i Papeʻete.","J'ai passé le dimanche à Pape'ete."],["Ua haumi te fenua.","Le sol est humide."],["Ua maoro ʻoia i tā na ʻohipa.","Il est en retard pour son travail."],["Te aha ra tērā vahine ?","Que fait cette femme ?"]],"l":"L08"},"L08-G46c":{"p":"46c","t":"Noms formés à partir de verbes (-ra'a)","r":"Te + verbe de mouvement ou d'état donne un nom abstrait. Plus généralement, le suffixe -raʻa transforme presque tout verbe en nom (« action de », « moment de »).","f":["te + verbe + raʻa"],"e":[["manaʻo","penser"],["te manaʻo","la pensée"],["taʻoto","dormir"],["te taʻoto","le sommeil"],["mataʻu","craindre"],["te mataʻu","la crainte"],["ora","vivre"],["te ora","la vie"],["pure","prier"],["te pureraʻa","la prière / le culte"],["tāmāʻa","manger"],["te tāmāʻaraʻa","le banquet"],["hoe","ramer / pagayer"],["te hoeraʻa","le fait de ramer"],["tae","arriver"],["te taeraʻa","l'arrivée"],["hāpono","envoyer"],["te hāponoraʻa","l'envoi"],["ʻau","nager"],["te ʻauraʻa","la nage"],["hāmani","fabriquer"],["te hāmaniraʻa","la fabrication"],["pāfaʻi","cueillir"],["te pāfaʻiraʻa","la cueillette"]],"l":"L08"},"L08-G47":{"p":"47","t":"Verbes passifs","r":"Passif : verbe + hia + sujet + e + agent. Hia s'écrit séparé du verbe. Au passé récent, -a remplace hia (ravea, ʻamua), ainsi que pour les verbes en -hi (vāvāhia). L'agent est introduit par e pour un être animé, i pour un inanimé. Agents pronoms : e au, e ʻoe, e ana, e tāua, e māua, e ʻōrua, e rāua, e tātou, e mātou, e ʻoutou, e rātou. Nā + agent + verbe actif + complément = emphase sur l'agent (« c'est X qui… ») : i pour le passé, e pour le présent et le futur. Quelques verbes impersonnels n'ont jamais hia : ravaʻi/navaʻi, roaʻa/noaʻa, taʻa, moʻe, māʻe, maraʻa, tiʻa, nehenehe, hemo, rē.","f":["Verbe + hia + sujet + e + agent","Nā + agent + i / e + verbe + complément"],"e":[["Ua hohoni hia ʻoia e te ʻurī.","Il a été mordu par le chien."],["Ua ʻeiā hia tō na tāupoʻo.","Son chapeau a été volé."],["I tāʻiri hia na vau.","J'ai été battu."],["E tāʻiri hia vau.","Je vais me faire battre."],["rave","prendre"],["ravea","pris (récent)"],["rave hia","pris (général)"],["ʻamu","manger"],["ʻamua","mangé (récent)"],["ʻamu hia","mangé (général)"],["Ua ravea te tāupoʻo e Teriʻi.","Le chapeau a été pris par Teri'i."],["vāvāhi","fendre"],["vāvāhia","fendu"],["Ua hohoni hia ʻoia e te maʻo.","Il a été mordu par un requin."],["Ua hōroʻa hia te taoʻa e te tamāroa iti.","Le cadeau a été donné par un petit garçon."],["Ua fatihia te ʻāmaʻa rāʻau i te mataʻi.","La branche d'arbre a été cassée par le vent."],["Ua taʻiri hia te ʻurī e ana.","Le chien a été battu par lui."],["Nā te tāvana i taparahi haʻapohe (i) te maʻo.","C'est le chef qui a tué le requin."],["Nā te tamāroa iti i hōroʻa atu i te taoʻa.","C'est le petit garçon qui a offert le cadeau."],["Ua nāvaʻi te māʻa.","Il y a assez de nourriture."],["Ua noaʻa tā tātou pia.","Nous avons eu de la bière."],["Ua taʻa ia ʻu i te faʻahoro i te pereoʻo uira.","Je sais comment faire marcher l'automobile."],["Ua moʻe ia ʻu te tīteti manureva.","J'ai oublié le billet d'avion."],["Ua māʻe tā ʻu pūtē pūhā.","J'ai réussi à soulever mon sac de coprah."],["Ua maraʻa te moni ʻō te pūhā.","Le prix du coprah a augmenté."],["E tiʻa ia ʻu ia tauturu ia ʻoe.","Il m'est possible de t'aider."],["E nehenehe tā ʻu e tauturu ia ʻoe.","Je peux t'aider."],["Ua hemo tō Teriʻi vaʻa i tō Marama.","La pirogue de Teri'i a été dépassée par celle de Marama."],["Ua rē ia Moana.","Moana a gagné."]],"l":"L08"},"L09-G49":{"p":"49","t":"Fa'a- ou ha'a- : le causatif","r":"Le causatif (« faire faire, provoquer ») se forme avec le préfixe faʻa- ou haʻa- devant un verbe, un nom ou un adjectif. Pour la plupart des mots, un seul préfixe est possible (voir le lexique) ; pour une petite liste, les deux. Le causatif porte deux accents : sur le préfixe et sur le radical.","f":["faʻa- / haʻa- + base"],"e":[["tupu","croître"],["faʻatupu","faire pousser"],["ʻite","connaître"],["faʻaʻite","faire connaître / montrer"],["taʻi","pleurer"],["faʻataʻi","faire pleurer"],["maitaʻi","bon"],["haʻamaitaʻi","faire du bien"],["ʻino","mauvais"],["faʻaʻino","faire du mal"],["ʻahu","vêtements"],["faʻaʻahu","vêtir"],["nehenehe","beau"],["faʻanehenehe","parer / orner"],["tae","arriver"],["faʻatae","importer (faire venir)"],["Ua faʻatae ʻoia i te mau puaʻatoro.","Il a importé du bétail."],["ʻE faʻanehenehe rātou i te piha.","Ils/elles vont faire le ménage de la pièce."]],"l":"L09"},"L09-G50":{"p":"50","t":"Tā-","r":"Le préfixe tā- forme aussi un causatif, au sens de « faire servir quelque chose ».","f":["tā- + base"],"e":[["tihota","sucre"],["tātihota","sucrer"],["paru","appât (pour attraper)"],["tāparu","mendier"],["piti","deux"],["tāpiti","doubler / bisser"],["māʻa","repas"],["tāmāʻa","prendre un repas"]],"l":"L09"},"L09-G51":{"p":"51","t":"Causatif et passif","r":"Certains verbes ont un sens passif à la base (fati, être cassé) ; ils ne prennent hia qu'une fois causatifs : base passive → causatif actif → causatif + hia (passif).","f":["base (sens passif) → causatif (actif) → causatif + hia"],"e":[["fati","être cassé"],["ʻōfati","casser"],["matara","se délier"],["haʻamatara","délier"],["mau","être tenu ferme"],["tāmau","maintenir / apprendre par cœur / fixer"],["māuʻa","être gaspillé"],["haʻamāuʻa","gaspiller"],["moʻe","être oublié"],["haʻamoʻe","oublier / perdre"],["oti","être fini"],["faʻaoti","finir / terminer"],["pāpū","être sûr"],["haʻapāpū","rendre sûr"],["pau","être consommé / épuisé"],["haʻapau","consommer / finir un plat"],["pohe","être mort"],["tūpohe","tuer / éteindre une lumière"],["riro","devenir"],["faʻariro","transformer / transférer"],["Ua fati te mau tumu haʻari.","Les cocotiers sont cassés."],["Ua ʻōfati au i te ʻāmaʻa rāʻau.","J'ai cassé les branches."],["Ua ʻōfati hia te ʻāmaʻa rāʻau.","Les branches ont été cassées."],["Ua matara te mau fare toa.","Les magasins sont ouverts."],["Ua haʻamatara ʻona i te tāpona taura.","Il a dénoué la corde."],["Ua haʻamatara hia te ʻōpani.","La porte a été entrouverte."],["Ua mau maitaʻi te taura i te tāʻamu.","La corde a bien été nouée."],["Ua tāmau maitaʻi o Heifara i tā na hīmene.","Heifara a bien appris son chant."],["Ua tāmau hia te hīmene.","Le chant a bien été appris."],["Ua māuʻa noa te taime.","C'est une pure perte de temps."],["Ua haʻamāuʻa ʻoia i tō na taime.","Il a perdu son temps."],["Ua haʻamāuʻa hia te taime.","On a perdu du temps."],["Ua moʻe ia ʻu.","J'ai oublié."],["Ua haʻamoʻe te tohorā.","La baleine a disparu (au fond)."],["Ua haʻamoʻe hia te mau parau tahito.","On a effacé, relégué dans l'oubli, les anciennes paroles."],["Ua oti te poti i te hāmani.","La construction du bateau a été achevée."],["Ua faʻaoti te ʻohipa.","Le travail est fini."],["Ua faʻaoti hia te pureraʻa.","On a fini de prier."],["Ua pāpū ia ʻu.","Je suis sûr."],["Ua haʻapāpū ʻoe.","Tu as expliqué."],["Ua haʻapāpū hia te hora.","L'heure a été fixée."],["Ua pau te pape.","L'eau est épuisée."],["Ua haʻapau ʻoia i te uaina.","Il a fini tout le vin."],["Ua haʻapau hia te māʻa.","On a tout mangé."],["Ua pohe ʻoia.","Il est mort."],["Ua tūpohe ʻoia i te mōri.","Il a éteint la lampe."],["Ua tūpohe hia te mōri.","La lampe a été éteinte."],["Ua riro ʻoia ʻei tāvana.","Il est devenu maire."],["Ua faʻariro ʻoia i tō na pereʻoʻo.","Il a cédé son auto."],["Ua faʻariro hia ʻoia ʻei taʻata farāni.","Il a été fait citoyen français."]],"l":"L09"},"L09-G52":{"p":"52","t":"Nom + hia","r":"Tout nom commun peut devenir un verbe impersonnel passif en ajoutant hia.","f":["nom + hia"],"e":[["taʻata","personne / gens"],["taʻatahia","être peuplé"],["māʻa","nourriture / fruit"],["māʻahia","fructifier"],["mahana","soleil"],["mahanahia","s'ensoleiller"],["Eʻita e taʻatahia i te ʻoire ananahi.","Il n'y aura pas foule en ville demain."]],"l":"L09"},"L09-G53":{"p":"53","t":"Duel du verbe","r":"Quand deux personnes font l'action ensemble, certains verbes redoublent partiellement leur première syllabe.","f":[],"e":[["horo","courir"],["hohoro","courir (à deux)"],["haere","aller"],["hahaere","aller (à deux)"],["reva","partir"],["rereva","partir (à deux)"],["parau","parler"],["paraparau","parler à plusieurs"],["taʻoto","dormir"],["taʻoʻoto","dormir (à deux)"],["Ua taʻoʻoto ʻo Teriʻi e tā na vahine.","Teri'i a dormi avec sa femme."],["E paraparau tāua i teie pō.","Toi et moi, nous discuterons ce soir."]],"l":"L09"},"L09-G54":{"p":"54","t":"Verbes intensifs","r":"Une action répétée s'exprime par la répétition complète (ou presque) du verbe. Ia placé juste après le verbe souligne une déclaration ou une décision.","f":[],"e":[["parau","parler"],["paraparau","discourir / parler beaucoup"],["hiʻo","regarder"],["hiʻohiʻo","observer / guetter"],["hoe","pagayer"],["hoehoe","pagayer çà et là"],["pātia","piquer / harponner"],["pātiatia","porter plusieurs coups de harpon ou de dard"],["rave","faire / prendre"],["raverave","manipuler / tripoter"],["horoi","laver"],["horohoroi","laver plusieurs fois"],["E taʻoto ia te mau taʻata i uta i tērā faʻa.","Les gens dormiront donc au fond de cette vallée."],["E riro ia te ʻoire nō Papeʻete ʻei mātaʻitaʻiraʻa nā te mau fēiā rātere.","La ville de Pape'ete devient l'attraction des touristes."]],"l":"L09"},"L10-G56":{"p":"56","t":"'Aita et 'aore : négation au présent et au passé","r":"Particules négatives : ʻaita, ʻaore, ʻeʻita, ʻeʻore, ʻeʻere. La négation précède toujours le sujet et le verbe : négation + sujet + verbe + complément. ʻAita (ou ʻaore, plus emphatique) nie au présent et au passé. Au présent, e remplace le te de la forme affirmative (te … nei → ʻaita … e … nei).","f":["ʻAita + sujet + i + verbe (passé)","ʻAita + sujet + e + verbe + nei / ra (en cours)"],"e":[["ʻAita te taʻata i hohoni hia e te ʻurī.","L'homme n'a pas été mordu par le chien."],["ʻAita vau i rave i te ʻohipa i teie poʻipoʻi.","Je n'ai pas travaillé ce matin."],["ʻAita vau e tāmāʻa nei.","Je ne suis pas en train de manger."],["ʻAita tā ʻu vahie i oti i te tāpū.","Je n'ai pas fini de couper le bois."],["ʻAita vau e ʻamu ra.","Je ne mangeais pas."],["ʻAore au i tupaʻi ia na.","Je ne l'ai pas frappé."]],"l":"L10"},"L10-G57":{"p":"57","t":"'E'ita et 'e'ore : négation au futur","r":"ʻE'ita (ou ʻeʻore, plus fort) forme la négation au futur ; même ordre des mots.","f":["ʻEʻita + sujet + e + verbe"],"e":[["ʻEʻita vau e haere i teie nei i te mātete.","Je n'irai pas maintenant au marché."],["ʻEʻita te taʻata e hohoni hia e te ʻurī.","L'homme ne sera pas mordu par le chien."],["ʻEʻore roa rātou e tae mai !","Ils n'arriveront jamais !"]],"l":"L10"},"L10-G58":{"p":"58","t":"'E'ere : « ce n'est pas »","r":"ʻE'ere (ou eʻere) s'emploie pour « il n'y a pas », « ce n'est pas », surtout dans les phrases sans verbe (voir §73-74), et pour nier la tournure emphatique nā … i (§47).","f":["ʻEʻere + i te mea + adjectif"],"e":[["ʻEʻere i te mea ʻohie.","Ça n'est pas facile."],["ʻEʻere ʻoia i te mea pūai.","Il n'est pas fort."],["ʻEʻere nā ʻu i rave i te puta.","Ce n'est pas moi qui ai pris le livre."]],"l":"L10"},"L10-G59":{"p":"59","t":"Négatif + roa : « jamais »","r":"Roa, juste après une particule négative, signifie « jamais ».","f":[],"e":[["ʻAita roa vau i ʻite.","Je n'ai jamais vu."],["ʻEʻore roa rātou e tae mai.","Ils n'arriveront jamais."]],"l":"L10"},"L10-G60":{"p":"60","t":"'Aita ā, 'aita e ā, 'aore ā : « pas encore »","r":"Ces formes signifient « pas encore » et occupent la place de ʻaita.","f":[],"e":[["ʻAita e ā ʻona i haere mai.","Il n'est pas encore venu."],["ʻAore ā ʻona i ʻite i te miti.","Il n'a pas encore vu la mer."]],"l":"L10"},"L10-G61":{"p":"61","t":"'Ore : privation","r":"ʻOre après un verbe exprime la privation ou la suppression ; c'est aussi un verbe négatif (voir §98). Après certains adverbes ou adjectifs, il donne le sens contraire.","f":[],"e":[["E rave tāua i te ʻohipa mai te faʻaea ʻore.","Nous travaillerons tous les deux sans arrêt. (litt. : Nous ferons tous deux le travail avec l'arrêt supprimé.)"],["Nō te aha ʻoe e ʻore ai e ʻau ?","Pourquoi ne nages-tu pas ?"],["ʻIa ʻore ʻoia e ʻamu faʻahou i te mau taʻata.","Pour qu'il ne mange plus de gens."],["pinepine","souvent"],["pinepine ʻore","rarement"],["tuʻutuʻu","relâché"],["tuʻutuʻu ʻore","sans relâche"],["nehenehe","possible"],["nehenehe ʻore","impossible"]],"l":"L10"},"L11-G63":{"p":"63","t":"Verbe intransitif","r":"Structure : verbe + sujet.","f":["verbe + sujet"],"e":[["Ua haere au i te mātete.","Je suis allé(e) au marché."],["Ua tae mai au i te hora piti.","Je suis arrivé(e) à 2 heures."]],"l":"L11"},"L11-G64":{"p":"64","t":"Verbe transitif","r":"Structure : verbe + sujet + complément d'objet direct.","f":["verbe + sujet + complément dʻobjet"],"e":[["E tupaʻi au i te hōʻē puaʻa.","Je tuerai un cochon."],["Ua ʻamu vau i te fēʻī.","J'ai mangé une banane rouge."]],"l":"L11"},"L11-G65":{"p":"65","t":"Complément d'attribution","r":"Le complément d'attribution (« à quelquʻun ») vient après le complément d'objet direct.","f":["verbe + sujet + objet + attribution"],"e":[["Ua hōroʻa atu vau i te hōʻē taoʻa nā na.","Je lui ai donné un cadeau."],["Ua pāpaʻi au i te rata ia na inanahi ra.","Je lui ai écrit une lettre hier."]],"l":"L11"},"L11-G66":{"p":"66","t":"Attributif ('ei)","r":"L'attribut, précédé de la particule ʻei, se place après le complément d'objet direct.","f":["verbe + sujet + objet + ʻei + attribut"],"e":[["Ua maʻiti rātou ia na ʻei tāvana ʻoire.","Ils l'ont élu maire."]],"l":"L11"},"L11-G67":{"p":"67","t":"Passif","r":"Avec un verbe passif : verbe + sujet + agent.","f":["verbe + hia + sujet + e + agent"],"e":[["Ua hohoni hia ʻoia e te ʻurī.","Il a été mordu par le chien."],["Ua tāpeʻa hia ʻoia e te mūtoʻi.","Il a été arrêté par la police."]],"l":"L11"},"L11-G68":{"p":"68","t":"Objet indirect passif","r":"Passif avec complément d'attribution : verbe + sujet + attribution + agent. Attributif au passif : verbe + sujet + attribut.","f":[],"e":[["Ua hōroʻa hia te taoʻa na te tamaiti e te tāvana.","Le cadeau a été donné à l'enfant par le chef."],["Ua maʻiti hia ʻoia ʻei tāvana ʻoire.","Il a été élu maire."]],"l":"L11"},"L11-G69":{"p":"69","t":"Verbes impersonnels","r":"Les verbes de météorologie suivent les modèles habituels, mais sans sujet.","f":[],"e":[["E ua.","Il pleut."],["Te ua nei.","Voici la pluie."],["E pātiri.","Ça tonne."]],"l":"L11"},"L11-G70":{"p":"70","t":"Vai : être présent, exister","r":"Vai signifie « être présent, exister » ; il se conjugue comme les autres verbes mais jamais au passif. Ne pas l'employer comme « être » devant un adjectif ou un adverbe : la phrase est alors non verbale.","f":[],"e":[["Te vai nei au.","Je suis ici."],["Te vai nei ʻoe.","Tu es ici."],["Te vai nei ʻoia.","Il est ici."],["Te vai ra vau.","J'étais là."],["Te vai ra ʻoe.","Tu étais là."],["Te vai ra ʻoia.","Il était là."],["Te vai ra te hōʻē taʻata tei pāpaʻi i taua ʻaʻamu ra.","Il y avait un homme qui a écrit cette histoire (ou : il était un homme…)."]],"l":"L11"},"L12-G72":{"p":"72","t":"« C'est », « il y a »","r":"Beaucoup de phrases tahitiennes n'ont pas de verbe. Premier type : E + nom + locution circonstancielle (tō + lieu ou temps) = « il y a ». La première partie seule peut répondre à une question. Devant un pronom ou un nom propre, e devient ʻo. Négation : ʻaita devant la phrase ; par force croissante : ʻaore reʻa, ʻaita, ʻaita roa, ʻaore, ʻaore roa. « Il y a beaucoup » : E raverahi (beaucoup de la même sorte) ou E raverau (de genres variés) + nom.","f":["E + nom + tō + lieu / temps","ʻAita + e + nom + tō + lieu / temps","E + raverahi / raverau + mau + nom"],"e":[["E naonao tō ʻō nei.","Il y a des moustiques ici."],["E taʻurua tō ananahi.","Il y a une fête demain."],["E iʻa tō roto i te ʻupeʻa.","Il y a du poisson dans le filet."],["E aha tērā ?","Qu'est-ce que c'est ?"],["E māʻa tahiti.","C'est un repas tahitien."],["ʻO vau.","C'est moi."],["ʻO Teriʻi.","C'est Teri'i."],["ʻAita e naonao tō ʻō nei.","Il n'y a pas de moustiques ici."],["ʻAita e taʻurua tō ananahi.","Ce n'est pas fête demain."],["ʻAore reʻa e taʻata.","Il n'y a presque personne."],["ʻAita e taʻata.","Il n'y a personne."],["ʻAita roa e taʻata.","Il n'y a personne."],["ʻAore e taʻata.","Il n'y a personne."],["ʻAore roa e taʻata.","Il n'y a absolument personne."],["E raverahi mau rātere.","Il y a beaucoup de touristes."],["E raverau mau taʻata.","Il y a beaucoup de monde."]],"l":"L12"},"L12-G73":{"p":"73","t":"Construction qualificative","r":"Deuxième type, « il est fort », « le sol est mouillé » : E mea + adjectif + nom ou pronom. La première partie seule suffit si le contexte est clair. Négation : ʻE'ere … i te mea + adjectif, ou bien l'adjectif devient verbe : ʻAita + nom + i + adjectif.","f":["E mea + adjectif + nom / pronom","ʻEʻere + sujet + i te mea + adjectif","ʻAita + nom + i + adjectif"],"e":[["E mea marō te haʻari.","Les cocos sont secs. (litt. : une chose sèche, les cocos ; ua marō te ha'ari = les cocos ont séché.)"],["E mea paʻari te ufi.","Les ignames sont dures."],["E taʻata pūai ʻoia.","Il est fort (litt. : un homme fort, lui)."],["E mea au nā ʻu tērā hei pūpū.","J'aime ce collier de coquillages (litt. : c'est bon pour moi…)."],["E mea ʻohie.","C'est facile."],["ʻEʻere i te mea ʻohie.","Cela n'est pas facile."],["ʻEʻere ʻoia i te mea pūai.","Il n'est pas fort."],["E mea haumi te fenua.","Le sol est mouillé."],["ʻAita te fenua i haumi.","Le sol n'est pas mouillé."],["ʻAita te ufi i paʻari.","Les ignames ne sont pas dures."]],"l":"L12"},"L12-G74":{"p":"74","t":"Construction démonstrative","r":"Troisième type, « voici un cocotier », « voilà mon père » : E + groupe du nom + démonstratif, ou démonstratif + groupe du nom. Négation avec ʻeʻere.","f":["E + nom + teie / tērā","teie / tērā + groupe du nom"],"e":[["E tumu haʻari teie.","Voici un cocotier."],["Tērā tō ʻu metua tāne.","Voilà mon père."],["ʻEʻere tērā tō ʻu metua tāne.","Ce n'est pas mon père."]],"l":"L12"},"L12-G75":{"p":"75","t":"« Avoir »","r":"Il n'y a pas de verbe « avoir » : E + possédé + tā / tō + possesseur (« il y a … à moi »). Pour insister sur le possesseur : nā / nō + possesseur + possédé. Avec un nombre : E + nombre + possesseur + possédé. Négation : ʻAita (ou ʻaore) + possesseur + e + possédé.","f":["E + possédé + tā / tō + possesseur","nā / nō + possesseur + possédé","E + nombre + tā / tō + possesseur + possédé","ʻAita + tā / tō + possesseur + e + possédé"],"e":[["E ʻavaʻava tā ʻu.","J'ai des cigarettes. (litt. : il y a des cigarettes à moi.)"],["E ʻurī tā rātou.","Ils ont un chien."],["E upoʻo tō ʻu.","J'ai une tête."],["E fare nehenehe tō tērā taʻata.","Cet homme a une belle maison."],["Nā ʻu tērā ʻavaʻava.","Elles sont à moi, ces cigarettes."],["Nō Teriʻi tērā vaʻa.","Elle est à Teri'i, cette pirogue."],["Nā vai tērā uāti ?","À qui est cette montre ?"],["Nō ʻu tērā uāti.","Elle est à moi, cette montre."],["E piti tā na puaʻa.","Il a deux cochons, deux cochons sont à lui."],["ʻAita tā ʻu e vahine.","Je n'ai pas de femme."],["ʻAita tā ʻu e ʻavaʻava.","Je n'ai pas de cigarettes."],["ʻAita tō tērā taʻata e fare nehenehe.","Cet homme n'a pas une belle maison."]],"l":"L12"},"L13-G77":{"p":"77","t":"Locutions de temps : le moment","r":"Les locutions de temps se placent en général au début ou à la fin de la proposition. Fātata (bientôt) a une construction verbale particulière : Ua fātata te taime e … ai.","f":["locution de temps + phrase","phrase + locution de temps"],"e":[["Ananahi, e haere ai au e hopu i te miti.","Demain, j'irai me baigner à la mer."],["E reva atu vau i teie pō.","Je partirai ce soir."],["Hou a tupu ai teie ʻōroʻa rahi…","Avant que n'ait lieu cette grande cérémonie…"],["E nehenehe tā ʻoe e rave nā mua.","Tu peux te servir en premier."],["Nā mua aʻe i te reira, te rave ra ʻoia i te ʻohipa faʻaʻapu.","Avant ça, il était cultivateur."],["I reira tō ʻu fārereiraʻa ia na.","C'est alors que je l'ai rencontré."],["Ua haere iho ra ʻoia e pīpī i te tiare.","Il est alors parti arroser les fleurs."],["Ua tāpū atu ra ʻoia i te vahie.","Alors il a coupé le bois."],["I muri iho, ua pohe ʻoia.","Après cela, il mourut."],["Ua tiʻa aʻe ra ʻoia i niʻa.","Il s'est enfin levé."],["Mai te mahana i reva atu ai ʻoe, ʻaita te fare i taui.","Depuis que tu es parti, la maison n'a pas changé."],["Mai te hora piti e tae noa atu i te hora pae.","De deux heures à cinq heures."],["I mutaʻa iho ra ʻaita te mau fēiā māʻohi e ʻamu i te māʻa popaʻā.","Autrefois les Polynésiens ne mangeaient pas de nourriture européenne."],["Ua fātata te taime e paraparau ai au i te reo Tahiti.","Je parlerai bientôt tahitien. (litt. : Il est proche, le temps…)"]],"l":"L13"},"L13-G78":{"p":"78","t":"Locutions de fréquence et de persistance","r":"Les adverbes de fréquence se placent toujours juste après le radical du verbe : pinepine (souvent), noa / noa ra (toujours, encore), aʻe na (déjà, depuis longtemps), aʻe nei (déjà, depuis peu), ā (encore, continuation), faʻahou (encore une fois). I te tahi mau taime (parfois) se place en tête.","f":["particule + verbe + adverbe de fréquence + sujet"],"e":[["E haere pinepine mai au i ʻō nei.","Je viens souvent ici."],["E haere pinepine au i te ʻoire.","Je vais souvent en ville."],["Te taʻoto noa ra ʻoia.","Il dort (sans interruption)."],["Ua reva aʻe na ʻoia.","Il est déjà parti."],["Ua ʻamu aʻe nei au.","J'ai déjà mangé."],["E hinaʻaro ā ʻoe i te ʻavaʻava ?","Veux-tu encore une cigarette ?"],["E hoʻi faʻahou mai ā ʻoe ?","Reviendras-tu à nouveau ?"],["I te tahi mau taime e haere ʻoia e hopu i te miti.","De temps en temps il va se baigner à la mer."]],"l":"L13"},"L14-G80":{"p":"80","t":"Le lieu","r":"Phrase non verbale : la locution de lieu est souvent en tête, et i devient alors tei (présent, passé) ou ʻei (futur). Phrase verbale : la locution de lieu vient après le groupe verbe-sujet-objet. Dans les phrases verbales, i seul indique à la fois où l'on est et où l'on va.","f":["Tei + lieu + sujet + i + repère","verbe + sujet + objet + locution de lieu"],"e":[["Tei raro aʻe te ʻurī i te ʻamuraʻamāʻa.","Le chien est sous la table."],["Tei raro te māʻa haʻari.","Les cocos sont par terre (litt. : en bas)."],["Tei niʻa aʻe te manureva i te ʻoire.","L'avion est au-dessus de la ville."],["Tei niʻa iho te puta i te ʻamuraʻamāʻa.","Le livre est sur la table."],["Tei pihaʻi iho te pārahiraʻa i te ʻamuraʻamāʻa.","La chaise est à côté de la table."],["Tei roto te iʻa i te ʻupeʻa.","Le poisson est dans le filet."],["Tei rōpū te pahī i te ava.","Le navire est au milieu de la passe."],["Tei rotopū te tāvana i te hui raʻatira.","Le chef est parmi la population."],["Tei rāpae te mau peʻue.","Les nattes sont dehors."],["Tei muri mai te tumu ʻuru i te fare.","L'arbre à pain est derrière la maison."],["Tei mua mai te pereoʻo uira i te fare.","L'auto est devant la maison."],["Tei ʻō nei te mau pōtiʻi purotu.","Les jolies filles sont ici."],["Tei te fare te mau manihini.","Les invités sont à la maison."],["Tei Papeʻete ʻoia inanahi.","Il était à Pape'ete hier."],["ʻEi Papeʻete ʻoia ananahi.","Il sera à Pape'ete demain."],["Ua ori haere ʻoia i raro aʻe i te tumu haʻari.","Il s'est promené sous les cocotiers."],["Ua rere te manureva nā raro roa.","L'avion a volé très bas."],["Ua rere te manureva nā niʻa i te ʻoire.","L'avion a volé au-dessus de la ville."],["E paʻuma ʻoia i niʻa iho i te tumu rāʻau.","Il grimpera sur l'arbre."],["Ua pārahi ʻoia i pihaʻi iho ia ʻu.","Il s'est assis à côté de moi."],["Ua tāora vau i te pōpō i roto i te miti.","J'ai lancé la balle dans la mer."],["Ua hitimahuta vau nā roto i tā ʻu moemoeā.","Je me suis réveillé en sursaut de mon rêve."],["E haere te mau taʻata i rōpū i te miti nā niʻa i tō rātou vaʻa.","Les hommes vont au milieu de la mer sur leurs pirogues."],["Ua ori haere ʻoia i rotopū i te hui raʻatira.","Il s'est promené parmi la population."],["Ua haere ʻoia nā rōpū i te mau tumu rāʻau.","Il est allé entre les arbres."],["Ua tātara ʻoia i tō na mau ʻahu i rāpae i te ʻāfata.","Il a retiré ses vêtements de la malle."],["Ua vaiho vau i te tipi i muri mai i te fare.","J'ai laissé le couteau derrière la maison."],["Ua ʻutaru vau nā muri mai i te fare.","J'ai arraché les mauvaises herbes derrière la maison."],["A hiʻo i mua !","Regarde devant !"],["Ua tāpū ʻona i te tumu rāʻau i mua mai i te fare.","Il a coupé l'arbre devant la maison."],["Ua tanu ʻoia i te tiare nā mua mai i te fare.","Elle a planté des fleurs devant la maison."],["Ua haere mai ʻoia i ʻō nei inanahi.","Il est venu ici hier."],["Ua ʻau ʻona mai Papeʻete e tae noa atu i Moʻorea.","Il a nagé de Pape'ete jusqu'à Mo'orea."],["Ua haere ʻoia e ʻati noa aʻe te fare.","Il a fait le tour de la maison."],["Ua tae mai ʻona mai te fenua Farāni mai.","Il est arrivé de France."],["E raverahi mau rātere nō te fenua Farāni.","Il y a beaucoup de touristes de France."],["E iʻa tō roto i te miti.","Il y a du poisson dans l'eau."]],"l":"L14"},"L14-G81":{"p":"81","t":"La direction : mai, atu, ai","r":"Première série : mai (vers celui qui parle), atu (à partir de celui qui parle), ai (particule idiomatique). Tout verbe de mouvement prend mai ou atu s'il a une personne pour complément. Sans personne en complément, pas de particule. Ai, après un verbe de mouvement précédé d'une locution de temps, de lieu ou de situation (présent ou avenir), fait écho à cette circonstance (« alors », « là ») ; il s'ajoute à mai ou atu si une personne est aussi concernée. Il s'emploie aussi avec les interrogatifs (§98-100).","f":["verbe ± mai / atu ± ai"],"e":[["E haere au i te ʻoire.","J'irai en ville."],["E hōroʻa atu vau nā ʻoe i te hōʻē taoʻa.","Je te donnerai un cadeau."],["E parau atu ʻoe ia rātou.","Tu leur parleras."],["E parau mai ʻoe ia ʻu.","Tu me parleras."],["E horo mai ʻoia i te hōʻē taoʻa nā ʻu.","Il me donnera un cadeau."],["Ua reva mai te pahī.","Le bateau est parti (en direction de celui qui parle)."],["E pāpaʻi atu vau ia ʻoe i te rata.","Je t'écrirai une lettre."],["ʻĒ, e pāpaʻi mai au ia ʻoe i te rata.","Oui, et pour toi j'écrirai une lettre."],["I te hora pae e haere ai au i te ʻoire.","À cinq heures (c'est alors que) j'irai en ville."],["I te hora piti e hōroʻa mai ai ʻoia i te taoʻa nā ʻu.","À deux heures il me remettra un cadeau."],["I te hora piti e hōroʻa atu ai au i te taoʻa na rātou.","À deux heures je leur donnerai un cadeau."]],"l":"L14"},"L14-G81b":{"p":"81b","t":"La direction : nei, na, ra","r":"Deuxième série, surtout avec les noms : nei (près de celui qui parle, nuance de présent), na (près de l'interlocuteur), ra (loin de celui qui parle, dans l'espace et le temps). Avec les verbes, elles marquent le temps (§46) ou l'espace quand celui-ci domine. Na s'emploie aussi avec l'impératif. I uta = vers l'intérieur (la montagne) ; i tai = vers la mer.","f":[],"e":[["A rave i te tipi nei !","Prends ce couteau-ci !"],["Ua faʻaea ʻoutou i Tahiti na.","Vous êtes restés (chez vous) à Tahiti."],["ʻA hiʻo na !","Regarde !"],["Mai na !","Viens ! Donne !"],["Ua oti te fare ra.","La maison est finie."],["I te mātāmua ra…","Au commencement (des temps)…"],["Te ʻamu ra vau.","Je suis en train de manger."],["Te ʻamu na ʻoe.","Tu es en train de manger."],["Te ʻamu ra ʻoia.","Il est en train de manger."],["E taʻoto te mau taʻata i uta i te faʻa.","Les hommes dormiront (en amont), dans le fond de la vallée."],["Ua pāinu te mau māʻa haʻari i tai.","Les noix de coco ont dérivé vers la mer."]],"l":"L14"},"L15-G83":{"p":"83","t":"Attribution (« pour »)","r":"Le complément d'attribution est nō ou nā + pronom, nom commun ou nom propre ; le choix entre nō et nā suit la même règle que tō / tā (§37).","f":["nō / nā + pronom / nom"],"e":[["E haere au e rave mai i te puta nā ʻoe.","J'irai prendre un livre pour toi."],["E haere au e hoʻo mai i te vaʻa nō oe.","J'irai t'acheter une pirogue."],["E haere au e tiʻi i te māʻa nā te ʻurī.","J'irai chercher de la nourriture pour le chien."],["E haere au e tiʻi i te tiaʻa nō tā ʻu vahine.","J'irai acheter des chaussures pour ma femme."]],"l":"L15"},"L15-G84":{"p":"84","t":"Accompagnement (« avec »)","r":"Trois façons de dire « avec » : ʻe + nom ; nā muri iho (ia …), synonyme ; ou les pronoms duels māua, rāua devant le nom de la personne qui accompagne.","f":["… ʻe + nom","… nā muri iho ia + nom / pronom","verbe + māua / rāua + ʻo + nom"],"e":[["E haere au e ori haere ʻe tā ʻu ʻurī.","Je vais aller faire une promenade avec mon chien."],["E haere au i te ʻoire ʻe taua taʻata ra.","J'irai en ville avec cet homme."],["Ua reva atu vau ʻe ʻo Peu.","Je suis parti avec Peu."],["Ua ori haere au nā muri iho ia ʻoe.","Je suis allé me promener avec toi."],["Ua reva atu ʻo Peu nā muri iho ia Teriʻi.","Peu est parti avec Teri'i."],["Ua reva atu māua ʻo Peu.","Je suis parti avec Peu. (litt. : Nous sommes partis, nous deux Peu.)"],["Ua reva atu Peu rāua ʻo Teriʻi.","Peu est parti avec Teri'i."]],"l":"L15"},"L15-G85":{"p":"85","t":"Manière","r":"L'adverbe de manière se place juste après le radical du verbe, même avant hia ; les compléments de manière avec préposition suivent le sujet. On trouve aussi la construction rare mai te + verbe + hia (« avec l'aide de »).","f":["particule + verbe + adverbe de manière (+ hia) + sujet","mai te + verbe + hia"],"e":[["Ua horo vitiviti ʻoia.","Il a couru vite."],["Ua pāpuʻa maitaʻi hia te ʻaʻahu ʻoʻomo.","La chemise a été bien lavée (ou : On a bien lavé la chemise)."],["Ia paraparau riʻi iho ā tāua i te reo Tahiti.","Il faut que nous parlions encore un peu tahitien tous les deux."],["Ua tāʻiri maitaʻi hia vau.","J'ai été bien battu."],["Ua roaʻa ia na te rē nā roto i tō na itoito.","Il a gagné grâce à son courage."],["Ua ʻau ʻoia mā te pūai.","Il a nagé avec force."],["Mai ia ʻoe atoʻa te hohoʻa o tā ʻoe tamaiti.","Ton fils te ressemble. (litt. : Tout comme toi l'image de ton enfant.)"],["Mai tō ʻu tō ʻoe tāupoʻo.","Ton chapeau est comme le mien."],["Ua reva atu ʻoia nā niʻa i te manureva.","Il est parti par avion."],["E mea tāere tā na tāmāʻa.","Il mange lentement."],["E mea vitiviti tā na horo.","Il court vite."],["Ua manuia ʻoia mai te tauturu hia ʻe tō na metua tāne.","Il a réussi avec l'aide de son père."],["E tupu ia te tahi ʻoriraʻa hanahana mai te peretiteni hia e te tōmitera teitei.","Il y a grand bal sous la présidence du haut-commissaire."]],"l":"L15"},"L16-G87":{"p":"87","t":"Le but","r":"Quatre façons d'indiquer le but : nō te + verbe (± -raʻa), quand le sujet des deux verbes est le même (la forme sans -raʻa est la plus fréquente) ; ia + verbe, quand les sujets sont différents ; ʻe + verbe, plutôt pour la conséquence ; nom + verbe, quand sujet et but sont étroitement liés (le verbe joue le rôle d'un adjectif, aussi avec -raʻa).","f":["nō te + verbe (± -raʻa)","ia + verbe","ʻe + verbe","nom + verbe"],"e":[["Ua haere ʻoia nō te rave mai i te faraoa.","Il est parti afin de prendre du pain."],["Ua rave ʻoia i te toʻi nō te tāpū i te vahie nō te hāmaniraʻa i te pou.","Il a pris une hache pour couper le bois afin de faire des poteaux."],["Te ʻau ra ʻoia ʻia riro te rē ia na.","Il nageait de manière à ce que le prix lui revienne."],["Ua haʻamāramarama maitaʻi au ia na ʻia pāpū maitaʻi ʻoia.","Je lui ai expliqué pour qu'il comprenne bien."],["Ua haere ʻoia ʻe pāʻimi i te puaʻa.","Il est allé chercher les cochons."],["Te haere nei tō ʻu metua tāne ʻe pīpī i te tiare.","Mon père s'en va arroser les fleurs."],["E tipi tāpū ʻīnaʻi puaʻatoro tērā.","C'est un couteau à couper la viande (de bœuf)."],["E mau ʻurī aʻuaʻu puaʻa tērā.","Ce sont des chiens à chasser le cochon."],["te parau faʻaʻiteraʻa","les mots explicatifs, les explications"],["te taime tanuraʻa","la saison de planter"]],"l":"L16"},"L16-G88":{"p":"88","t":"La cause","r":"Trois façons d'indiquer la cause : nō te mea … (« parce que », la plus courante) ; nō + adjectif possessif + verbe + -raʻa ; nā roto i … (« à cause de, grâce à »). Elles sont interchangeables.","f":["… nō te mea + phrase","nō + tō / tā + pronom + verbe-raʻa","nā roto i + nom"],"e":[["Ua riri ʻoia nō te mea ua pararī ia ʻu te hiʻo nō te haʻamāramarama.","Il est fâché parce que j'ai cassé la vitre de la fenêtre."],["Ua maʻi hia vau nō te mea ua ʻamu vau i te iʻa taʻero.","Je suis malade parce que j'ai mangé un poisson empoisonné."],["I tāpū na vau i te vahie nō te mea ʻaita ʻe vahie nō te tunuraʻa i te māʻa.","J'ai coupé le bois parce qu'il n'y avait pas de bois pour faire cuire le repas."],["Ua ʻoaʻoa ʻoia nō tō na revaraʻa i Tahiti.","Il est heureux de partir pour Tahiti (… de son départ …)."],["Ua maʻi hia vau nō tō ʻu ʻamuraʻa i te iʻa taʻero.","Je suis malade parce que j'ai mangé un poisson toxique (… de ma consommation)."],["Ua rave au nā roto i tō ʻu here ia na.","Je l'ai fait parce que je l'aimais (… dans mon amour pour elle)."]],"l":"L16"},"L17-G90":{"p":"90","t":"Les trois degrés de l'impératif","r":"A + verbe : ordre absolu, la forme la plus énergique (le sujet peut suivre pour plus de clarté). E + verbe : persuasion plutôt qu'ordre. Ia + verbe : exhortation, souhait (comme le subjonctif français). La défense se forme avec ʻeiaha (+ e + verbe).","f":["A + verbe (+ sujet)","E + verbe + sujet","Ia + verbe + sujet","ʻEiaha + e + verbe"],"e":[["A hōroʻa atu tērā puta ia na !","Donne lui ce livre !"],["A hiʻo na i tērā vāhi !","Regarde cet endroit !"],["A tāmāʻa !","Mange ! Mangez !"],["A tāmāʻa ʻoe !","Mange, toi !"],["ʻEiaha e ʻamu i teie ufi.","Ne mange pas cette igname."],["E haere tāua.","Allons-y tous les deux."],["E haere mai ʻoutou !","Venez donc, vous autres !"],["Ia tāpeʻa maitaʻi ʻona i teie taoʻa.","Qu'il garde bien ce cadeau."],["Ia tāpū ʻoia i te vahie.","Qu'il coupe le bois."],["ʻEiaha ʻoia ia pāʻimi i te puaʻa.","Qu'il ne cherche pas les cochons."]],"l":"L17"},"L18-G93":{"p":"93","t":"Oui ? Non ? (ānei)","r":"Pour une question fermée, ānei se place juste après le groupe verbal affirmatif (mais après les adverbes et particules de direction). À
