 l'interro-négative, ānei suit la particule négative.","f":["verbe + ānei + sujet","négation + ānei + sujet + verbe"],"e":[["Ua ʻau ānei ʻona inanahi ra ?","Est-ce qu'il a nagé hier ?"],["Ua hohoni hia ānei te taʻata e te ʻurī ?","L'homme a-t-il été mordu par le chien ?"],["Te taʻoto ra ānei ʻo Teriʻi ?","Teri'i est-il en train de dormir ?"],["E taʻurua ānei tō ananahi ?","Y aura-t-il fête demain ?"],["E mea ʻuoʻuo ānei tērā manu ?","Cet oiseau est-il blanc ?"],["Ua horo ʻoiʻoi mai ānei ʻoe ?","As-tu accouru bien vite ?"],["ʻAita ānei ʻoe i tāʻiri ʻia na ?","Ne l'as-tu pas frappé ?"],["ʻAita ānei te mau fēiā tuʻe pōpō nō Raiʻātea i tae mai ?","L'équipe de football de Ra'iātea n'est-elle pas arrivée ?"],["ʻEʻere ānei i tō ʻoe manaʻo ?","Est-ce que ce n'est pas ton idée ?"]],"l":"L18"},"L18-G94":{"p":"94","t":"Interrogatifs sujets","r":"O vai + nom ou pronom = qui ? (personne) ; E aha + nom ou pronom = quoi, quel ? (chose). Dans une question verbale : O vai + tē (présent progressif, futur ; e à l'oral) ou tei (autres temps) + verbe. Avec un verbe transitif : Nā vai + i + verbe.","f":["O vai + nom / pronom","E aha + nom / pronom","O vai + tē / tei + verbe","Nā vai + i + verbe transitif"],"e":[["O vai tērā taʻata ?","Qui est cet homme ?"],["O vai ʻoia ?","Qui est-ce ? Qui est-il ?"],["O vai ʻo ʻoe ?","Qui es-tu ?"],["O vai mā taua fēiā ra ?","Qui sont ces gens-là ?"],["E aha tērā tumu rāʻau ?","Quel est cet arbre ?"],["O vai tē ʻite i te ʻau ?","Qui est-ce qui sait nager ?"],["O vai tē hōroʻa atu i te puta nā ʻoe ?","Qui est-ce qui t'a donné ce livre ?"],["O vai tē vahine tei tunu i te ufi ?","Qui est la femme qui a fait cuire les ignames ?"],["O vai tē taʻata tei hōroʻa hia te puta e te tāvana ?","À qui le chef a-t-il donné le livre ?"],["O vai te vahine e tunu i te ufi ananahi ?","Quelle est la femme qui fera cuire les ignames demain ?"],["O vai tērā taʻata e ʻau ra ?","Qui est cette personne en train de nager ?"],["Nā vai i rave (i) tā ʻu pēni pāpaʻi ?","Qui a pris mon stylo ?"],["Nā vai i hōroʻa atu i tā na ʻavaʻava ?","Qui lui a donné ses cigarettes ?"]],"l":"L18"},"L18-G95":{"p":"95","t":"Interrogatifs compléments","r":"Objet : O vai + tā + possesseur (personne ; e présent/futur, i passé) ; Tēhia + nom (chose, « lequel »). Attribution : ia vai, i tēhia taʻata (« à qui »). Possession : nō vai / nā vai, nō tēhia taʻata / nā tēhia taʻata, tō vai / tā vai (« à qui est »). Agent du passif : e vai, e tēhia taʻata (« par qui »). Lieu : iō vai (« chez qui », avec mā pour un groupe familial).","f":["O vai + tā + sujet + e / i + verbe","Tēhia + nom","Nō / Nā vai + nom","Iō vai (mā)"],"e":[["O vai tā ʻoe e ʻite ra ?","Qui vois-tu ?"],["O vai tā ʻoe i hōroʻa atu i te puta ?","À qui as-tu donné le livre ?"],["O vai tā rātou e here ?","Qui aiment-ils ?"],["O vai tā te tāvana e here ?","Qui le chef aime-t-il ?"],["Tēhia tā ʻoe e hinaʻaro ?","Lequel veux-tu ?"],["Tēhia piripou tā ʻoe e hinaʻaro ?","Quel pantalon veux-tu ?"],["Ua hōroʻa hia ia vai ra te puta ?","À qui a-t-on donné le livre ?"],["Ua hōroʻa ʻoe i te puta ia vai ra ?","Tu as donné le livre à qui ?"],["Ua hōroʻa ʻoe i te puta i tēhia taʻata ?","Tu as donné le livre à quelle personne ?"],["Nō vai tērā vaʻa ?","À qui est cette pirogue ?"],["Nā vai tērā puta ?","À qui est ce livre ?"],["Nō tēhia taʻata te piripou nei ?","À quelle personne est ce pantalon ?"],["Nā tēhia taʻata te puta nei ?","À qui est ce livre ?"],["Tō vai te vaʻa maitaʻi aʻe ?","Qui possède la meilleure pirogue ?"],["Tā vai te faʻaʻapu rahi aʻe ?","Qui a la plus grande plantation ?"],["Ua rave hia tō ʻoe tāupoʻo e vai ?","Par qui ton chapeau a-t-il été pris ?"],["Ua hōroʻa hia e tēhia taʻata ?","Il a été offert par quelle personne ?"],["Ua haere ʻoe iō vai mā ?","Chez qui es-tu allé ?"],["Ua haere au iō Teriʻi mā.","Je suis allé chez Teri'i."]],"l":"L18"},"L19-G98":{"p":"98","t":"Pourquoi ?","r":"Nō te aha … ai (« pourquoi ? ») ; E aha … ai (plus familier) ; E aha te tumu … ai (la raison, le motif). Une phrase non verbale redevient verbale, et ai suit toujours le verbe. « Pourquoi … pas ? » : interrogatif + sujet + e ʻore ai e (présent) / i ʻore ai e (passé) + verbe.","f":["Nō te aha + sujet + i / e + verbe + ai","E aha + sujet + verbe + ai","Nō te aha + sujet + e / i ʻore ai e + verbe"],"e":[["Nō te aha ʻoe i hōroʻa atu ai i te puta ia na ?","Pourquoi lui as-tu donné le livre ?"],["Nō te aha ʻona i maoro ai i tā na ʻohipa inanahi ?","Pourquoi était-il en retard à son travail hier ?"],["Nō te aha te fenua i haumi ai ?","Pourquoi la terre est-elle humide ?"],["E aha ʻoe e ʻau ai ?","Pourquoi nages-tu ?"],["E aha tērā taʻata i pārahi noa ai ?","Pourquoi cet homme est-il encore assis ?"],["E aha te tumu rātou i tae mai ai i ʻō nei ?","Pour quelle raison sont-ils venus ici ?"],["Nō te aha ʻoe e ʻore ai e ʻau ?","Pourquoi ne nages-tu pas ?"],["Nō te aha ʻoe i ʻore ai e tunu i te māʻa ?","Pourquoi n'as-tu pas préparé le repas ?"]],"l":"L19"},"L19-G99":{"p":"99","t":"Où ?","r":"Tei hea + nom (phrase non verbale). Passé : I hea / Tei hea + sujet + i te + verbe-raʻa, ou I hea / Tei hea + tō + possesseur + verbe-raʻa. Présent, futur : I hea / Ei hea + sujet + e + verbe + ai. Destination : verbe + i hea. Provenance : Mai hea mai … ? ou Nō hea … ?","f":["Tei hea + nom","I hea + sujet + i te + verbe-raʻa","I hea / Ei hea + sujet + e + verbe + ai","verbe + sujet + i hea"],"e":[["Tei hea te fare toa ?","Où est le magasin ?"],["Tei hea te pōtiʻi ?","Où est la demoiselle ?"],["I hea ʻona i te ʻauraʻa inanahi ?","Où a-t-il nagé hier ?"],["I hea ʻona i te tāhunaraʻa i te puta ?","Où a-t-il caché le livre ?"],["I hea tō na ʻauraʻa inanahi ra ?","Où a-t-il nagé hier ?"],["I hea tō ʻoe vaihoraʻa i te puta ?","Où as-tu laissé le livre ?"],["I hea tō te vahine vaihoraʻa i te puta ?","Où la femme a-t-elle laissé le livre ?"],["Ei hea ʻo ʻoe e tāmāʻa ai i teie pō ?","Où mangeras-tu ce soir ?"],["I hea ʻona e taʻoto ai ?","Où dormira-t-il ?"],["E haere ʻoe i hea ?","Où vas-tu ?"],["Mai hea mai ʻoe ?","D'où viens-tu ?"],["Nō hea tērā pahī ?","D'où est ce navire ?"]],"l":"L19"},"L19-G100":{"p":"100","t":"Quand ?","r":"Āfea / Āhea + sujet + verbe au présent ou futur + ai (interchangeables). Ināfea + sujet + verbe au passé + ai (ou forme en -raʻa avec tō). E aha te taime … ai = à quel moment ? (tous temps).","f":["Āfea / Āhea + sujet + e + verbe + ai","Ināfea + sujet + i + verbe + ai","E aha te taime + sujet + verbe + ai"],"e":[["Āfea ʻoia e reva ai ?","Quand partira-t-il ?"],["Āhea rātou e taʻoto ai ?","Quand dormiront-ils ?"],["Āfea ʻo ʻoe e hoʻi mai ai ?","Quand reviendras-tu ?"],["Ināfea ʻoia i reva atu ai ?","Quand est-il parti ?"],["Ināfea tō ʻoe haereraʻa e tāiʻa ?","Quand es-tu allé pêcher ?"],["E aha te taime ʻona i tāʻiri ai i te ʻurī ?","À quel moment a-t-il frappé le chien ?"]],"l":"L19"},"L19-G101":{"p":"101","t":"Comment ?","r":"Ua nāfea (passé), E nāfea (futur), Te nāfea ra (présent) + sujet + i te + verbe. Ou E mea nāfea (passé), E nāfea (futur), Te nāfea ra (présent) + tō / tā + sujet + verbe-raʻa : avec tō, curiosité générale ; avec tā, question précise sur le moyen.","f":["Ua / E nāfea + sujet + i te + verbe","E mea nāfea + tō / tā + sujet + verbe-raʻa"],"e":[["Ua nāfea rātou i te rave ?","Comment ont-ils fait ?"],["Ua nāfea rātou i te hāmani i te fare ?","Comment ont-ils fait la maison ?"],["E nāfea rātou i te rave ?","Comment s'y prendront-ils ?"],["E nāfea rātou i te hāmaniraʻa i te fare ?","Comment feront-ils la maison ?"],["Te nāfea ra ʻoe i te hāmaniraʻa i te fare ?","Comment construis-tu la maison ?"],["E mea nāfea tā rātou raveraʻa ?","Comment ont-ils fait ?"],["E mea nāfea tā rātou hāmaniraʻa i te fare ?","De quelle manière ont-ils construit la maison ?"],["E nāfea tā rātou raveraʻa ?","Comment procéderont-ils ?"],["Te nāfea ra tō ʻoe hāmaniraʻa i te fare ?","Comment fais-tu la maison ?"]],"l":"L19"},"L19-G102":{"p":"102","t":"Quoi ?","r":"Phrase non verbale : E aha + nom, pronom ou démonstratif. Phrase verbale : E aha + adjectif possessif + verbe. « Avec quoi ? » : i te aha ; « par quoi ? » : e te aha.","f":["E aha + nom / démonstratif","E aha + tā + sujet + e / i + verbe"],"e":[["E aha tērā ?","Qu'est-ce que c'est ?"],["E aha tērā tumu rāʻau ?","Quel est cet arbre ?"],["E aha tā ʻoe e rave ra ?","Que fais-tu là-bas ?"],["E aha tā ʻoe e hiʻo ra ?","Que regardes-tu là-bas ?"],["E aha tā ʻoe i ʻite inanahi ra ?","Qu'as-tu vu hier ?"],["E aha tā ʻoe e ʻite ananahi ?","Que verras-tu demain ?"],["Te aha na ʻoe ?","Que fais-tu ?"],["I aha na ʻoe ?","Qu'as-tu fait ?"],["E aha tā ʻoe ?","Qu'est-ce que tu as ?"],["E aha tā na ?","Qu'est-ce qu'il/elle a ?"],["Ua tāʻiri ʻoia i te aha ?","Avec quoi a-t-il tapé ?"],["Ua pātia hia ʻoe e te aha ?","Par quoi as-tu été piqué ?"]],"l":"L19"},"L20-G105":{"p":"105","t":"Relatifs sujets","r":"« C'est moi qui… » : O + pronom + tē (présent progressif, futur) / tei (passé) + verbe. Après une principale verbale, selon le temps de la relative : e + verbe + nei (présent) / ra (passé progressif) ; ʻo tei ou tei (action achevée) ; i te + verbe-raʻa (état ou occupation) ; ʻo tē ou tē (futur). Relative au passif : tei / i (passé), tē / e (futur, présent).","f":["O + pronom + tē / tei + verbe","nom + e + verbe + nei / ra","nom + (ʻo) tei + verbe (passé)","nom + i te + verbe-raʻa (état)","nom + (ʻo) tē + verbe (futur)"],"e":[["O vau tē tāora i te ʻōfaʻi.","C'est moi qui vais jeter les pierres."],["O vau tei tāora i te ʻōfaʻi inanahi ra.","C'est moi qui ai jeté les pierres hier."],["O vau tē parau nei.","C'est moi qui suis en train de parler."],["Ua ʻite au i te hōʻē vahine e ʻau ra.","J'ai vu une femme qui nageait."],["A hiʻo na ʻoe i te mau manu e maʻue nei.","Regarde ces oiseaux qui sont en train de voler."],["E aʻo ʻoe i te tamaiti ʻo tei tāora mai i te ʻōfaʻi.","Tu gronderas le petit garçon qui a jeté la pierre."],["Ua ʻite au i te hōʻē taʻata i te tāpūraʻa i te vahie.","J'ai vu un homme qui coupait du bois. (litt. : J'ai vu un homme à la coupe du bois.)"],["Ua ʻite au i te hōʻē taʻata i te hōroʻaraʻa i te māʻa nā te ʻurī.","J'ai vu un homme qui donnait à manger au chien."],["Te faʻaroʻo nei au i te ʻaiū i te taʻiraʻa.","J'entends le bébé qui pleure."],["Te taʻata ʻo tē ʻīā e faʻahapa hia ʻoia e te ture.","La personne qui volera sera punie par la loi."],["ʻO vai ʻo tē paraparau nō te haʻamāurūruraʻa i te manihini ?","Qui prendra la parole pour remercier les invités ?"],["Ua inu vau i te rāʻau tei hōroʻa hia nā te pōtiʻi.","J'ai bu le médicament qui avait été donné à la demoiselle."],["Ua ʻite au i te taoʻa tē hōroʻa hia nā te tāvana.","J'ai vu le cadeau qui sera offert au chef."]],"l":"L20"},"L20-G106":{"p":"106","t":"Relatifs compléments","r":"Quand le sujet de la relative diffère de l'antécédent (« l'homme que je… »), le relatif est remplacé par tā ou ʻo tā + nom ou pronom, puis e (présent, futur) ou i (passé) + verbe. Au passif, on revient à la structure du §105 d. Principale au passif : e tei / nā tei = par qui, par quoi.","f":["nom + (ʻo) tā + sujet + e / i + verbe","… e tei / nā tei + verbe"],"e":[["E inu vau i te pia tā ʻu e au maitaʻi.","Je boirai la bière que j'aime bien."],["Ua ʻite au i te taoʻa tā rātou i hōroʻa atu nā te tāvana.","J'ai vu le cadeau qu'ils ont offert au chef."],["Ua ʻite au i te taoʻa tā te vahine i hōroʻa atu i te tāvana.","J'ai vu le cadeau que la femme a donné au chef."],["Ua ʻite au i te ariʻi tei hōroʻa hia te maro ʻura.","J'ai vu le roi à qui on a donné la ceinture pourpre."],["Ua tāpeʻa hia ʻoia nā tei tapapa mai ia na.","Il a été retenu par la personne qui le recherchait."]],"l":"L20"},"L21-G109":{"p":"109","t":"Cause (« pourquoi » subordonné)","r":"« Pourquoi » introduisant une subordonnée se dit nō te aha.","f":["… nō te aha + sujet + i + verbe + ai"],"e":[["Ua ʻite au nō te aha ʻoia i haere ai e hopu i te miti.","Je sais pourquoi il est allé se baigner à la mer."],["Ua ʻite au nō te aha ʻoia i hohoni hia e te maʻo.","Je sais pourquoi il a été mordu par le requin."]],"l":"L21"},"L21-G110":{"p":"110","t":"Temps (« quand »)","r":"Subordonnée en tête : ʻia ou ia (« quand »), avec la forme complément du pronom comme sujet (ia na, ia ʻu). Subordonnée après la principale : I te mahana / E aha te taime + sujet + verbe, ou I te mahana + nō + possessif + verbe-raʻa.","f":["Ia + verbe + sujet, principale","… i te mahana / e aha te taime + sujet + verbe","… i te mahana nō + possessif + verbe-raʻa"],"e":[["Ia oti tā rātou pāfaʻiraʻa ʻānani, e pou mai rātou.","Quand leur cueillette d'oranges sera finie, ils redescendront."],["Ia marū te mataʻi, e haere ai tāua e tāiʻa.","Quand le vent sera calmé, nous partirons pour la pêche."],["Ia reva atu te tāvana, te paraparau noa ra ia te mau taʻata.","Quand le chef fut parti, les gens discutaient encore."],["Ia na i reva atu, te taʻoto noa ra ʻoe.","Quand il est parti, tu dormais encore."],["Ia ʻu i parau, te parau atoʻa ra ʻoia.","Quand je parlais, il parlait lui aussi."],["ʻAita roa vau i ʻite i te mahana ʻoia e tae mai ai.","Je ne connais pas du tout le jour où il arrivera."],["ʻAita vau i ʻite e aha te taime ʻoia e hoʻi mai ai.","Je ne sais pas quand il reviendra."],["ʻAita vau i ʻite i te mahana nō tō na taeraʻa mai.","Je ne connais pas le jour de son arrivée."]],"l":"L21"},"L21-G111":{"p":"111","t":"Simultanéité","r":"« En même temps que » : ʻa + verbe + ai. Deux actions simultanées : mā te + verbe ; si le second verbe est un verbe de mouvement : mā te + verbe + mai.","f":["ʻa + verbe + ai","mā te + verbe","mā te + verbe + mai"],"e":[["I teie taime ʻa paraparau ai au nā roto i te niuniu, te ʻite nei au i te hōʻē taʻata.","À l'instant même où je parle au téléphone, je vois un homme."],["I te ʻāvaʻe a pohe ai ʻona.","Le mois même où il est mort."],["Ua ori haere ʻona mā te inu i te pia.","Il se promenait tout en buvant de la bière."],["Te haere ra ʻona mā te hiʻo i muri.","Il allait en regardant derrière lui."],["E pou mai rātou i raro mā te amo mai i te ʻānani.","Ils descendent en portant des oranges sur l'épaule."],["Te haere mai pau roa te hui raʻatira mā te tāmau mai i te hei i niʻa i te upoʻo.","Toute la population arrive, chacun s'attachant une couronne sur la tête."]],"l":"L21"},"L21-G112":{"p":"112","t":"Manière (« comment » subordonné)","r":"Au passé : E mea nāfea + possessif + verbe-raʻa. Au futur : E nāfea + sujet + i te + verbe.","f":["E mea nāfea + possessif + verbe-raʻa","E nāfea + sujet + i te + verbe"],"e":[["Ua ʻite au e mea nāfea tō na faʻafānauraʻa i tā ʻu vahine.","Je sais comment elle a préparé l'accouchement de ma femme."],["ʻAita vau i ʻite e nāfea ʻona i te hāmani i tō na fare.","J'ignore comment il fera sa maison."]],"l":"L21"},"L21-G113":{"p":"113","t":"Objet (« ce que »)","r":"E aha + possessif + verbe.","f":["E aha + tā + sujet + verbe"],"e":[["ʻAita vau (e) ʻite e aha tā na e rave nei.","Je ne sais pas ce qu'il est en train de faire."],["ʻAita vau (e) ʻite e aha tā na ʻohipa inanahi ra.","J'ignore ce qu'il faisait hier."]],"l":"L21"},"L21-G114":{"p":"114","t":"Question indirecte (« si »)","r":"« Savoir si… » : ānei placé après le verbe de la subordonnée.","f":["… verbe + ānei + sujet"],"e":[["ʻAita vau (e) ʻite e hohoni hia ānei ʻoia e te maʻo.","Je ne sais pas s'il sera mordu par le requin."],["ʻAita vau (e) ʻite e haere mai ānei ʻoia ananahi.","Je ne sais pas s'il viendra demain."]],"l":"L21"},"L21-G115":{"p":"115","t":"Savoir que, dire que","r":"Ē (« que »), à la fin de la principale, introduit la subordonnée après les verbes de connaissance ; avec « dire », il est souvent omis.","f":["principale + ē + subordonnée"],"e":[["Ua ʻite au ē ua reva atu ʻoia inanahi ra.","Je sais qu'il est parti hier."],["Ua ʻite au ē maʻi tō tērā taʻata.","Je sais que cet homme est malade."],["Ua parau vau tē haere mai te tāvana.","J'ai dit que le chef venait."]],"l":"L21"},"L21-G116":{"p":"116","t":"Date d'origine (« depuis »)","r":"Mai te mahana + sujet + a + verbe, ou Mai te mahana i + verbe + sujet.","f":["Mai te mahana + sujet + a + verbe","Mai te mahana i + verbe + ai + sujet"],"e":[["Mai te mahana vau a tae mai i Tahiti, ʻaita te fare i taui.","Depuis le jour où je suis arrivé à Tahiti, la maison n'a pas changé."],["Mai te mahana i reva atu ai ʻoe…","Depuis que tu es parti…"]],"l":"L21"},"L21-G117":{"p":"117","t":"Lieu (« où » non interrogatif)","r":"« Où se trouve » : tei reira + nom. « (Le lieu) où » : verbe + sujet + i hea, ou i te vāhi + possessif + verbe ; au futur : i te vāhi e + verbe + ai + sujet.","f":["nom + tei reira + nom","verbe + sujet + i hea","i te vāhi + tā + sujet + verbe"],"e":[["te faʻa tei reira te ʻānani","la vallée où sont les oranges"],["te vāhi tei reira te hōtēra","l'endroit où se trouve l'hôtel"],["ʻAita vau (e) ʻite ua haere ʻoia i hea.","Je ne sais pas à quel endroit il est allé."],["ʻAita vau (e) ʻite e haere ra ʻoia i hea.","Je ne sais pas où il va."],["ʻAita vau (e) ʻite i te vāhi tā na i haere.","Je ne sais pas où il est allé."],["Ua ʻite au (i) te vāhi tā na e haere ra.","Je connais l'endroit où il va."],["ʻAita vau (e) ʻite i te vāhi e haere ai ʻoia.","Je ne sais pas où il ira."]],"l":"L21"},"L22-G120":{"p":"120","t":"Réfléchi","r":"Verbe + sujet + pronom complément. Certains verbes ont un sens réfléchi sans pronom (mutu, se couper ; hiʻohiʻo, s'observer).","f":["verbe + sujet + pronom complément"],"e":[["Ua haʻapohe ʻoia ia na.","Il s'est donné la mort (litt. : il a tué lui)."],["Ua horohoroi au ia ʻu i teie poʻipoʻi.","Je me suis lavé ce matin."],["Ua mutu ʻo Teriʻi i tērā tipi.","Teri'i s'est coupé avec ce couteau."],["Ua mutu vau i te tipi.","Je me suis coupé avec un couteau."],["Ua hiʻohiʻo vau i roto i te hiʻo.","Je me suis observé(e) dans le miroir."]],"l":"L22"},"L22-G121":{"p":"121","t":"Réciproque","r":"Répétition du pronom suivie de iho ; l'ordre des mots ne change pas.","f":["verbe + pronom + pronom + iho"],"e":[["A moto ʻoutou ʻoutou iho !","Battez-vous ! Boxez l'un contre l'autre !"],["E hinaʻaro vau ʻia tauturu tērā mau taʻata ia rātou rātou iho.","Je désire que ces gens-là s'entraident."]],"l":"L22"},"L22-G122":{"p":"122","t":"Emphase","r":"Déclaration possessive renforcée de iho : nā + nom ou pronom + iho (« c'est … lui-même qui »).","f":["Nā + nom / pronom + iho + i + verbe"],"e":[["Nā ʻu iho i hāmani.","C'est moi-même qui l'ai fait."],["Nā Teriʻi iho i parau.","C'est Teri'i lui-même qui l'a dit."]],"l":"L22"},"L22-G123":{"p":"123","t":"Possibilité, impossibilité","r":"« Pouvoir » : E nehenehe tā + nom ou pronom + e + verbe (« il est possible pour untel de ») ; plus cérémonieux : E nehenehe ia + pronom / i + nom + ia + verbe ; pour une permission, e tiʻa remplace e nehenehe. Impossibilité : ʻE'ita / ʻAita + tā + nom ou pronom + e nehenehe e + verbe.","f":["E nehenehe tā + sujet + e + verbe","E tiʻa (ānei) ia + pronom + ia + verbe","ʻEʻita tā + sujet + e nehenehe e + verbe"],"e":[["E nehenehe tā ʻu e paʻuma i niʻa i tērā tumu rāʻau.","Je suis capable de grimper sur cet arbre."],["E nehenehe ānei tā ʻoe e amo mai i tērā pūtē ?","Peux-tu porter ce sac sur ton dos ?"],["E nehenehe tā tērā taʻata e paʻuma i niʻa i tērā tumu ʻuru.","Cet homme peut grimper sur cet arbre à pain."],["Ananahi, e nehenehe tā ʻu e haere e hopu i te miti.","Demain, je peux aller me baigner à la mer."],["E nehenehe ia na ia horo.","Elle peut courir."],["E nehenehe i tērā taʻata ia rave mai i tā ʻoe tauihaʻa.","Cette personne peut prendre vos affaires."],["E tiʻa ānei ia ʻu ia rave i teie ope ?","M'est-il permis de prendre cette pelle ?"],["ʻEʻita tā ʻu e nehenehe e paʻuma i niʻa i tērā tumu rāʻau.","Je ne peux pas grimper à cet arbre."]],"l":"L22"},"L22-G124":{"p":"124","t":"Compétence (« savoir faire »)","r":"Ua ʻite + sujet + i te + verbe.","f":["Ua ʻite + sujet + i te + verbe"],"e":[["Ua ʻite ānei ʻoe i te tunu i te ufi ?","Sais-tu faire cuire les ignames ?"],["ʻĒ, ua ʻite au i te tunu i te ufi.","Oui, je sais faire cuire les ignames."]],"l":"L22"},"L22-G125":{"p":"125","t":"Essai","r":"E / Ua tāmata + sujet + i te + verbe.","f":["E / Ua tāmata + sujet + i te + verbe"],"e":[["E tāmata vau i te hāmani i te fare.","J'essaierai de faire une maison."],["Inanahi ra, ua tāmata vau i te hāmani i te hōʻē ʻāfata.","Hier, j'ai essayé de fabriquer une caisse."]],"l":"L22"},"L23-G128":{"p":"128","t":"Désir et volonté","r":"Même sujet : Te / E / Ua + hinaʻaro + sujet + e + verbe. Sujet différent : … + hinaʻaro + sujet + e / ʻia + verbe + 2e sujet. Hinaʻaro s'emploie aussi avec un nom (« vouloir quelque chose »). Négation, même sujet : négatif + sujet + i / e + hinaʻaro + i te (passé) / e (présent) + verbe. Façon indirecte et polie : E tiʻa ānei ia … ia + verbe ?, ou plus courant E nehenehe ānei tā … e + verbe ?","f":["Te / E / Ua + hinaʻaro + sujet + e + verbe","… hinaʻaro + sujet + e / ʻia + verbe + 2e sujet","ʻAita / ʻEʻita + sujet + i / e + hinaʻaro + i te / e + verbe"],"e":[["Te hinaʻaro nei au e hoʻo mai i te hei pūpū.","Je veux acheter un collier de coquillages."],["E hinaʻaro vau e tunu i te ufi.","Je veux faire cuire les ignames."],["E hinaʻaro vau i tērā hei pūpū.","Je voudrais ce collier de coquillages."],["Te hinaʻaro nei au e tauturu mai ʻoe ia ʻu.","Je veux que tu m'aides."],["Te hinaʻaro nei ʻoia ʻia hāmani au i te fare.","Il veut que je construise une maison."],["ʻAita vau i hinaʻaro i te haere.","Je ne voulais pas y aller."],["ʻAita vau i hinaʻaro i te haere tāiʻa.","Je n'ai pas voulu aller à la pêche."],["ʻEʻita vau e hinaʻaro e haere e tāiʻa.","Je ne veux pas aller à la pêche."],["ʻEʻita vau e hinaʻaro ia haʻapararī ʻoe i tā ʻu hapaina.","Je n'ai pas envie que tu casses mon verre."],["E tiʻa ānei ia ʻoe ia hīmene ?","Voudrais-tu bien chanter ?"],["E nehenehe ānei tā ʻoe e hīmene ?","Peux-tu chanter ?"]],"l":"L23"},"L23-G129":{"p":"129","t":"Obligation","r":"La forme la plus courante : E / Ia (présent) ou Ua (passé) + verbe + iho ā (plus fort, « vraiment ») ou hoʻi (« aussi », plutôt « devrais ») + sujet. Interdiction : ʻeiaha iho ā. E mea + verbe + iho ā / hoʻi + sujet = on aurait dû. Ia + verbe + mau + sujet + e tiʻa ai = obligation la plus forte (présent). E mea maitaʻi + ia + verbe = il est bon que. E mea faufaʻa + ia + verbe = cela vaut la peine, il faut.","f":["E / Ia / Ua + verbe + iho ā / hoʻi + sujet","E mea + verbe + iho ā / hoʻi + sujet","Ia + verbe + mau + sujet + e tiʻa ai","E mea maitaʻi + ia + verbe","E mea faufaʻa + ia + verbe"],"e":[["E haere iho ā vau e rave mai i te faraoa.","Je dois partir chercher le pain."],["Ia tae iho ā tāua i te tahua tauraʻa manureva i te hora piti.","Nous devons arriver à l'aéroport à deux heures."],["Ua haere iho ā vau e rave mai i te faraoa.","J'ai dû aller chercher le pain."],["E haere hoʻi au i te fare toa.","Je dois / je devrais aller au magasin."],["ʻEiaha iho ā ʻoe e tāpū i te tumu.","Tu ne dois vraiment pas couper le tronc."],["E mea haere iho ā vau e rave mai i te faraoa monamona.","J'aurais dû aller chercher du gâteau (litt. : pain sucré)."],["Ia ʻamu mau vau e tiʻa ai.","Je dois absolument manger."],["ʻEiaha roa vau e ʻamu.","Je ne dois surtout pas manger."],["E mea maitaʻi ia ʻamu vau.","Il serait bien que je mange."],["E mea faufaʻa ia ʻu ia haere e tiʻi i te moni.","Il faut (vaut la peine) que j'aille chercher de l'argent."],["ʻEʻere i te mea faufaʻa ia ʻu ia haere e tiʻi i te moni.","Je n'ai pas besoin d'aller chercher d'argent."]],"l":"L23"},"L23-G130":{"p":"130","t":"Conditionnel","r":"Condition réalisable : mai te peu (ē) ou mai te mea (ē). Condition irréalisable : ʻahiri. « J'aurais … si … » : E mea + verbe … + ʻahiri.","f":["Mai te peu (ē) / Mai te mea (ē) + condition, principale","ʻAhiri + condition, principale","E mea + verbe …, ʻahiri + condition"],"e":[["E tāʻiri au ia ʻoe, mai te peu ē e haʻapararī ʻoe i tērā hapaina.","Je vais te taper si tu casses ce verre."],["Mai te mea (ē) e haere mai ʻoe ananahi, e hōroʻa atu vau i te taoʻa nā ʻoe.","Si tu viens demain, je te donnerai un cadeau."],["ʻAhiri vau i hāmani i te ʻāua, e ʻore ia tā ʻu mau māʻa tanu e ʻamu hia e te puaʻatoro.","Si j'avais fait une clôture, mes légumes n'auraient pas été mangés par le bétail."],["E mea tāpū vau i te vahie, ʻahiri ʻoe i hōroʻa mai i te moni maitaʻi nā ʻu.","J'aurais coupé le bois si tu m'avais bien payé."]],"l":"L23"},"L24-G133":{"p":"133","t":"Les conjonctions usuelles","r":"ʻaore ra (ou bien), ia ʻore ra et ʻaita ra (sinon), tērā ra (mais), paha et e riro paha (peut-être), ʻoia hoʻi (c'est-à-dire), nō reira (donc), noa atu ā (bien que), ʻe (et), ʻauaʻe (heureusement que).","f":[],"e":[["I te mahana māʻa ʻaore ra i te tāpati.","(Ce sera) samedi ou bien dimanche."],["te puaʻatoro ʻaore ra te puaʻahorofenua","le bœuf ou le cheval"],["E rave maitaʻi tāua i te ʻohipa ia ʻore ra, ʻeʻita ia tā tāua puta e oti.","Nous devons bien travailler tous deux, sinon notre livre ne sera pas fini."],["ʻAita ra, ʻeʻita ia te fare i oti.","Sinon la maison n'aurait pas été finie."],["Ua manaʻo vau e haere e tanu i te taro, tērā ra, ua moʻe tāʻu ope.","Je pensais aller planter des taros, mais voilà, j'ai perdu ma pelle."],["E haere mai ʻoia e riro paha i te tāpati.","Il viendra peut-être dimanche."],["E riro paha ʻoia i te haere mai.","Peut-être qu'il viendra."],["te mau rātere, ʻoia hoʻi te mau fēiā tē haere mai nō te mātaʻitaʻi","les touristes, c'est-à-dire les gens qui viennent visiter"],["Nō reira ʻoia i haere ai e tunu i te māʻa.","Elle partit donc faire cuire le repas."],["Noa atu ā ia te mahana, e toʻetoʻe noa.","Bien qu'il fasse soleil, il fait encore froid."],["te tāupoʻo ʻe te piripou","le chapeau et le short"],["Te haere ra vau e taʻoto ; ʻauaʻe ʻoe i tāniuniu mai.","J'allais me coucher ; heureusement que tu m'as téléphoné."]],"l":"L24"}},"X":{"L02-E14a-01":{"d":"tah>fr","q":"Te fare.","a":["La maison."],"c":"Traduire en français","p":"14-a","n":1,"l":"L02","s":158},"L02-E14a-02":{"d":"tah>fr","q":"Te mau taʻata.","a":["Les hommes."],"c":"Traduire en français","p":"14-a","n":2,"l":"L02","s":158},"L02-E14a-03":{"d":"tah>fr","q":"Te hōʻē ʻurī.","a":["Un chien."],"c":"Traduire en français","p":"14-a","n":3,"l":"L d":"fr>tah","q":"Les demoiselles doivent aller chercher le gâteau.","a":["E haere iho ā te pōtiʻi e tiʻi i te faraoa monamona."],"c":"Traduire en tahitien","p":"131-b","n":6,"l":"L23","s":166},"L23-E131b-07":{"d":"fr>tah","q":"Ils veulent acheter un bateau.","a":["E hinaʻaro rātou e hoʻo mai i te poti."],"c":"Traduire en tahitien","p":"131-b","n":7,"l":"L23","s":166},"L23-E131b-08":{"d":"fr>tah","q":"Ils veulent tous les deux que je fasse une pirogue.","a":["Te hinaʻaro nei rāua ia hāmani au i te vaʻa."],"c":"Traduire en tahitien","p":"131-b","n":8,"l":"L23","s":166},"L23-E131b-09":{"d":"fr>tah","q":"Il ne faut pas que tu casses ce verre.","a":["ʻEiaha ʻoe e haʻapararī i tērā hapaina."],"c":"Traduire en tahitien","p":"131-b","n":9,"l":"L23","s":166},"L23-E131b-10":{"d":"fr>tah","q":"Si ce chien mord ma volaille, je le tuerai.","a":["Mai te peu ē e hohoni tērā ʻurī i tā ʻu moa faʻaʻamu, e tāparahi pohe roa vau ia na."],"c":"Traduire en tahitien","p":"131-b","n":10,"l":"L23","s":166}},"T":{"L17-T92":{"p":"92","t":"Arrivée à Tahiti","tah":"I teie taime te tae nei tātou i te tahua tauraʻa manureva nō Faʻaʻa i Tahiti. I te hora hitu e te ʻāfa te tae mai nei te manureva nō te taiete farāni. Te haere mai nei te mau horo pātete nō te manureva i roto i te vāhi faʻariʻiraʻa nō te mau rātere. Te ʻite nei au e raverahi mau rātere nō te mau fenua ātea mai, ʻoia hoʻi, nō te fenua Farāni, nō te fenua Marite mai, nō te fenua Europa mai, e nō te fenua Niuterani atoʻa.\nTe ʻite nei au i te hōʻē taʻata tē haere mai nei e tā na mau tauihaʻa. Te hinaʻaro nei ʻoia e rave i te hōʻē pereoʻo nō te haere i tō na hōtēra. Te ani nei teie taʻata rātere i te hōʻē taʻata faʻahoro pereoʻo nō te ʻāfaʻi atu ia na i te ʻoire, i te vāhi tei reira tō na hōtēra. Te ani nei ʻoia i teie taʻata faʻahoro pereoʻo :\n– A faʻaʻite mai na ʻoe ia ʻu, e nehenehe ānei tā ʻoe e rave ia ʻu nō te faʻahoro atu i te hōtēra ?\n– Ē, e nehenehe roa, e haere tāua. Tei hea tō ʻoe mau tauihaʻa ?\n– Teie, e nehenehe tā ʻoe e rave.\n– E ʻāfaʻi au i roto i te pereoʻo, e haere tāua i tā ʻoe hōtēra i Papeʻete.","fr":"Maintenant nous arrivons à l'aéroport de Fa'a'a à Tahiti. À sept heures et demie l'avion de la compagnie française arrive. Les passagers de l'avion vont à la zone d'accueil des touristes. Je vois toutes sortes de touristes des pays lointains c'est-à-dire de France, d'Amérique, d'Europe et aussi de Nouvelle-Zélande.\nJe vois un homme qui approche avec ses bagages. Il veut prendre un taxi pour aller à son hôtel. Le touriste demande à un chauffeur de taxi de l'emmener en ville, à l'endroit où se trouve son hôtel. Il demande au chauffeur de taxi :\n– Renseignez-moi donc, pouvez-vous me prendre pour me conduire à l'hôtel ?\n– Oui, c'est très possible, allons-y. Où sont vos valises ?\n– Les voici. Vous pouvez les prendre.\n– Je les mets dans le coffre, allons tous les deux à votre hôtel à Pape'ete.","l":"L17"},"L18-T97":{"p":"97","t":"À la poste","tah":"I teie poʻipoʻi ua haere te hōʻē rātere i te fare rata nō te hāpono i tā na rata i te fenua marite ʻē tā na atoʻa ʻāfata tauihaʻa. I teie taime te tomo nei ʻona i roto i te fare rata. Te ʻite nei ʻoia i te hōʻē pōtiʻi purotu nō te fare rata. I teie nei te ani ra ʻoia i taua pōtiʻi ra ʻe mea nāfea ʻia hāpono i tā na rata ʻe tā na ʻāfata tauihaʻa.\n– ʻIa ora na ʻoe. E aha te huru i teie poʻipoʻi ?\n– Maitaʻi roa. E aha tā ʻoe i haere mai ai ?\n– Te haere mai nei au nō te hāpono i tā ʻu nau rata ʻe piti e tā ʻu ʻāfata tauihaʻa i te fenua marite.\n– ʻEiaha ʻe rū, e fāito vau i tā ʻoe nau rata nā mua. A hōroʻa mai. Nō teie e piti nau rata e hōʻē hānere e ono ʻahuru mā vaʻu farāne. ʻE mea hāpono atoʻa teie ʻāfata tā ʻoe ?\n– Ē, ʻe mea hāpono atoʻa i te fenua marite.\n– ʻAhiri ! A hōroʻa mai e fāito vau. E piti tiro teie ʻāfata tā ʻoe, e pae hānere e maha ʻahuru tārā te moni nō teie ʻāfata nō te hāponoraʻa nā niʻa i te manureva.\n– Māurūru ia ʻoe. Te ʻoaʻoa nei au nō te mea, i tō ʻu haereraʻa mai i roto i teie fare rata, ia hiʻo vau, ʻo ʻoe anaʻe te pōtiʻi purotu roa.","fr":"Ce matin, un touriste est allé à la poste pour expédier ses lettres et son colis en Amérique. Voici qu'il entre dans la poste. Il voit une belle demoiselle de la poste. Alors il demande à cette demoiselle comment expédier ses lettres et son colis.\n– Bonjour. Comment ça va ce matin ?\n– Très bien. Pourquoi es-tu venu ?\n– Je viens poster mes deux lettres et mon colis pour l'Amérique.\n– Pas de précipitation, je vais peser tes lettres d'abord. Donne-les moi. Pour ces deux lettres-ci, c'est 168 francs. Ton paquet est-il à expédier aussi ?\n– Oui, il est également à envoyer en Amérique.\n– Voyons un peu ! Donne-le moi que je le pèse. Ton colis fait deux kilogrammes, c'est cinq cent quarante tara (540 x 5 CFP = 2 700 CFP) pour envoyer ce colis par avion.\n– Merci. Je suis content parce que, dès mon entrée dans ce bureau de poste, j'ai vu que tu étais la seule très belle jeune fille.","l":"L18"},"L19-T104":{"p":"104","t":"Conversation","tah":"– I hea ʻoe i teie mahana ?\n– Ua haere au i te mātete e hoʻo mai i te iʻa. Ua tae vau i te mātete, ʻaita e iʻa. Ua rave noa mai au i te mau fēʻī, te ʻumara, te ufi. ʻE ʻo ʻoe, i hea ʻoe i teie mahana ?\n– Ua haere au e hopu i te miti nō te mea ʻaita tā ʻu e ʻohipa i teie mahana. Ua manaʻo vau e haere e hopu riʻi i te miti. Āfea ʻoutou e haere ai i Raʻiātea ?\n– Te manaʻo nei au e riro paha i teie hepetoma i mua nei. Ei reira mātou e haere atu ai i Raiʻātea. Te maororaʻa e riro paha e piti ʻaore ra e toru ʻāvaʻe. ʻE ʻōrua ? E haere ʻōrua i hea i teie mau mahana i mua nei ?\n– Te manaʻo nei māua e haere atu i te mau motu Matuita mā, nō te mea te vai ra te tahi mau hoa tō māua ʻo tei pāpaʻi mai, mai te mea ʻe hinaʻaro māua i te haere e faʻafaʻaea te tahi mau mahana i Matuita mā. E nehenehe roa tā māua e reva atu i te fenua Matuita.\n– I teie taime te manaʻo nei au ua tae i te hora nō te haereraʻa e ʻau. Nō reira, te hinaʻaro nei au e faʻaoti i tā tāua paraparauraʻa. Te manaʻo atoʻa nei au ē, te tīaʻi noa mai ra tā ʻoe vahine faʻaipoipo i te fare nō te tunu i te māʻa. E tāmāʻa maitaʻi ia ʻōrua i teie mahana.","fr":"– Où étais-tu aujourd'hui ?\n– Je suis allé au marché acheter du poisson. Je suis arrivé au marché, et il n'y avait pas de poisson. J'ai pris seulement des bananes rouges, des patates douces, des ignames. Et toi, où étais-tu aujourd'hui ?\n– Je suis allé me baigner à la mer parce que je n'ai pas de travail aujourd'hui. J'ai pensé aller me baigner un peu à la mer. Quand partez-vous à Ra'iātea ?\n– Je pense peut-être la semaine prochaine. C'est alors que nous partirons pour Ra'iātea. La durée sera peut-être de deux ou trois mois. Et vous deux ? Où allez-vous ces jours-ci ?\n– Nous pensons aller aux îles Marquises parce que nous y avons des amis qui nous ont écrit (pour nous demander) si nous voulions aller séjourner aux Marquises quelques jours. Il est très possible que nous partions pour les Marquises.\n– Maintenant je pense que l'heure est venue d'aller faire de la natation. Je désire donc terminer ici notre conversation. Je pense aussi que ton épouse attend à la maison pour faire à manger. Déjeunez bien aujourd'hui.","l":"L19"},"L20-T108":{"p":"108","t":"Dans les magasins","tah":"Teie te tahi mau parau faʻaʻiteraʻa nō te haere i roto i te fare toa, nō te hoʻo haere i te mau tauihaʻa tā tātou e hinaʻaro.\nI teie taime, te tomo nei ia vau i roto i te fare toa, ʻe te ani nei vau i te tamāhine hoʻohoʻo :\n– Te hinaʻaro nei au i te hōʻē piripou maitaʻi nō ʻu.\nTe ani nei au iā na :\n– ʻĒ, hōroʻa mai tērā piripou nīnamu.\nTe hōroʻa mai nei ʻona i teie taime.\n– ʻEhia moni tērā mau piripou ?\n– E iva hānere tārā. Tēhia tā ʻoe e hinaʻaro ?\n– E hinaʻaro vau i tērā mea nīnamu. ʻEhia moni ?\n– E ono hānere tārā.\n– A hōroʻa mai tērā mea nīnamu.\nUa hōroʻa mai ʻona, ʻe ua rave vau.\n– E hōroʻa atoʻa mai ʻoe i tērā ʻahu hāviti i ʻō i tērā vāhi tā ʻu e ʻite nei. A hōroʻa mai na !\n– Hērū ! E haere au e tiʻi… Tērā tā ʻoe ʻahu. E hinaʻaro ʻoe ?\n– ʻĒ, e hinaʻaro iho ā vau i tērā ʻahu. Faʻaʻite mai ʻoe ia ʻu ʻehia moni.\n– Teie te moni ʻo tērā ʻahu : e toru hānere tārā.\n– ʻEʻere i te mea moni roa. E rave au. A pūʻohu mai ʻoe i te piripou ʻe te ʻahu i roto i te tahi faʻariʻi. ʻĒ, tērā mai te moni nō te ʻahu ʻe te piripou… Te haere nei au. E māurūru roa ia ʻoe i te hōroʻaraʻa mai i te mau parau haʻamāramarama nō niʻa i te mau moni hoʻo nō te ʻahu ʻe te mau piripou nō te fare toa nei.","fr":"Voici quelques mots d'explication pour aller dans les magasins, faire l'achat de quelques objets que nous désirons.\nJ'entre donc dans le magasin et je demande à la vendeuse :\n– Je voudrais un bon pantalon pour moi.\nJe lui demande :\n– S'il te plaît, donne-moi ce pantalon bleu.\nElle me le donne alors.\n– Combien coûtent ces pantalons-là ?\n– C'est neuf cents tara (900 x 5 CFP = 4 500 CFP). Lequel veux-tu ?\n– Je désire ce bleu. Combien ?\n– Six cents tara (3 000 CFP).\n– Donne-moi ce bleu.\nElle me le donne et je le prends.\n– Donne-moi aussi cette belle chemise à l'endroit que je vois là-bas. Donne-la moi, s'il te plaît.\n– Attends, je vais la chercher… Voilà ta chemise. Tu la veux ?\n– Oui, c'est bien celle que je veux. Dis-moi combien elle coûte.\n– Voici le prix de cette chemise : trois cents tara (1 500 CFP).\n– Ce n'est pas cher. Je vais la prendre. Enveloppe le pantalon et la chemise dans un paquet. Ah oui, voilà l'argent pour la chemise et le pantalon… Je m'en vais. Je te remercie beaucoup d'avoir fourni toutes ces explications sur les prix de la chemise et des pantalons du magasin.","l":"L20"},"L21-T119":{"p":"119","t":"Le coprah","tah":"Te parau nō te pūhā. Nō te hāmani i te pūhā e haʻaputu hia te mau haʻari marō atoʻa. Ia oti, e tāpūpū hia te mau ʻōpaʻa, ʻoia hoʻi te mau haʻari marō atoʻa : e tāpū hia i te toʻi. I muri iho, e pīharahara hia te mau ʻōpaʻa tei tāpūpū hia, ʻe, e pana pau roa hia te mau haʻari nō te tātara mai i te māʻa. Ia oti te reira, e tauraʻi hia te mau māʻa o te haʻari, ʻoia hoʻi te pūhā, i niʻa i te mahana i te maororaʻa e piti ʻaore ra e toru hepetoma te maororaʻa, mai te peu ē e mea maitaʻi te mahana. Ia marō maitaʻi te pūhā, e ʻoʻomo hia i roto i te mau pūtē nō te hōpoi atu e hoʻo.","fr":"Quelques mots sur le coprah. Pour faire le coprah, on rassemble toutes les noix sèches. Cela fait, on fend les 'ōpa'a, c'est-à-dire tous les cocos secs. On les coupe à la hache. Ensuite, on ouvre grand les cocos qu'on a fendus et on décortique le tour de tous les cocos pour en retirer l'amande. Quand c'est fini, on sèche au soleil l'amande des noix, c'est-à-dire le coprah, pendant une période de deux ou trois semaines, si le temps est beau. Quand le coprah est bien sec, il est mis en sac pour être expédié et vendu.","l":"L21"},"L22-T127":{"p":"127","t":"Le marché","tah":"Te mātete nō Tahiti, e ʻī noa ʻoia i te māʻa. Ua rau te huru i te mau mahana atoʻa. Mai teie te huru te mau faʻanahoraʻa : e matara noa te mātete nō Papeʻete mai te monirē e tae atu i te mahana māʻa, mai te hora maha i te poʻipoʻi e tae atu i te hora hitu i te pō. I te tāpati, e matara ʻoia mai te hora maha i te poʻipoʻi e tae atu i te hora ʻahuru.\nE raverahi te mau māʻa e tae mai nō te mau mataʻeinaʻa nō Tahiti. E tae atoʻa mai tō te mau motu, nō Moʻorea, Huahine, Raʻiātea, Porapora. Te mahana rahi aʻe te māʻa, i te mātete, mai te mahana maha ia e tae atu i te tāpati. Mai te monirē e tae atu i te mahana toru, ʻaita e rahi te māʻa e tae mai i te mātete nō Papeʻete.\nE raverahi mau māʻa e hoʻo hia ʻe te tahi mau tauihaʻa nō te fenua. E raverahi te huru ʻo te mau iʻa. E hoʻo atoʻa hia te mau hei pūpū, te mau tiʻi, te mau tāupoʻo, te mau ʻete.\nE raverahi mau rātere e haere i te mātete nō Papeʻete nō te mātaʻitaʻi i te mau rahiraʻa māʻa ʻe te iʻa. Nō reira, ua riro ia te mātete nō Papeʻete ʻei ʻoaʻoaraʻa, ei māurūruraʻa nā te mau rātere.","fr":"Le marché de Tahiti est toujours plein de choses à manger. Il y a grande variété tous les jours. En voici les agencements : le marché de Pape'ete reste ouvert du lundi au samedi, de quatre heures du matin à sept heures du soir. Le dimanche, il est ouvert de quatre heures du matin à dix heures.\nLes produits qui arrivent des districts de Tahiti sont divers. Il en arrive aussi des îles de Mo'orea, Huahine, Ra'iātea, Porapora. Les jours où il y en a le plus au marché vont du jeudi au dimanche. Du lundi au mercredi il n'y a pas beaucoup de provisions qui arrivent au marché de Pape'ete.\nIl y a une grande quantité de nourriture et d'autres produits du pays à vendre. Il y a de nombreuses espèces de poisson ; on vend aussi des colliers de coquillages, des statuettes, des chapeaux, des paniers.\nIl y a beaucoup de touristes qui viennent à Pape'ete contempler la quantité de provisions et de poisson. Ainsi, le marché de Pape'ete est devenu la joie et le plaisir des touristes.","l":"L22"},"L23-T132":{"p":"132","t":"La pêche","tah":"I teie mahana, e piti ʻahuru nō fepuare matahiti tauatini e iva hānere e iva ʻahuru mā pae, te hinaʻaro nei ʻo Teriʻi tāne ia faʻaʻite au ia na i te huru nō te ʻohipa ravaʻai i Tahiti.\nE faʻaʻite atu vau ia na i te huru nō te ravaʻai ʻupeʻa nā te pae aʻau : e raverahi mau vaʻa e haere nā te pae aʻau. E tuʻu rātou i te ʻupeʻa nā te pae aʻau mai te tīahi mai i te iʻa i roto i te ʻupeʻa. I reira, e faʻaʻati hia te ʻupeʻa. I muri iho, e pou rātou i roto i te miti nō te rave mai i te ʻia, a tuʻu atu ai i roto i te mau vaʻa.\nI muri iho i te reira, e taui rātou i te vāhi tāiʻaraʻa. E haere rātou i te pae moana e tuʻu faʻahou i tā rātou ʻupeʻa. Te mau vaʻa faʻaʻati, nā rātou e haere e tīahi mai i te iʻa i roto i te ʻupeʻa. I muri iho e pou rātou i roto i te miti nō te pātia mai i te iʻa, ʻa tuʻu atu ai i roto i te mau vaʻa.","fr":"Aujourd'hui, 20 février 1995, Teri'i veut que je lui explique la façon de pêcher à Tahiti.\nJe vais lui expliquer la façon de pêcher au filet au bord du récif : il y a beaucoup de pirogues qui vont vers la barrière de corail. Ils (les pêcheurs) posent le filet (au bord du récif) en chassant le poisson dedans. Puis le cercle du filet est refermé. Alors ils descendent dans l'eau pour saisir le poisson et le mettre dans les pirogues.\nAprès cela, les gens changent de lieu de pêche. Ils vont au bord du bleu et à nouveau posent leur filet. Ce sont les pirogues qui ferment le cercle qui vont rabattre le poisson dans le filet. Puis les gens descendent dans l'eau pour harponner le poisson tout en le mettant dans les pirogues.","l":"L23"},"L24-T134":{"p":"134","t":"La « plonge » aux nacres","tah":"Te ʻohipa nō te hopuraʻa pārau e tupu ia i te mau motu Tuamotu i te mau matahiti atoʻa. E tupu te hopuraʻa pārau, e toru ʻāvaʻe te maororaʻa ʻaore ra e maha. Ua ʻite tātou i te motu Tuamotu, e mea faʻaʻati hia ʻoia e te aʻau ; i rōpū i te motu, te vai ra ia te miti. ʻĒ, i te reira vāhi e hopu hia ai te pārau.\nNō te haere e hopu i te pārau, e haere te mau taʻata nā niʻa i tō rātou mau vaʻa i rōpū i te miti. Ia tae rātou i reira, e faʻaoti rātou i te pureraʻa nā mua aʻe a hopu ai. E piti taʻata i niʻa i te vaʻa hōʻē, hōʻē tē hopu, ʻe hōʻē te faʻaea i niʻa iho i te vaʻa nō te huti mai i te pārau o tē faʻaʻī hia mai e te taʻata hopu. Teie taʻata hopu, e hopu ʻoia nā niʻa i te hōʻē taura o tei tāʻamu hia te tāpau i nia iho, nō te mea, nā teie tāpau i niʻa i te taura e faʻatae ʻoiʻoi ia na i raro i te miti. Ia tae ʻoia i raro, e rave ʻoia i tā na ʻete e faʻaʻī i te pārau. Ia ʻī, nō te faʻaʻite i te taʻata huti i niʻa i te vaʻa, e huti ʻoia e toru hutiraʻa i niʻa i te taura. I te reira taime, e hoʻi mai ʻoia i niʻa ; e huti atoʻa hia te ʻete pārau.\nIa faʻaoti teie hopuraʻa pārau, e hāpono hia te mau pārau nā te mau fēiā rave pārau i Papeʻete. ʻĒ i te reira taime ia, tā rātou moni e roaʻa mai ai.","fr":"Le travail de la plonge aux nacres se fait aux Tuamotu tous les ans. La plonge a lieu pendant trois ou quatre mois. Nous savons que les îles Tuamotu sont entourées de récifs ; au milieu de la terre se trouve la mer. Et c'est à cet endroit qu'on plonge pour la nacre.\nPour aller plonger pour la nacre, les hommes se rendent sur leurs pirogues au milieu de l'eau. Quand ils y arrivent, ils font une prière avant de plonger. Il y a deux hommes sur chaque pirogue, un qui plonge et un qui reste dans la pirogue pour hisser les nacres dont le plongeur a fait le plein. Celui-ci descend sur une corde à laquelle est attaché le plomb car c'est ce plomb fixé à la corde qui le fait arriver vite au fond de la mer. Quand il arrive au fond, il prend son panier et l'emplit de nacres. Quand c'est plein, pour avertir l'homme qui tire sur la pirogue, il tire trois coups sur la corde. À ce moment-là, il remonte ; le panier aux nacres est remonté aussi.\nQuand cette plonge aux nacres est finie, on envoie les nacres aux marchands de nacre à Pape'ete. Et c'est à ce moment-là que les hommes reçoivent leur argent.","l":"L24"},"L25-T136":{"p":"136","t":"Tahiti","tah":"Teie te tahi mau parau nō te mau motu nō Porinetia Farāni : ʻoia hoʻi ʻo Tahiti te fenua pū, tei reira te ʻoire nō Papeʻete. I muri aʻe i te reira, te vai nei te mau Motu nō niʻa Mataʻi, te mau motu Tuamotu, Maʻareva, Tupuʻai, Rurutu, Rapa, Matuita mā, te mau Motu nō Raro Mataʻi, Raʻiātea, Porapora, Huahine, Maupiti.\nI teie nei, e paraparau vau i te huru nō tē fenua ʻo Papeʻete, i Tahiti.\nI Papeʻete atoʻa te vai nei te tahi mau fare ʻāpī tē hāmani hia ra, te mau purūmu tē tātāʻi hia ra. No reira, e nehenehe ia parau hia i teie mau tau i mua nei, e riro ia te ʻoire nō Papeʻete ʻei mātaʻitaʻiraʻa nā te mau fēiā rātere, nō te mea e raverahi te mau fēiā rātere e tae mai i Papeʻete, mai te fenua Marite mai, nō te fenua Farāni mai, Peretāne mai, te fenua Europa mai, nō te mātaʻitaʻi i te huru o te ruperupe o te fenua Tahiti.\nTeie te mau ʻohipa tē ʻite hia e te mau fēiā rātere ia tae atu rātou i Tahiti. Nā mua aʻe e tae rātou ʻi te mataʻeinaʻa nō Pāʻea, e ʻite rātou i te marae nō ʻArahurahu. ʻEi reira e tae atu rātou i ʻAtimaono, te vāhi mātāmua i tanu hia te tō nō te hāmani i te tihota. E haere atu rātou i Mataiea ʻē Papeari. Tei reira te vāhi pū nō te taʻata pāpaʻi hohoʻa ʻo Paul Gauguin tāne. Mai reira, e haere atu rātou i ʻAfaʻahiti. Tei reira te mau faʻaʻamuraʻa puaʻatoro rahi aʻe nō Tahiti. E mau puaʻatoro nō te fenua Niuterani mai, tei faʻatae hia mai i Tahiti nō te faʻaravaʻi i te ū nō Tahiti. Mai reira, e tae atu rātou i Taravao ; tei reira te mau hōtēra. E raverahi mau rātere e haere i reira e tāmāʻa ai.\nE hoʻi mai rātou i Papeʻete nā te mataʻeinaʻa nō Hitiaʻa, Tiʻarei, Papenoʻo, ʻArue. Hou rātou a tae ai i Papeʻete, e haere rātou i te ʻōtuʻe nō Haʻapape, ʻoia hoʻi te « Pointe Vénus ». E mātaʻitaʻi rātou i te mōrī tūrama ava. Tei reira atoʻa te tiʻi o te taʻata peretāne ra ʻo Tāpena Tute, ʻoia hoʻi ʻo Captain Cook, tei tae mai i Tahiti i te matahiti tauatini e hitu hānere e ono ʻahuru mā iva i te ʻoʻoʻa nō Matavai.","fr":"Voici quelques mots sur les îles de Polynésie française. En effet, Tahiti est l'île principale, c'est là que se trouve la ville de Pape'ete. Après quoi, il y a les Îles du Vent, les Îles sous le Vent (Ra'iātea, Porapora, Huahine et Maupiti), l'archipel des Tuamotu-Gambier, les Australes (Tupu'ai, Rurutu, Rapa…), et les Marquises. Maintenant, je parlerai d'abord de Pape'ete, à Tahiti.\nDans tout Pape'ete, il y a des nouvelles maisons que l'on construit, des routes que l'on répare. C'est pourquoi on peut dire que dans les temps à venir la ville de Pape'ete deviendra l'attraction des touristes, car nombreux sont les touristes qui viennent à Pape'ete d'Amérique, de France, de Grande-Bretagne, d'Europe, pour admirer combien Tahiti est belle.\nVoici ce qui sera vu par les touristes quand ils arriveront à Tahiti. Avant d'arriver au district de Pā'ea, ils verront le marae de 'Arahurahu. De là ils arriveront à 'Atimaono, le premier endroit où fut plantée la canne à sucre pour la fabrication du sucre. Puis ils continueront vers Mataiea et Papeari. Ce sont là les lieux que fréquenta le plus le peintre Paul Gauguin. De là, ils iront à 'Āfa'ahiti. Il y a là les plus gros élevages de bovins de Tahiti. Ce sont les bovins de Nouvelle-Zélande importés pour compléter la production laitière de Tahiti. Ils arriveront ensuite à Taravao ; c'est là qu'il y a des hôtels. Beaucoup de touristes vont y manger.\nIls retourneront vers Pape'ete par les districts de Hitia'a, Ti'arei, Papeno'o, Ha'apape. Avant d'arriver à Pape'ete, ils iront à la péninsule de Ha'apape, c'est-à-dire la pointe Vénus. Ils y admireront le phare. C'est là aussi que se trouve l'effigie de ce Britannique Tāpena Tute, c'est-à-dire le capitaine Cook, qui est arrivé à Tahiti en 1769 dans la baie de Matavai.","l":"L25"},"L25-T137":{"p":"137","t":"Que faire à Tahiti ?","tah":"– E aha te huru i Tahiti nei i teie mau mahana ?\n– Mea maitaʻi. Ua faʻafaʻaea riʻi te ua. Mea maitaʻi roa i teie mau mahana.\n– E aha te ʻohipa tā ʻu e nehenehe e rave ananahi ?\n– Mai te peu ē ʻeʻita e ua, e nehenehe ia tā ʻoe e haere e faʻaʻati nā te mau mataʻeinaʻa. ʻEi reira, ʻoe e ʻite ai i te ruperupe o te fenua. E nehenehe atoʻa ʻoe e haere atu i Moʻorea, nō te mea e raverahi mau rātere e haere nei i te reira vāhi. E nehenehe atoʻa ʻoe e haere roa atu i te mau Motu Raro Mataʻi, ʻoia hoʻi ʻo Huahine, Raʻiātea, Porapora, tei ia ʻoe te hinaʻaroraʻa.\n– E mea maitaʻi roa. Ananahi e tiʻi mai ʻoe ia ʻu ; e haere tāua mātaʻitaʻi i te mau mataʻeinaʻa. Ia manaʻo vau, ʻeʻita iho ā e ua ananahi. Nā reira ia, e haere mai ʻoe e tiʻi ia ʻu ananahi ia poʻipoʻi i te hora hitu e te ʻāfa.\n– ʻĒ, e haere mai au e tiʻi ia ʻoe ananahi. E haere tāua e faʻaʻati i Tahiti.\n– E aha anaʻe ā te ʻohipa e rave hia i Tahiti nei ?\n– I te pō, e nehenehe ʻoe e haere e mātaʻitaʻi te mau vāhi ʻoriraʻa, te mau vāhi hīmeneraʻa, mai te Zizou Bar, te Hōtēra Tahiti ʻē te vai atu ra. E nehenehe tā ʻoe e haere e mātaʻitaʻi atoʻa i te mau ʻori nō te fenua nei : te ʻori Tahiti, te tāmūrē, te pāʻōʻā, te hivinau, te ʻaparima, ʻē raverahi atu ā.\n– Māurūru roa i tā ʻoe faʻaʻiteraʻa mai ia ʻu i te huru nō teie vāhi ʻo Tahiti. Te manaʻo nei au e riro paha teie faʻafaʻaearaʻa tō ʻu i Tahiti i te mea ʻoaʻoa mau nā ʻu.","fr":"– Comment ça va à Tahiti en ce moment ?\n– Ça va bien. La pluie s'est un peu arrêtée. Ça va très bien ces jours-ci.\n– Que puis-je faire demain ?\n– S'il ne pleut pas, tu peux aller faire le tour par les districts. C'est là que tu verras la beauté du pays. Tu peux aussi aller à Mo'orea car il y a beaucoup de touristes qui y vont. Tu peux aussi aller jusqu'aux Îles sous le Vent, à savoir Huahine, Ra'iātea, Porapora, selon ton désir.\n– C'est très bien. Demain tu viendras me chercher ; nous irons voir les districts. À mon avis, il ne pleuvra sûrement pas demain. Alors viens me chercher demain matin à sept heures et demie.\n– Oui, je viendrai te chercher demain. Nous irons tous les deux faire le tour de Tahiti.\n– Qu'est-ce qu'il y a encore à faire à Tahiti ?\n– Le soir, tu peux aller visiter les dancings et les bars avec orchestre comme le Zizou Bar, l'Hôtel Tahiti et le reste. Tu peux aller assister aussi aux danses folkloriques : la danse tahitienne, le tāmūrē, le pā'ō'ā, le hivinau, le 'aparima et bien d'autres.\n– Merci beaucoup des renseignements que tu m'as donnés sur Tahiti. Je pense que ce séjour à Tahiti me sera probablement très agréable.","l":"L25"},"L25-T138":{"p":"138","t":"Pour planter les patates douces","tah":"Nō te tanu i te ʻumara, e tāpū hia mai ia te ʻata ʻo te mau ʻumara tei maoro i te tupuraʻa. E hāmani hia te mau ʻāpoʻo nō te tanuraʻa i te ʻata ʻumara. E tuʻu hia tērā mau ʻata i roto i te mau ʻāpoʻo tei ʻō hia ʻē ua haʻaputu hia te repo. Ia oti i te tuʻu hia te ʻata ʻumara i roto i te ʻāpoʻo, e haʻapoʻi hia ʻoia. E nehenehe ia pīpī hia i te pape te mau ʻata ʻumara tanu ʻāpī, mai te peu ē ʻaita e ua, mai te peu ē e mea pūai roa te mahana.\nTe taime tanuraʻa ʻumara, tei roto ia i te ārea nō te āvaʻe mē, tiunu, tiurai. I te taime e paʻari ai ʻoia, e pae ʻaore ra e hitu ʻāvaʻe i muri iho e nehenehe ia tātara hia mai, mai roto mai i te repo. O te taime ia e nehehe ia ʻamuhia te reira ʻumara.","fr":"Pour planter les patates douces, on coupe les tiges des patates qui poussent depuis longtemps. On fait des trous pour planter les tiges des patates douces. On place ces tiges dans les trous qui ont été creusés et la terre est mise en tas. Quand on a fini de placer la tige de patate douce dans le trou, on le recouvre. Il est bon d'arroser les tiges de patates douces nouvellement plantées, s'il ne pleut pas ou si le soleil est très fort.\nLa saison pour planter la patate douce se situe aux environs des mois de mai, juin, juillet. Au moment où elle parvient à maturité, c'est-à-dire cinq à sept mois plus tard, on peut alors la retirer de terre. C'est alors que cette patate douce peut être consommée.","l":"L25"},"L25-T139":{"p":"139","t":"Le trou de la Murène","tah":"I teie mahana, e paraparau vau i te ʻaʻamu nō te ʻāpoʻo puhi. Te vai ra i te mau Motu raro Mataʻi, ʻoia hoʻi i Tahaʻa, i te mataʻeinaʻa nō Poutoru, te hōʻē puhi rahi roa ; e ʻamu noa ʻoia i te mau taʻata. Pau roa te mau taʻata e hoe mai nā niʻa iho i te vaʻa, ia tae i tērā vāhi, ʻoia hoʻi te ʻĀpoʻo Puhi, ʻei reira rātou e ʻamu hia ai e tērā puhi. Te vai ra ʻoia i te hōʻē ʻōtuʻe tei topa hia te iʻoa Te ʻĀpoʻo Puhi, ʻoia hoʻi Te ʻŌtuʻe ʻo ʻĀpoʻo Puhi. ʻE nā reira te taʻata tei haere mai i te mataʻeinaʻa nā niʻa i te vaʻa, te rahiraʻa, e ʻamu hia ia e taua puhi ra.\nTe vai atoʻa ra i te reira tau e raverahi mau fēiā tāiʻa. Te ʻaito i te reira tau nō te reira mataʻeinaʻa ʻo Taʻariʻi ia. E taʻata pātia ia tō na tōroʻa. Te ʻite nei te hui raʻatira nō teie mataʻeinaʻa e ʻamu noa teie puhi i te mau taʻata e hoe nā niʻa i te vaʻa. Ua manaʻo rātou i te hōʻē mahana, e haere e pātia haʻapohe roa i te puhi, ia ʻore ʻoia e ʻamu faʻahou i te mau taʻata e hoe mai nā niʻa i te vaʻa nō te haere i te mataʻeinaʻa.\nI te tahi mahana, ua haere mai ʻo Taʻariʻi ʻe tā na ʻāuri. Ua ʻite ʻoia i teie puhi i rāpae i tō na ʻāpoʻo. Ua manaʻo ʻona e pātia haʻapohe roa i teie puhi, ia ora te mau taʻata e hoe nā niʻa i te vaʻa, ʻeiaha rātou ia ʻamu faʻahou hia e tērā puhi. I te reira taime, ua pātia haʻapohe roa ʻoia i tērā puhi. Mai te reira taime te toparaʻa hia te iʻoa o taua ʻōtuʻe ra, Te ʻŌtuʻe ʻo ʻĀpoʻo Puhi.","fr":"Aujourd'hui, je vais conter la légende du trou de la Murène. Il y avait aux Îles sous le Vent, précisément à Taha'a, au district de Poutoru, une murène géante ; elle ne cessait de dévorer les gens. Tous les gens qui arrivaient en pagayant sur leur pirogue à cet endroit, appelé le trou de la Murène, se trouvaient dévorés par cette murène. Elle se trouvait à une pointe qu'on avait nommé le trou de la Murène, autrement dit la pointe du trou de la Murène. C'est ainsi que les gens qui venaient en pirogue du district, pour la plupart, étaient dévorés par cette murène.\nIl y avait aussi en ce temps-là un grand nombre de pêcheurs. Le champion de ce district était alors Ta'ari'i. Il était harponneur de son métier. La population de ce district voyait que la murène ne cessait de dévorer les rameurs. Ils se dirent un jour, qu'il fallait aller transpercer et tuer la murène, afin qu'elle ne dévore plus les rameurs qui se rendaient au district.\nUn jour arriva Ta'ari'i et son harpon de fer. Il vit la murène en dehors de son trou. Il pensa qu'il devait transpercer d'un coup mortel cette murène, afin que puissent vivre tous les rameurs et qu'ils ne soient plus dévorés par cette murène. À ce moment-là, il transperça cette murène-là et la tua. C'est depuis ce temps-là qu'on donne à cette pointe le nom de pointe du trou de la Murène.","l":"L25"},"L26-T140":{"p":"140","t":"Le 14 Juillet","tah":"Te parau nō te Tiurai.\nTe ʻahuru mā maha nō tiurai, ua riro ia ʻei mahana ʻoaʻoaraʻa nā te hau farāni. Nō reira, i te fenua Tahiti, e faʻatupu atoʻa hia te mahana ʻōroʻa nō te ʻahuru mā maha nō tiurai. Nō te faʻahanahanaraʻa i te ʻahuru mā maha nō tiurai i Tahiti, e hāmani hia te mau fare ʻārearearaʻa, te mau fare tāviriraʻa nā te mau vāhi atoʻa o te ʻoire, mai te faʻanehenehe hia i te mau tiare atoʻa o te fenua.\nIa tae i te ʻahuru mā toru nō tiurai, te mahana ia e haʻamata ai te mau ʻōroʻa, te hora e matara ai te mau fare Tiurai, mai te hora ʻahuru mā piti ia nō te ʻahuru ma toru nō tiurai e tae atu i te hora piti i te ʻaʻahiata. Ia poʻipoʻi aʻe, ʻoia hoʻi te ʻahuru mā maha, te mahana rahi nō te taʻurua, i te hora vaʻu i te poʻipoʻi, e tupu ia te porotēraʻa a te mau nuʻu huru rau e raverahi atu ā. I te poʻipoʻi ʻahuru mā maha nō tiurai, i te hora vaʻu, e putuputu pau roa te mau taʻata i te vāhi porotēraʻa, ʻoia hoʻi i te aroā Bruat. Ia haere mai te tōmitera teitei o te fenua i tō na vāhi faʻaearaʻa nō te haʻapoupou i te mau fēiā porotē, e tere mai ia i te reira taime te mau mōtō nō te mūtoʻi farāni. I muri aʻe i te reira, te mau pupu faʻehau huru rau : tō te fenua, tō te tai ʻē tō te reva. I muri aʻe i te reira, e porotē mai te mau pupu hīmene, te mau pupu ʻōteʻa, te mau pupu faʻaʻetaʻetaraʻa tino, te pupu tuʻe pōpō, tāora pōpō e raverahi atu ā. E porotē atoʻa mai te mau pupu nō te mau faʻaroʻo atoʻa,\nʻoia hoʻi te porotetani, te tatorita, te mōmoni, te tānītō, te pētānia. E porotē atoʻa hoʻi te mau tamariʻi nō te mau fare haʻapiʻiraʻa atoʻa.\nIa oti te porotēraʻa, e faʻariʻi mai te tōmitera teitei i te mau hui mana atoʻa nō te hōʻē inuinuraʻa. I te reira taime, e matara ia te mau fare ʻārearearaʻa, te mau fare tāviriraʻa nō te tiurai e tae roa atu i te hora ono i te poʻipoʻi. I te reira atoʻa pō, e tupu ia te ʻoriraʻa hanahana mai tē peretiteni hia e te tōmitera teitei ʻo te fenua.\nTe taʻurua nō Tiurai e tupu ia, e piti hepetoma te maororaʻa. E raverahi mau ʻohipa e rave hia i roto i te reira nau hepetoma e piti, te mau ʻōteʻa, te mau hīmene, te mau hoeraʻa vaʻa, te mau taʻahiraʻa pereoʻo, te faʻahororaʻa puaʻahorofenua. E rave hia ia i roto i te reira nau hepetoma e piti. I muri aʻe i te reira, te mahana hōpeʻa nō te piti : o te hepetoma, o te ʻōpaniraʻa ia o te taʻurua rahi nō Tiurai, ʻoia hoʻi te ʻōroʻa rahi a te Hau Farāni.","fr":"Description du Juillet. Le 14 Juillet est devenu pour le gouvernement français jour de fête nationale française. C'est pourquoi à Tahiti on organise aussi le jour de fête du 14 Juillet. Pour célébrer le 14 Juillet à Tahiti, on construit des baraques d'attractions, des baraques de loteries sur toutes les places de la ville, et on les décore de toutes les fleurs du pays.\nQuand arrive le 13 Juillet, jour où commencent les fêtes, les horaires d'ouverture des baraques du Juillet sont du 13 juillet à midi jusqu'à deux heures du matin. Au matin, c'est-à-dire le 14, grand jour de fête, à huit heures (du matin), a lieu le défilé des armées et de nombreux autres groupes. Le matin du 14 Juillet, à huit heures, tout le monde se rassemble sur les lieux du défilé, c'est-à-dire sur l'avenue Bruat. Quand le haut-commissaire arrive à sa tribune (litt. : le lieu où l'on reste pour applaudir les participants au défilé) viennent alors les motos de la gendarmerie nationale. Derrière, les différents détachements de soldats des armées : de terre, de mer et de l'air. Derrière ceux-là, arrive le défilé des groupes de chant, de danse, des associations athlétiques, des équipes de football, de basket-ball et bien d'autres encore. Défilent également les groupements de toutes les religions, c'est-à-dire les protestants, les catholiques, les mormons, les sanitos, les adventistes. Défilent aussi, bien sûr, les enfants de toutes les écoles.\nLe défilé fini, le haut-commissaire reçoit toutes les personnalités pour un vin d'honneur. À ce moment-là, les baraques d'attractions, de loteries du Juillet ouvrent jusqu'à six heures du matin. Cette même nuit a lieu le grand bal sous la présidence du haut-commissaire du Territoire.\nLa fête du Juillet dure deux semaines. On a de nombreuses activités au cours de ces deux semaines : les danses, les chants, les courses de pirogues, les courses cyclistes, les courses de chevaux. C'est ce que l'on fait au cours de ces deux semaines. À la suite de quoi, le dernier jour de la deuxième semaine, c'est la clôture de la grande fête du Juillet c'est-à-dire la grande célébration de la République française.\n(Remarque du livre : depuis 1985, le programme officiel des fêtes a été avancé en juin et ne s'appelle donc plus Tiurai mais Heiva, qui signifie « divertissement ».)","l":"L26"},"L26-T141":{"p":"141","t":"La récolte des oranges","tah":"Te pāfaʻiraʻa ʻānani i te faʻa nō Punāruʻu i Tahiti.\nIa tae i te tau nō te pāfaʻiraʻa ʻānani nō te faʻa nō Punāruʻu i te mataʻeinaʻa nō Punaʻauia, e haere te mau taʻata atoʻa tei mātau i te haere e tiʻi i te ʻānani i roto i te reira faʻa. E haere rātou i te poʻipoʻi roa, ʻē tā rātou mau pūtē, ʻē tō rātou mau ʻahu, ʻē te ʻahu taʻoto nō te pō, nō te mea ia haere e pāfaʻi i te ʻānani i te reira faʻa, e taʻoto ia te mau taʻata i uta. Ia poʻipoʻi, ʻei reira rātou e pāfaʻi ai i te ʻānani. Te tau nō te pāfaʻiraʻa ʻānani nō Punāruʻu, tei roto ia i te ārea nō te ʻāvaʻe mē, tiunu, tiurai, ʻātete.\nE haere rātou i te poʻipoʻi roa nā raro noa. I te ahiahi, ua tae ia rātou i te vāhi faʻafaʻaearaʻa. I te reira taime, e tāmāʻa riʻi rātou, ʻē e taʻoto, ʻē, ia poʻipoʻi aʻe, e haere faʻahou rātou i te tahi vāhi huru ātea atu, ʻē tei reira te uru ʻānani nō te faʻa nō Punāruʻu.\nIa tae i te pararaʻa nō te ʻānani, e mea rahi roa te ʻānani i niʻa i te tumu. E reʻareʻa noa i niʻa i te mau tumu. Ia tae te mau taʻata i te reira vāhi, e paʻuma rātou nō te pāfaʻi i te ʻānani ʻē nō te faʻaʻī i tā rātou mau pūtē. E raverahi mau taʻata e haere, nō te mea e mea ʻoaʻoa nā rātou i te haere i roto i te faʻa nō Punāruʻu nō tō na ruperupe ʻē te hāviti mau ia hiʻo hia.\nIa oti tā rātou pāfaʻiraʻa ʻānani, e pou mai rātou i raro, mai te amo mai i te ʻānani tā rātou i pāfaʻi mai. E mea huru ātea ia haere. E raverahi mau taime e faʻafaʻaea rātou. I muri iho, e haere faʻahou, a tae roa atu ai i te vāhi pāpū, ʻoia hoʻi ʻi te mataʻeinaʻa nō Punaʻauia.","fr":"La récolte des oranges dans la vallée de la Punāru'u à Tahiti.\nQuand vient la saison de la cueillette des oranges de la vallée de la Punāru'u dans le district de Puna'auia, tous les hommes qui ont l'habitude d'aller récolter les oranges dans cette vallée y vont. Ils partent de grand matin avec leurs sacs, leurs vêtements et leur matériel de couchage pour la nuit, car quand ils partent cueillir les oranges dans cette vallée, les hommes couchent en amont. C'est le matin venu qu'ils cueillent les oranges. La saison de la récolte des oranges de la Punāru'u se situe aux alentours des mois de mai, juin, juillet et août.\nIls partent donc de grand matin à pied. Dans l'après-midi, ils arrivent à l'endroit où l'on se repose. Alors ils mangent un peu et dorment et, le lendemain matin, ils repartent vers un autre endroit plus loin et c'est là que se trouve l'orangeraie de la vallée de la Punāru'u.\nQuand les oranges parviennent à maturité, il y en a vraiment beaucoup sur les arbres. Il n'y a que du jaune sur les arbres. Quand les hommes arrivent à cet endroit, ils grimpent pour cueillir les oranges et remplir leurs sacs. Les hommes sont nombreux à y aller parce que c'est un plaisir pour eux de pénétrer dans la vallée de la Punāru'u pour sa beauté et sa splendeur véritable pour les yeux.\nQuand ils ont fini de récolter les oranges, ils redescendent en portant sur les épaules les oranges qu'ils ont cueillies. C'est une longue marche. Ils s'arrêtent souvent. Puis ils repartent, jusqu'à ce qu'ils atteignent le terrain plat, c'est-à-dire au district de Puna'auia.","l":"L26"},"L26-T142":{"p":"142","t":"La fleur d'apetahi","tah":"Te vai ra ia e raverahi mau tiare ; ʻārea ra, i te fenua Raʻiātea, te vai ra ia te hōʻē tiare ʻeʻita e tupu i te mau vāhi atoʻa : ʻoia hoʻi te tiare ʻapetahi.\nTaua tiare ra, tei te fenua Raʻiātea anaʻe ia. Te vāhi tei reira tērā tiare, tei niʻa i te mouʻa ra ʻo Temehani.\nE raverahi mau taʻata e haere i te tahi mau taime e pāfaʻi mai i teie tiare, ʻoia hoʻi te tiare ʻapetahi, nō te mea ʻeʻere tō na ʻuaʻa mai tō te mau tiare atoʻa. Ia mahora tō na ʻuaʻa i te poʻipoʻi, e poʻoʻā ʻoia. Ia mahora mai, e mahora ʻoia mai te rima taʻata. E tiare nehenehe roa, mea ʻuoʻuo ʻo mua ʻē e mea matie ʻo raro aʻe mai.\nNō te haere e tiʻi i teie tiare, e haere ia te taʻata i te poʻipoʻi roa nō te tae atu i te vāhi pāfaʻiraʻa i te pō. Ei reira rātou e taʻoto ai. ʻĒ ia ʻaʻahiata, e haere rātou i pihaʻi iho i teie mau tiare nō te faʻaroʻo i te poʻoʻāraʻa mai, nō te mea ia mahora tō rātou ʻuaʻa e poʻoʻā rātou.\nE tiare māere rahi mau teie. Eʻere ʻoia mai te mau tiare atoʻa tei mātau hia e te taʻata.","fr":"Il existe vraiment de nombreuses fleurs ; cependant, dans l'île de Ra'iātea, il existe une fleur qui ne pousse pas partout : il s'agit en effet de la fleur d'apetahi.\nCette fleur-là, on ne la trouve qu'à Ra'iātea. L'endroit où l'on trouve cette fleur est sur la montagne Temehani.\nBien des gens vont de temps en temps cueillir cette fleur, la fleur d'apetahi, parce que son éclosion n'est pas comme celle de toutes les fleurs. Quand elle éclot le matin, elle produit un claquement. Quand elle s'ouvre, elle s'ouvre comme une main humaine. C'est une très belle fleur, blanche en dessus et verte en dessous.\nPour aller cueillir cette fleur, les gens partent de grand matin pour arriver à l'endroit de la cueillette le soir. Là, ils dorment. Et à l'aube, ils s'approchent des fleurs pour écouter le claquement, parce que, quand leurs pétales éclosent, elles produisent un claquement.\nC'est une fleur vraiment étonnante. Elle n'est pas comme toutes les fleurs dont les gens ont l'habitude.","l":"L26"},"L26-T143":{"p":"143","t":"Construction d'une maison","tah":"Te hāmaniraʻa i te hōʻē fare Tahiti, ʻoia hoʻi te fare nīʻau.\nNō te hāmani i te hōʻē fare māʻohi, e tāpū hia ia te nīʻau ; e tāpū atoʻa\nhia te tumu haʻari. E rave hia te mau tumu nō te hāmani i te pou nō te fare. E rave hia te mau nīʻau nō te tāpoʻi i te fare. E tāpū atoʻa hia te ʻofe, e haʻune hia nō te hāmani i te pāruru nō te fare, te ʻōpani ʻe te mau haʻamāramarama.\nNō te hāmaniraʻa i te mau pou, e rave hia te mau tumu haʻari. Nō te tāpoʻi i te fare, e haʻune hia ia te nīʻau. ʻĒ ia oti, e tāpoʻi hia ia te fare i te mau nīʻau haʻune hia. E tāpū atoʻa hia te mau rāʻau ʻāfaro, ʻoia hoʻi te mau rāʻau pūrau ʻē e raverahi atu ā, nō te hāmani i te ʻaho o te fare. Ia oti te mau pou i te faʻatiʻa hia, e tāmau hia ia te mau ʻaho. Ia oti te reira, e ato hia te fare. I muri iho, e hāmani hia te tahua o te fare. E tuʻu hia te mau pou potopoto nā roto ʻē e tāmau hia te tahua i te ʻofe ʻo tei haʻune hia. E tāmau hia te mau pāruru ʻofe, te mau haʻamāramarama ʻe te mau ʻōpani. Ua oti ia i teie nei te hōʻē fare māʻohi.","fr":"Construction d'une maison tahitienne, c'est-à-dire d'une maison recouverte de palmes de cocotiers.\nPour construire une maison polynésienne, on coupe des palmes de cocotiers ; on coupe aussi des troncs de cocotiers. On prend les troncs pour faire les poteaux de la maison. On prend les palmes de cocotiers pour recouvrir la maison. On coupe aussi du bambou et on le tresse pour faire les cloisons de la maison, la porte et les fenêtres.\nPour faire les poteaux, on prend les troncs de cocotiers. Pour recouvrir la maison, on tresse les feuilles de cocotiers. Et quand c'est fini, on recouvre la maison avec les feuilles tressées. On coupe aussi des bois bien droits, à savoir des branches de pūrau et bien d'autres encore, pour faire les chevrons de la maison. Quand on a fini de dresser les poteaux, on fixe les chevrons. Quand cela est terminé, on recouvre la maison.\nEnsuite, on fait le plancher de la maison. On met les pilotis à l'intérieur et on fixe solidement le plancher de bambou tressé. On fixe les cloisons de bambou, les fenêtres et les portes. Et voilà maintenant une maison polynésienne achevée.","l":"L26"},"L26-T144":{"p":"144","t":"La pêche aux cailloux","tah":"Te tautai tāora i te fenua Porapora.\nE tupu ia teie huru tāiʻaraʻa i te mau mahana e raverahi te mau rātere e haere i te fenua Porapora. I te reira taime, e faʻatupu hia te hōʻē faʻariʻiraʻa i te mau rātere nā te hui raʻatira nō Porapora, ʻoia hoʻi, te mau hīmene, te mau ʻori e te mau tāmāʻaraʻa Tahiti. Ia oti te reira, e haere te mau rātere e faʻaʻati i te fenua Porapora. Ia oti, e haere rātou e mātaʻitaʻi i te huru nō te ʻohipa o te tautai tāora i Porapora.\nTeie te faʻanahoraʻa nō teie huru tautai. E haere pau roa te hui raʻatira nō Porapora, te tāne, te vahine, ʻē te tamariʻi mai te tāmau mai i te hei i niʻa i te upoʻo, i te ʻarapoʻa, mai te tāmau atoʻa mai i te mau pāreu, ua rau te huru. I te reira taime, e haere rātou i roto i te miti nō te hāmani i te hōʻē ʻāua nīʻau. Ia oti te reira, e haere ia te tahi taʻata i niʻa i te vaʻa i te hōʻē vāhi ātea mā te tāora i te ʻōfaʻi i roto i te miti nō te tīahi i te iʻa i te ʻāua. I te reira taime, e horo pau roa te iʻa i roto i te ʻāua i te pae tahatai.\nI reira te mau rātere e haere mai ia e mātaʻitaʻi i te mau iʻa i roto i te ʻāua, mā te pata i te hohoʻa, mā te taviri i te hohoʻa nō teie huru tautai. E nehenehe tā te mau rātere pāʻātoa e haere i roto i te ʻāua iʻa, mā te rave mai i te iʻa tā rātou e hinaʻaro. Nō teie huru tautai i te fenua Porapora, e mea ʻanaʻanatae roa ia nā te mau rātere. ʻĒ nō reira, e raverahi te mau rātere e haere i te fenua Porapora nō te mātaʻitaʻi i teie huru tāiʻaraʻa.","fr":"La pêche aux cailloux à Porapora.\nCe genre de pêche a lieu les jours où il y a beaucoup de touristes qui se rendent à Porapora. À ce moment-là, une réception des touristes est organisée par la population de Porapora, comprenant des chants, des danses et des festins tahitiens. Quand c'est fini, les touristes vont faire le tour de Porapora. Puis ils vont assister à la façon de réaliser la pêche aux cailloux à Porapora.\nVoici l'organisation de cette sorte de pêche. Toute la population de Porapora y va, hommes, femmes et enfants arborant des couronnes sur la tête, des colliers au cou, portant des paréos de toutes sortes. À ce moment-là, ils entrent tous dans l'eau pour faire un enclos de palmes tressées. Ceci fait, d'autres hommes vont en pirogue à un endroit éloigné en jetant des cailloux dans l'eau pour chasser les poissons vers l'enclos. Au même moment, tous les poissons se précipitent dans l'enclos du rivage.\nC'est alors que les touristes approchent pour admirer les poissons à l'intérieur de l'enclos, prenant des photos et filmant ce genre de pêche. Tous les touristes peuvent entrer dans l'enclos et prendre le poisson qu'ils veulent. Cette façon de pêcher à Porapora leur plaît. Et c'est pourquoi tant de touristes vont à Porapora pour assister à cette sorte de pêche.","l":"L26"},"L26-T145":{"p":"145","t":"La légende de l'arbre à pain","tah":"Te ʻaʻamu nō te ʻuru.\nI te tau mātāmua, te vai ra ia te hōʻē metua vahine, ua pohe tā na tāne, ʻē e mea rahi roa tā na mau tamariʻi. I te reira tau, ʻoia hoʻi i te tau mātāmua i te poheraʻa tā na tāne, ua toe noa mai ʻoia anaʻe iho ʻē tā na mau tamariʻi. Nō reira, nō te faʻaʻamuraʻa i tā na mau tamariʻi, e haere ʻoia e faʻaʻapu nō te tanu i te māʻa. Nā mua aʻe, nā tā na ia tāne e haere e faʻaʻapu, ʻē e ʻimi i te māʻa nō te faʻaʻamu ia rātou. I teie nei, ua pohe te tāne a taua vahine ra ; nā na atu ra ia e ʻimi i te māʻa.\nI taua tau ra, ua oʻe pau roa te fenua i te māʻa. Ua fifi roa teie vahine ʻē tā na mau tamariʻi, nō te mea te oʻe nei rātou i te māʻa. I te tahi mahana, ua haere ʻoia i te pae tahatai ʻē ua mihi noa ʻoia i tā na tāne.\nI te reira taime, ua haere mai te hōʻē taʻata. Ua parau atu ia na :\n– E aha tā ʻoe e mihi nei ?\nUa pāhono atu teie vahine :\n– Te mihi nei au nō te mea ʻaita tā mātou e māʻa faʻahou.\nUa parau atu ra teie taʻata :\n– I teie nei, ʻeiaha ʻoe e mihi nō te mea e roaʻa tā ʻoutou māʻa.\nI te reira taime, ua parau taua taʻata ra i teie vahine :\n– ʻEiaha roa ʻoe e mihi faʻahou, nō te mea ananahi ia poʻipoʻi, ia ara mai ʻoe, e ʻite ʻoe i te hōʻē tumu ʻuru i mua i tō ʻoe fare. Taua tumu ʻuru ra, ʻo tō ʻu ia tino ʻo tā ʻu i faʻariro ʻei tumu ʻuru, ia ora ʻoe ʻe tā ʻoe mau tamariʻi.\nI te poʻipoʻi aʻe, i te araraʻa mai teie vahine, ua tupu te tumu ʻuru e te hotu noa ra. Ua ʻī roa i te māʻa. Ua ʻoaʻoa roa teie vahine nō te mea ʻauaʻe teie taʻata, i ʻamu ai rātou i te māʻa, nō te mea ua faʻariro teie taʻata i tō na tino ʻei tumu ʻuru. Nō reira mai, te ʻaʻamu nō te tumu ʻuru, ʻoia hoʻi te ʻuru.","fr":"La légende de l'arbre à pain.\nAux premiers temps, il y avait une mère dont le mari était mort et qui avait beaucoup d'enfants. En ce temps-là, c'est-à-dire au début de son veuvage, elle restait toujours seule avec ses enfants. Aussi, pour nourrir ses enfants, elle devait cultiver la terre pour faire pousser de quoi manger. Avant, c'était en effet son mari qui allait travailler la terre et chercher la nourriture pour les faire manger. Maintenant, le mari de cette femme était mort : c'était à elle d'aller chercher la nourriture.\nEn ce temps-là, pour tout le pays, c'était la disette de vivres. Cette femme et ses enfants étaient bien en peine car ils étaient démunis de nourriture. Un jour, elle partit au bord de la mer et se mit à pleurer son mari.\nÀ ce moment-là survint un homme. Il lui dit :\n– Qu'as-tu à pleurer ?\nLa femme lui répondit :\n– Je suis en train de pleurer parce que nous n'avons plus rien à manger.\nL'homme lui dit alors :\n– Maintenant ne pleure plus car vous aurez de quoi manger.\nCet homme dit alors à cette femme :\n– Ne te lamente plus car demain matin, quand tu te réveilleras, tu verras un arbre à pain devant chez toi. Cet arbre à pain, ce sera mon corps que j'aurai transformé en arbre à pain, afin que tu vives, toi et tes enfants.\nLe lendemain matin, quand la femme s'éveilla, l'arbre avait poussé et portait déjà des fruits. Il était tout plein de fruits. La femme fut remplie de joie parce que, grâce à cet homme, ils pouvaient manger, car il avait changé son corps en arbre à pain. De là la légende de l'arbre à pain, ou du fruit à pain.","l":"L26"},"L26-T146":{"p":"146","t":"La Journée des lépreux","tah":"Te parau nō te mau rēpera nō ʻOrofara i Tahiti.\nUa tupu i Tahiti i te mau matahiti i mua te hōʻē ʻōroʻa nō te mau rēpera nō Tahiti, ʻoia hoʻi nō ʻOrofara. Ua parau hia taua mahana ra, te mahana o te mau rēpera.\nHou aʻe i tupu ai tērā ʻōroʻa rahi, ua raverahi ia mau tauihaʻa i hōpoi hia i te pū nō ʻOrofara, te vāhi tei reira te mau rēpera. Ua hōroʻa hia nā rātou e raverahi mau māʻa, te mau tauihaʻa ʻē tae roa atu i te mau haʻuti nā te mau tamariʻi, ʻoia atoʻa hoʻi te mau tuhaʻa moni.\nIa tae i taua mahana ʻōroʻa ra, ua haere ia te tāvana rahi i ʻOrofara nō te faʻahanahana i te ʻōroʻa a te mau rēpera. I te reira poʻipoʻi, ua haʻamata hia ia te ʻōroʻa nā roto i te hōʻē faʻataʻiraʻa pū a te mau faʻehau. Ia oti te reira, ua paraparau mai te tāvana rahi, mai te pāhono hia atu e te tāvana nō ʻOrofara. Ua paraparau faʻahou te tāvana rahi nō te pāhonoraʻa i te tāvana nō ʻOrofara. Ia oti te reira, ʻo te mau hīmene ia nā tō ʻOrofara. I muri iho, ua tomo mai te mau huru faʻaroʻo atoʻa, te mau pupu hīmene, nō te faʻahanahana i te ʻōroʻa a te mau rēpera, e tae roa atu i te ahiahi.\nI taua mahana atoʻa ra, ua raverahi mau hīmene e hīmene hia mai e te mau rēpera iho nō ʻOrofara ; ʻoia atoʻa hoʻi te mau pupu faʻaʻārearea nō te ʻoire nō Papeʻete, te mau pupu hīmene ʻē te ʻori, ʻoia hoʻi te pupu Heiva, te pupu Maeva Tahiti, te pupu Tahiti Nui ʻē te pupu Paulina nō te haere mai e faʻahanahana i taua ʻōroʻa ra. Ua hīmene atoʻa mai ia te mau pupu faʻaroʻo huru rau.\nNō te ʻōpaniraʻa i teie ʻōroʻa, ua paraparau faʻahou ia te tāvana nō ʻOrofara, mai te haʻamaurūru hia atu e te tāvana rahi. Ia oti, e himene hia mai te himene nō te taʻaʻēraʻa nā te pupu iho nō ʻOrofara ʻe ʻo te faʻaotiraʻa ia te ʻōroʻa o te mau rēpera. I te reira taime ua hoʻi pau roa te mau taʻata i te ʻoire nō Papeʻete.\nʻO te huru ia o te mau faʻanahoraʻa nō te ʻōroʻa o te mau rēpera i Tahiti.","fr":"Quelques mots sur les lépreux de 'Orofara à Tahiti.\nAutrefois, chaque année, avait lieu à Tahiti une fête pour les lépreux de Tahiti, plus précisément de 'Orofara. On appelait cette journée la Journée des lépreux.\nAvant que cette grande fête ait lieu, de nombreux cadeaux étaient portés au centre de 'Orofara, lieu où habitaient les lépreux. On leur offrait beaucoup de provisions, des colis, jusqu'à des jouets pour les enfants, et aussi de l'argent.\nQuand arrivait ce jour de fête, le gouverneur allait à 'Orofara pour honorer la fête des lépreux. Ce matin-là, la fête commençait par une fanfare militaire. Cela terminé, le gouverneur faisait un discours suivi de la réponse du chef de 'Orofara. Puis le gouverneur parlait à nouveau pour répondre au chef de 'Orofara. Puis, c'étaient les chants de ceux de 'Orofara. Après se présentaient tous les groupements religieux, les groupes de chant, pour honorer la fête des lépreux jusqu'à la soirée.\nAu cours de cette journée, il y avait beaucoup de chants qui étaient chantés par les lépreux de 'Orofara eux-mêmes ; il y avait aussi des orchestres de divertissement venus de la ville de Pape'ete, des groupes de chants et de danses folkloriques, comme le groupe Heiva, le groupe Maeva Tahiti, le groupe Tahiti Nui et le groupe Paulina qui venaient honorer la fête. Les groupes religieux de toutes sortes chantaient aussi.\nPour clore cette fête, le chef de 'Orofara reprenait la parole et était remercié par le gouverneur. Cela fini, le chant des adieux était entonné par le groupe même de 'Orofara et c'était la fin de la fête des lépreux. Alors tout le monde rentrait en ville, à Pape'ete.\nC'est ainsi qu'était organisée la fête des lépreux à Tahiti.\n(Remarque du livre : cette fête est tombée en désuétude mais le village existe toujours.)","l":"L26"}},"L":[{"id":"L01","num":1,"t":"Prononciation","b":0,"g":["L01-G1","L01-G2","L01-G3","L01-G4","L01-G5","L01-G6","L01-G6b","L01-G7","L01-G8","L01-G9"],"u":["L01-U01","L01-U02","L01-U03","L01-U04"]},{"id":"L02","num":2,"t":"Les articles","b":0,"g":["L02-G11","L02-G11b","L02-G12","L02-G13a","L02-G13b","L02-G13c"],"u":["L02-U01","L02- function checkAnswer(input,answers,lang){
  const inN=norm(input); if(!inN)return {ok:false,expected:answers[0]};
  const all=answers.flatMap(variants);
  for(const a of all){if(norm(a)===inN)return {ok:true,expected:a};}
  if(lang==='fr'){for(const a of all){if(frCore(a)===frCore(input))return {ok:true,expected:a};}}
  for(const a of all){
    const A=norm(a);
    if(lang==='fr'){
      if(stripMarks(frCore(a))===stripMarks(frCore(input)))return {ok:true,warn:true,expected:a,why:'Attention aux accents.'};
    }else{
      const e1=noEta(A)===noEta(inN), m1=stripMarks(A)===stripMarks(inN), both=stripMarks(noEta(A))===stripMarks(noEta(inN));
      if(e1)return {ok:true,warn:true,expected:a,why:'Attention au ʻeta (ʻ).'};
      if(m1)return {ok:true,warn:true,expected:a,why:'Attention aux macrons (ā ē ī ō ū).'};
      if(both)return {ok:true,warn:true,expected:a,why:'Attention au ʻeta et aux macrons.'};
    }
  }
  return {ok:false,expected:all[0]};
}

function srsUpdate(key,q){ // q : 0..5
  const t=today(); let r=S.srs[key]||{ef:2.5,iv:0,n:0,due:t,lap:0,seen:t};
  if(q<3){r.n=0;r.iv=1;r.lap=(r.lap||0)+1;}
  else{r.n+=1;r.iv=r.n===1?1:r.n===2?3:Math.round(r.iv*r.ef);}
  r.ef=Math.max(1.3,r.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  r.due=addDays(t,r.iv); r.last=t; S.srs[key]=r;
}
